services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    ports: ["127.0.0.1:5432:5432"]  # только для локальной отладки
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://fsp:fsp@db:5432/fsp
      # демо для жюри: DEMO=1 docker compose up (вход за персонажей, код почты в ответе); по умолчанию выключено
      DEMO: ${DEMO:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@fsp-career.local}
      # перец для HMAC кодов входа; задайте постоянный на стенде, иначе коды сгорают при рестарте
      SECRET_KEY: ${SECRET_KEY:-}
      # адрес стенда в браузере: redirect_uri ФСП ID и issuer мок-провайдера
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      # ФСП ID (Keycloak OIDC): пусто + DEMO=1 → встроенный мок /mock-fsp-id; боевой — issuer realm, клиент и секрет
      FSP_ID_ISSUER: ${FSP_ID_ISSUER:-}
      FSP_ID_CLIENT_ID: ${FSP_ID_CLIENT_ID:-fsp-career}
      FSP_ID_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET:-}
      FSP_ID_MOCK: ${FSP_ID_MOCK:-}
      # локальная модель на хосте (ollama serve); недоступна → подбор на правилах
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:32b-instruct}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./frontend:/srv/frontend:ro]
    ports: ["8000:8000"]

volumes:
  pgdata:
