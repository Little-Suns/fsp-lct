services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    ports: ["127.0.0.1:5432:5432"]  # только для локальной отладки
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp"]
      interval: 2s
      retries: 30

  api:
    build: { context: ., dockerfile: backend/Dockerfile }  # контекст — корень: во фронт образа нужен frontend/
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://fsp:fsp@db:5432/fsp
      # демо для жюри: DEMO=1 docker compose up (вход за персонажей, код почты в ответе); по умолчанию выключено
      DEMO: ${DEMO:-0}
      # процессов uvicorn — строго 1: SSE чата (services/chat.Hub), троттлинг Codeforces/CTFtime и перец SECRET_KEY
      # по умолчанию живут в памяти процесса; 50 пользователей стенда один процесс держит с запасом (table.md, loadtest/)
      WEB_CONCURRENCY: 1
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@fsp-career.local}
      # перец для HMAC кодов входа; задайте постоянный на стенде, иначе коды сгорают при рестарте
      SECRET_KEY: ${SECRET_KEY:-}
      # адрес стенда в браузере: redirect_uri ФСП ID и issuer мок-провайдера
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      # ФСП ID (Keycloak OIDC): пусто + DEMO=1 → встроенный мок /mock-fsp-id; боевой — issuer realm, клиент и секрет
      FSP_ID_ISSUER: ${FSP_ID_ISSUER:-}
      FSP_ID_CLIENT_ID: ${FSP_ID_CLIENT_ID:-fsp-career}
      FSP_ID_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET:-}
      FSP_ID_MOCK: ${FSP_ID_MOCK:-}
      FSP_ID_IDPS: ${FSP_ID_IDPS:-}
      # LLM: none — только правила (стенд жюри: без GPU и ключей); ollama — локальная модель на хосте (ollama serve);
      # yandexgpt / gigachat — российские облачные (ключи ниже). Пустые значения = пресет провайдера, см. README
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBED_MODEL: ${EMBED_MODEL:-}  # none — без эмбеддингов
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_API_KEY: ${LLM_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-}
      LLM_CA_BUNDLE: ${LLM_CA_BUNDLE:-}
      # песочница задач на код; без SANDBOX_TOKEN задачи на код не выдаются (тест — без них)
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    # DEMO=1: пустая база при старте засевается синтетикой от сегодняшней даты (~1 мин до ответа API; засеянную не трогает,
    # пересоздать стенд — seed.generate --reset вручную); без DEMO — только миграции, как в боевом режиме
    command: ["sh", "-c", "if [ \"$$DEMO\" = 1 ]; then python -m seed.generate --if-empty --today now; fi; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # правка фронта без пересборки — docker-compose.override.yml.example (скопируйте в docker-compose.override.yml)
    ports: ["8000:8000"]
    networks: [default, sandbox]

  # исполнение кода кандидатов (nsjail на каждый тест): Python 3.11, TypeScript на Node 22.
  # privileged нужен nsjail для пространств имён и cgroup v2 внутри контейнера — ядро общее с хостом, см. README «Песочница».
  # Только внутренняя сеть sandbox: ни портов на хост, ни выхода наружу; говорит с ней только api по общему секрету.
  sandbox:
    build: ./sandbox
    privileged: true
    cgroup: private
    read_only: true
    tmpfs: ["/run/sbx:size=256m"]
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_WORKERS: ${SANDBOX_WORKERS:-4}  # одновременных прогонов; каждый — 1 CPU, до 256 МБ
    cpus: ${SANDBOX_CPUS:-4}
    mem_limit: 3g
    pids_limit: 512
    networks: [sandbox]
    restart: on-failure:3
    healthcheck:  # /health — пробный прогон Python и TypeScript в nsjail
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

networks:
  sandbox:
    internal: true

volumes:
  pgdata:
