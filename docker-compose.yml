services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    ports: ["127.0.0.1:5432:5432"]  # только для локальной отладки
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://fsp:fsp@db:5432/fsp
      # демо для жюри: DEMO=1 docker compose up (вход за персонажей, код почты в ответе); по умолчанию выключено
      DEMO: ${DEMO:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@fsp-career.local}
      # перец для HMAC кодов входа; задайте постоянный на стенде, иначе коды сгорают при рестарте
      SECRET_KEY: ${SECRET_KEY:-}
      # локальная модель на хосте (ollama serve); недоступна → подбор на правилах
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:32b-instruct}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      # песочница задач на код; без SANDBOX_TOKEN задачи на код не выдаются (тест — без них)
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./frontend:/srv/frontend:ro]
    ports: ["8000:8000"]
    networks: [default, sandbox]

  # исполнение кода кандидатов (nsjail на каждый тест): Python 3.11, TypeScript на Node 22.
  # privileged нужен nsjail для пространств имён и cgroup v2 внутри контейнера — ядро общее с хостом, см. README «Песочница».
  # Только внутренняя сеть sandbox: ни портов на хост, ни выхода наружу; говорит с ней только api по общему секрету.
  sandbox:
    build: ./sandbox
    privileged: true
    cgroup: private
    read_only: true
    tmpfs: ["/run/sbx:size=256m"]
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_WORKERS: ${SANDBOX_WORKERS:-4}  # одновременных прогонов; каждый — 1 CPU, до 256 МБ
    cpus: ${SANDBOX_CPUS:-4}
    mem_limit: 3g
    pids_limit: 512
    networks: [sandbox]
    restart: on-failure:3
    healthcheck:  # /health — пробный прогон Python и TypeScript в nsjail
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

networks:
  sandbox:
    internal: true

volumes:
  pgdata:
