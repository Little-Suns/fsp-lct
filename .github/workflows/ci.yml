name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsp" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Тесты и покрытие ≥ 80 % (каждый набор в своей базе)
        run: ./test.sh
      - name: Отчёт покрытия
        if: always()
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          uv run coverage html -d htmlcov || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov
          if-no-files-found: ignore
      - name: Самопроверки модулей
        run: |
          uv run python -m app.integrations.scoring
          uv run python -m app.services.parsing
          uv run python -m app.services.lottery
          uv run python -m app.services.irt
          uv run python -m seed.gold

  sandbox:
    # песочница задач на код против настоящего nsjail: вердикты, попытки выхода, эталоны банка на Python и TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Образ песочницы (target test)
        run: docker build --target test -t fsp-sandbox-test sandbox
      - name: Тесты песочницы (privileged, cgroup v2)
        run: docker run --rm --privileged -v "$GITHUB_WORKSPACE/backend/app/services/code_items.py:/srv/code_items.py:ro" fsp-sandbox-test
      - name: Песочница из docker-compose (read_only, cgroup private, внутренняя сеть) — здорова и без выхода наружу
        run: |
          export SANDBOX_TOKEN=$(openssl rand -hex 16)
          docker compose up -d --build --wait sandbox
          docker compose exec -T sandbox python3 -c "import socket
          for h in [('1.1.1.1', 80), ('github.com', 443)]:
              try:
                  socket.create_connection(h, timeout=3)
                  raise SystemExit(f'выход наружу открыт: {h}')
              except OSError:
                  pass
          print('выхода наружу нет')"
          test -z "$(docker compose port sandbox 8080 2>/dev/null)"
          docker compose down
      - name: Логи песочницы из compose
        if: failure()
        run: docker compose logs sandbox || true

  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsp" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Синтаксис JS в index.html
        run: |
          node -e "const s=require('fs').readFileSync('index.html','utf8');const m=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]).join('\n');require('fs').writeFileSync('/tmp/app.js',m)"
          node --check /tmp/app.js
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Зависимости бэкенда (сервер для e2e)
        working-directory: backend
        run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Песочница для e2e (настоящий nsjail, порт только на 127.0.0.1)
        run: |
          docker build --target runtime -t fsp-sandbox ../sandbox
          echo "SANDBOX_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "SANDBOX_URL=http://127.0.0.1:8091" >> "$GITHUB_ENV"
      - name: Запуск песочницы
        run: |
          docker run -d --name sandbox --privileged -p 127.0.0.1:8091:8080 -e SANDBOX_TOKEN fsp-sandbox
          for i in $(seq 60); do curl -fs "$SANDBOX_URL/health" && break; sleep 1; done
          curl -fs "$SANDBOX_URL/health" || { docker logs sandbox; exit 1; }
      - name: E2E (Playwright, база fsp_e2e) и покрытие JS ≥ 80 %
        run: npm test
      - name: Логи песочницы
        if: failure()
        run: docker logs sandbox || true
      - name: Сводка покрытия
        if: always()
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
