      ${S.finish && S.finish.note ? `<div class="alert warn"><span>!</span><span>${esc(S.finish.note)}${S.finish.attempt ? ` Результат попытки: θ = ${S.finish.attempt.theta.toFixed(2)} ± ${S.finish.attempt.se.toFixed(2)}.` : ''}</span></div>` : ''}
      ${R.lower_offer ? `<div class="alert info" id="lower-offer"><span>↓</span><span>Последняя попытка показала <b>${esc(R.lower_offer.grade)}</b> (θ = ${R.lower_offer.theta.toFixed(2)} ± ${R.lower_offer.se.toFixed(2)}) — ниже вашего грейда ${esc(c.grade)}. Сам грейд не понижается. Если согласны с результатом, можете принять его: категория станет ${esc(R.lower_offer.grade)}, срок повышения не сдвинется. <button class="btn ghost small" data-act="ask-lower">Принять грейд ${esc(R.lower_offer.grade)}</button></span></div>
      ${confirmBox('acceptLower', `Принять грейд ${esc(R.lower_offer.grade)} вместо ${esc(c.grade)}? Категория и место в выдаче изменятся сразу, вернуть прежний грейд можно только новым тестом — повышение не раньше конца кулдауна.`, `Принять ${esc(R.lower_offer.grade)}`)}` : ''}
      <div class="panel">
        <div class="row sb"><h3>Компетенции</h3><span class="muted small">точка — оценка θ, полоса — погрешность</span></div>
        <div style="margin-top:18px">${compRows(R.competencies)}</div>
      </div>
      ${up.next_grade ? `<div class="alert info"><span>↑</span><span>До ${esc(up.next_grade)} не хватает уверенности: грейд повышается, когда вся полоса погрешности выше порога. ${up.allowed_at ? `Повторная попытка — с <b>${DATE(up.allowed_at)}</b>.` : 'Пересдать можно сейчас.'}${up.review_required ? ` Для ${esc(up.next_grade)} добавится разбор решения: 3–4 вопроса по вашим ответам, около 10 минут.` : ''}</span></div>` : ''}
    </div>
    <aside class="stack">
      <div class="panel tight stack-s">
        <span class="label">Уровни доверия</span>
        <div class="trust">
          <div><span class="dot on"></span><div><b>${R.express ? 'Экспресс-оценка' : 'Тест пройден'}</b><br><span class="muted small">${DATE(R.tested_at)}</span></div></div>
          <div><span class="dot ${R.review_passed ? 'on' : ''}"></span><div><b>Разбор решения</b><br><span class="muted small">${R.review_passed ? 'пройден' : 'нужен для Senior и выше'}</span></div></div>
          <div><span class="dot ${ME && ME.employer_confirmed ? 'on' : ''}"></span><div><b>Подтверждён работодателем</b><br><span class="muted small">${ME && ME.employer_confirmed ? ME.employer_confirmed + ' раз' : 'после первого собеседования'}</span></div></div>
          ${fsp ? `<div><span class="dot on"></span><div><b>ФСП</b> · ${esc(fsp.title)}</div></div>` : ''}
          ${hack ? `<div><span class="dot on"></span><div><b>Хакатон</b> · ${esc(hack.title)}</div></div>` : ''}
          ${cf ? `<div><span class="dot on"></span><div><b>Codeforces</b> · <span class="num">${Math.round(cf.rating)}</span></div></div>` : ''}
        </div>
      </div>
      <button class="btn primary block" data-go="/c/home">Готово, жду приглашений</button>
      <button class="btn ghost block" data-go="/c/quest">Пройти тест ещё раз</button>
      <button class="btn ghost block" data-act="pdf">PDF-профиль</button>
    </aside>
  </div>
  ${historyPanel()}`;
};

      ${list.map(inv => `<button class="inv" data-go="/c/invite/${inv.id}">

          </span>

// отзыв о компании через неделю после принятия (в демо — сразу): по желанию, один раз; компания не узнаёт автора
function companyFeedback(inv) {
  if (inv.company_feedback) return `<div class="alert info"><span>✓</span><span>Спасибо, отзыв о компании учтён.</span></div>`;
  if (!inv.feedback_open) return '';
  const opts = Object.entries((META && META.company_feedback) || {});
  return `<div class="panel stack">
    <h3>Как прошло общение с компанией?</h3>
    <p class="small muted">По желанию. Отзыв не подписан: компания видит только общую сводку. Он помогает отсеивать работодателей, которые не выходят на связь или зовут на несуществующие вакансии.</p>
    <div class="chips">${opts.map(([k, x]) => `<button class="chip ${S.coFb === k ? 'on' : ''}" data-act="co-fb" data-v="${k}">${esc(x)}</button>`).join('')}</div>
    <div class="row"><button class="btn primary" ${S.coFb ? '' : 'disabled'} data-act="co-fb-send" data-id="${inv.id}">Отправить отзыв</button></div>
  </div>`;
}

function inviteView() {
  const inv = D.inv;
  if (!inv) return `${crumbs([['Кабинет', '/c/home'], ['Приглашение']])}<div class="panel">Приглашение не найдено.</div>`;
  const id = inv.id;
  const reasons = Object.entries((META && META.decline_reasons) || {});
  const r = inv.recruiter || {};
  const live = inv.status !== 'declined' && inv.status !== 'expired';
  // приложенное задание (task_id) — среди заданий приглашения; нет там (компания заблокирована, задание удалено) — только текст
  const linked = live && inv.task_id != null ? (D.invTasks || []).find(t => t.id === inv.task_id) : null;
  let actions = '';
  if (inv.status === 'accepted') {
    const me = inv.company_sees || {};
    actions = `<div class="panel stack">
      <div class="alert ok"><span><b>Вы приняли приглашение.</b> Ваши контакты открыты компании.</span></div>
      <dl class="kv"><dt>Компания видит</dt><dd>${[me.name, me.email, me.tg].filter(Boolean).map(esc).join(', ')}</dd></dl>
    </div>${companyFeedback(inv)}`;
  } else if (inv.status === 'declined') {
    actions = `<div class="alert bad">Вы отклонили приглашение. Причина «${esc(inv.reason)}» передана компании без ваших контактов.</div>`;
  } else if (inv.status === 'expired') {
    actions = `<div class="alert warn">Срок ответа истёк. Компания видит, что приглашение осталось без ответа.</div>`;
  } else if (S.declineFor === id) {
    actions = `<div class="panel stack">
      <h3>Почему нет?</h3>
      <p class="small muted">Компания увидит только причину. Это помогает подбирать вам более точные предложения.</p>
      <div class="chips">${reasons.map(([k, x]) => `<button class="chip ${S.declineReason === k ? 'on' : ''}" data-act="reason" data-v="${k}">${esc(x)}</button>`).join('')}</div>
      <textarea class="input" id="dc-comment" placeholder="Комментарий, по желанию" style="min-height:70px">${esc(S.dcComment)}</textarea>
      <div class="row"><button class="btn danger" ${S.declineReason ? '' : 'disabled'} data-act="decline" data-id="${id}">Отклонить</button><button class="btn ghost" data-act="cancel-decline">Отмена</button></div>
    </div>`;
  } else {
    actions = `<div class="row"><button class="btn primary" data-act="accept" data-id="${id}">Принять и открыть мои контакты</button><button class="btn ghost" data-act="ask-decline" data-id="${id}">Нет: указать причину</button></div>`;
  }
  if (inv.chat_peer != null) actions = `<div class="row">${chatBtn('c', inv.chat_peer, 'btn ghost')}</div>` + actions;
  return `
  ${crumbs([['Кабинет', '/c/home'], [esc(inv.company)]])}
  ${subnav('c')}
  <div class="grid side fade">
    <div class="stack">
      ${domainWarn(inv)}
      <div class="panel stack">
        <div class="row co-head"><span class="logo-sq" style="background:${esc(inv.color)}">${esc(inv.company[0])}</span><div><b>${esc(inv.company)}</b><br><span class="small muted">${esc(inv.about)}</span></div><span class="co-chips">${coChip(inv)}</span></div>
        <h2>${esc(inv.role)}</h2>
        <div class="row" style="gap:20px">
          <div class="stat"><span class="label">Вилка на руки</span><b class="num" style="font-size:24px"><span class="money">${RUB(inv.from)}</span> — <span class="money">${RUB(inv.to)}</span></b></div>
        </div>
        <div class="alert ${inv.fork_check.ok ? 'ok' : 'warn'}">${esc(inv.fork_check.text)}.</div>
        <dl class="kv">
          <dt>Формат</dt><dd>${esc(inv.format)}</dd>
          <dt>О работе</dt><dd class="prose pre" style="font-size:14px">${esc(inv.desc) || '<span class="muted">—</span>'}</dd>
          <dt>Задача</dt><dd>${inv.task ? esc(inv.task) : '<span class="muted">не приложена</span>'}${!linked ? '' : `<div class="row small" style="gap:6px;margin-top:6px">${linked.submitted
            ? `<span class="status s-ok">решение отправлено</span>${resultChips(linked)}<button class="btn ghost small" data-go="/c/task/${linked.id}/${id}">Ваше решение</button>`
            : `<button class="btn primary small" data-go="/c/task/${linked.id}/${id}">Открыть задачу</button>`}</div>`}</dd>
          ${isOpen(inv) ? `<dt>Срок ответа</dt><dd>${inv.due} дн. из ${(META && META.invite_ttl_days) || 7}</dd>` : ''}
          <dt>Почему вы</dt><dd>${esc(inv.why) || '<span class="muted">—</span>'}</dd>
        </dl>
        ${inv.task && live ? `<div class="alert info"><span>→</span><span>${linked ? 'Это не задача компании, а адаптивный тест платформы под эту вакансию, по желанию: задания сместятся к нужным компетенциям, грейд считается как обычно. Задача компании — кнопка «Открыть задачу» выше.'
          : 'Можно пройти тест под эту вакансию: задания сместятся к нужным компетенциям, грейд считается как обычно.'} <button class="btn ghost small" data-act="quest-invite" data-id="${id}">Пройти тест по приглашению</button></span></div>` : ''}
      </div>
      ${(D.invTasks || []).length ? `<div class="panel stack-s">
        <h3>Задания по приглашению</h3>
        <p class="small muted">Задания компании по этой вакансии. Решение уйдёт вместе с приглашением, контакты не раскрываются.</p>
        ${D.invTasks.map(t => `<div class="row sb" style="padding:6px 0;border-bottom:1px dashed var(--line-2)"><button class="btn ghost small" data-go="/c/task/${t.id}/${id}" style="justify-content:flex-start;text-align:left">${esc(t.title)}</button><span class="row small" style="gap:6px"><span class="muted">${KIND_T[t.kind] || esc(t.kind)} · ~${t.minutes} мин</span>${t.submitted ? resultChips(t) : '<span class="chip">не решено</span>'}</span></div>`).join('')}
      </div>` : ''}
      ${actions}
    </div>
    <aside class="stack">
      <div class="panel tight stack-s">
        <span class="label">Связаться с компанией</span>
        <dl class="kv small" style="grid-template-columns:auto 1fr"><dt>Рекрутер</dt><dd>${esc(r.name || '—')}</dd><dt>Почта</dt><dd>${esc(r.email || '—')}</dd><dt>Telegram</dt><dd>${esc(r.tg || '—')}</dd></dl>
        <span class="hint">Контакт компании виден сразу. Ваши контакты компания получит, только если вы примете приглашение.</span>
      </div>
      <div class="panel tight stack-s">
        <span class="label">Что знает компания сейчас</span>
        <p class="small">${inv.company_knows === 'contacts' ? 'Ваши ФИО и контакты: вы приняли приглашение.' : `Только анонимную карточку ${esc(inv.public_id)}. ФИО и контакты откроются после принятия.`}</p>
        <div class="divider"></div>
        <span class="label">Ваша нагрузка</span>
        <p class="small num">${inv.load.open} из ${inv.load.cap} открытых приглашений. Когда лимит заполнен, вы опускаетесь в выдаче, а компании видят «много предложений».</p>
      </div>
    </aside>
  </div>`;
}

    <div class="chips" role="group" aria-label="Варианты ответа">${(t.options || []).map((o, i) => `<button class="chip ${S.picks.includes(i) ? 'on' : ''}" aria-pressed="${S.picks.includes(i)}" data-act="tk-pick" data-v="${i}" data-multi="${at === 'multi' ? 1 : ''}">${esc(o)}</button>`).join('')}</div>`;
  if (at === 'number') return `<input class="input num" id="tk-answer" inputmode="decimal" maxlength="64" style="max-width:240px" placeholder="Число, например 42 или 3,14" value="${esc(S.answer)}">`;

  return `<textarea class="input" id="tk-answer" maxlength="5000" style="min-height:180px" placeholder="${t.kind === 'solve' ? 'Код или решение' : 'Опишите подход: что делаете, почему, какие риски'}">${esc(S.answer)}</textarea>`;
}

function lotteryPanel(n) {
  if (S.lot && S.lot.needId !== n.id) S.lot = null;
  const L = S.lot || (S.lot = { needId: n.id, must: [...n.must], fork_to: n.to || (D.picks && D.picks.market.p50), require_free: true, draw_count: 3, created: null, drawn: null, verify: null });
  const th = `<div class="row" style="gap:6px">${catTag(n.spec, n.track, n.grade + '+')}</div>`;
  let body;
  if (!L.created) {
    body = `
      <div class="parsed">
        <span class="label">Категория</span>${th}
        <span class="label">Навыки, подтверждённые тестом</span><div class="chips">${n.must.map(s => `<button class="chip ${L.must.includes(s) ? 'on' : ''}" data-act="lot-skill" data-v="${esc(s)}">${esc(s)}</button>`).join('') || '<span class="small muted">не заданы</span>'}</div>
        <span class="label">Ожидания на руки не выше</span><div><input class="input num" id="lot-fork" inputmode="numeric" value="${L.fork_to ? RUB(L.fork_to) : ''}" style="max-width:180px"></div>
        <span class="label">Сколько выбрать</span><div><input class="input num" id="lot-k" inputmode="numeric" value="${L.draw_count}" style="max-width:80px"></div>
      </div>
      <button class="switch" role="switch" aria-checked="${L.require_free}" data-act="lot-free"><i></i> Только без перегрузки (меньше ${CAP} открытых приглашений)</button>
      <div class="row"><button class="btn primary small" data-act="lot-create">Зафиксировать пул</button><span class="hint">Квота не тратится: она списывается, только когда вы отправляете приглашение</span></div>`;
  } else {
    const c = L.created;
    body = `
      <div class="alert info"><span>#</span><span>Порог прошли <b class="num">${c.pool_size}</b> кандидатов. Пул заморожен, хеш зерна опубликован до розыгрыша:<br><code style="word-break:break-all">${esc(c.seed_hash)}</code><br>Обязательство (порог + пул + число мест): <code style="word-break:break-all">${esc(c.commitment || '')}</code><br><a class="small" href="/api/lottery/${c.id}/public" target="_blank" rel="noopener">Публичная проверка</a> · повторная жеребьёвка по этой потребности невозможна</span></div>
      ${!L.drawn ? `<div class="row"><button class="btn primary small" data-act="lot-draw">Бросить жребий: ${L.draw_count} из ${c.pool_size}</button><button class="btn ghost small" data-act="lot-reset">Изменить порог</button></div>` : `
      <span class="small muted">Зерно раскрыто: <code style="word-break:break-all">${esc(L.drawn.seed)}</code>. Порядок — sha256(зерно + псевдоним кандидата); в публичной проверке видны только псевдонимы.</span>
      ${L.drawn.drawn.map(d => d.hidden || !d.public_id ? `<div class="cand" style="cursor:default"><div class="stack-s"><span class="muted">Кандидат скрыл профиль</span><span class="small muted">псевдоним <code>${esc(d.pseudonym)}</code> · пригласить нельзя</span></div></div>` : `<div class="cand" style="cursor:default">
          <div class="stack-s" style="min-width:0">
            <div class="row"><span class="id">Кандидат ${esc(d.public_id)}</span>${catTag(d.category.spec, d.category.track, d.category.grade)}${d.pseudonym ? `<span class="small muted" title="Псевдоним в публичной проверке">псевдоним <code>${esc(d.pseudonym)}</code></span>` : ''}</div>
            <div class="chips">${(d.skills_confirmed || []).map(s => `<span class="chip ${n.must.includes(s) || n.nice.includes(s) ? 'on' : ''}">${esc(s)}</span>`).join('')}</div>
            <span class="small muted num">перцентиль ${d.percentile ?? '—'} · θ ${d.theta != null ? d.theta.toFixed(2) + ' ± ' + (d.se || 0).toFixed(2) : '—'} · нагрузка ${d.load} / ${CAP}</span>
          </div>
          <div><button class="btn primary small" data-go="/e/invite/${esc(d.public_id)}?need=${n.id}">Пригласить</button></div>
        </div>`).join('')}
      <div class="row"><button class="btn ghost small" data-act="lot-verify">Проверить жеребьёвку</button><button class="btn ghost small" data-act="lot-reset">Новый розыгрыш</button></div>
      ${L.verify ? `<div class="alert ${L.verify.ok ? 'ok' : 'bad'}"><span>${L.verify.ok ? '✓' : '!'}</span><span>${L.verify.ok ? 'Проверка пройдена: sha256(зерно) совпал с опубликованным хешем, пул и порог совпали с обязательством, порядок жребия воспроизведён.' : `Проверка не пройдена: хеш ${L.verify.hash_ok ? 'совпал' : 'не совпал'}, обязательство ${L.verify.commitment_ok ? 'совпало' : 'не совпало'}, порядок ${L.verify.draw_ok ? 'совпал' : 'не совпал'}.`}</span></div>` : ''}`}`;
  }
  return `<div class="panel stack fold ${S.fold.lot ? 'open' : ''}">
    <div class="row sb"><h3>Лотерея среди прошедших порог</h3><span class="chip lot-tag">квалифицированная лотерея</span>${foldBtn('lot')}</div>

    ${body}
    </div>
  </div>`;
}

const onChat = () => /^\/[ce]\/chat(\/|$)/.test(route());
const chatSide = () => route().startsWith('/c') ? 'c' : 'e';
const chatMe = () => chatSide() === 'c' ? 'candidate' : 'employer';
const COARSE = matchMedia('(pointer: coarse)');  // сенсорный экран без мыши: телефон, планшет
const chatBtn = (side, peer, cls = 'btn ghost small') => peer == null ? '' : `<button class="${cls}" data-go="/${side}/chat/${esc(encodeURIComponent(peer))}">Написать в чат</button>`;
const WHEN = s => new Date(s).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function chatMessages() {
  const d = D.chatDetail, me = chatMe();
  if (!d.messages.length) return '<div class="muted small" style="text-align:center;margin:auto">Здесь будет история переписки</div>';

}

function chatList() {
  const peer = chatPeerOf(), d = D.chatDetail, side = chatSide();

  if (peer != null && d && !list.some(c => String(c.peer_id) === peer)) list = [{ peer_id: peer, peer_name: d.peer.name, unread_count: 0, last_message: null }, ...list];
  return list.map(c => `<button class="chat-peer ${String(c.peer_id) === peer ? 'on' : ''}" data-go="/${side}/chat/${esc(encodeURIComponent(c.peer_id))}">
      <span class="stack-s" style="min-width:0;flex:1"><b>${esc(c.peer_name)}</b><span class="small muted">${c.last_message ? (c.last_message.sender === chatMe() ? 'Вы: ' : '') + esc(c.last_message.text) : 'Нет сообщений'}</span></span>

}

function drawChat(stick = true) {
  const box = document.getElementById('chat-messages');
  if (!box || !D.chatDetail) return;

  box.innerHTML = chatMessages();

}
function drawChatSide() {
  UNREAD = ((D.chatContacts && D.chatContacts.contacts) || []).reduce((n, c) => n + c.unread_count, 0);
  const l = document.getElementById('chat-list');

async function loadChat(peer) {
  const me = chatMe();
  D.chatDetail = peer ? await api('GET', '/api/chat/' + encodeURIComponent(peer)).catch(e => { if (e.status === 403 || e.status === 404) return null; throw e; }) : null;
  if (D.chatDetail && D.chatDetail.messages.some(m => m.sender !== me && !m.read_at)) await api('POST', '/api/chat/' + encodeURIComponent(peer) + '/read');
  D.chatContacts = await api('GET', '/api/chat/contacts');
  UNREAD = D.chatContacts.contacts.reduce((n, c) => n + c.unread_count, 0);
}

// опрос раз в несколько секунд: подтягивает новые сообщения и отметки «прочитано», не трогая поле ввода
let chatBusy = false;
let chatAgain = false;  // сигнал пришёл, пока шёл прошлый опрос: после него повторяем
async function pollChat() {
  if (!onChat() || document.hidden || $app.hasAttribute('aria-busy')) return;
  if (chatBusy) { chatAgain = true; return; }
  chatBusy = true;
  const my = seq, peer = chatPeerOf(), d = D.chatDetail, me = chatMe();
  try {
    const dt = peer != null && d ? await api('GET', '/api/chat/' + encodeURIComponent(peer)) : null;
    if (my !== seq || !onChat()) return;
    if (dt && dt.messages.some(m => m.sender !== me && !m.read_at)) await api('POST', '/api/chat/' + encodeURIComponent(peer) + '/read');
    const cs = await api('GET', '/api/chat/contacts');
    if (my !== seq || !onChat()) return;
    D.chatContacts = cs;
    if (dt && D.chatDetail === d) {
      if (dt.can_write !== d.can_write) { d.can_write = dt.can_write; rerender(); }
      const first = dt.messages.length ? dt.messages[0].id : Infinity, sig = a => a.map(m => m.id + (m.read_at ? 'r' : '')).join();
      const merged = [...d.messages.filter(m => m.id < first), ...dt.messages];
      if (sig(merged) !== sig(d.messages)) { d.messages = merged; drawChat(false); }
    }
    drawChatSide();
  } catch (e) {
    // доступ закрыт посреди сессии (отозвано согласие, профиль скрыт): убираем уже загруженное
    if ((e.status === 403 || e.status === 404) && my === seq && onChat() && D.chatDetail === d) { D.chatDetail = null; rerender(); }
  } finally {
    chatBusy = false;
    if (chatAgain) { chatAgain = false; pollChat(); }
  }
}

// Push: сервер шлёт «data: new», когда у участника появилось новое; клиент после этого перечитывает данные обычными GET.
let chatCtl = null, chatStreamSide = null;
function chatStop() { if (chatCtl) chatCtl.abort(); chatCtl = chatStreamSide = null; }
async function chatNudge() {
  if (document.hidden) return;
  if (onChat()) return pollChat();
  const side = chatSide();
  if (!TOK[side] || !/^\/[ce]\//.test(route())) return;
  try {
    UNREAD = (await api('GET', '/api/chat/unread')).unread_count;
    if (route().startsWith('/' + side)) redrawNav(side);
  } catch { /* бейдж не критичен */ }
}
async function chatStream(side) {
  chatStop();
  const ctl = chatCtl = new AbortController();
  chatStreamSide = side;
  while (!ctl.signal.aborted) {
    try {
      const r = await fetch('/api/chat/stream', { headers: { Authorization: 'Bearer ' + TOK[side] }, signal: ctl.signal });
      if (r.status === 401 || r.status === 403) { if (chatCtl === ctl) chatCtl = chatStreamSide = null; return; }  // нет входа или профиля — без повторов
      if (!r.ok) throw new Error('stream ' + r.status);  // 5xx/429: не читаем тело, повтор через паузу
      chatNudge();  // догоняем всё, что пришло, пока потока не было (первое подключение и каждое переподключение)
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        if (parts.some(x => x.startsWith('data:'))) chatNudge();
      }
    } catch { /* обрыв сети или abort */ }
    if (!ctl.signal.aborted) await new Promise(res => setTimeout(res, 3000));  // переподключение
  }
}

async function chatSend() {
  const el = document.getElementById('chat-input'), peer = chatPeerOf(), text = el ? el.value.trim() : '';
  if (!text || peer == null) return;
  const m = await api('POST', '/api/chat/' + encodeURIComponent(peer), { text });
  if (chatPeerOf() !== peer) return;
  el.value = '';
  D.chatDetail.messages.push(m);
  drawChat();
  D.chatContacts = await api('GET', '/api/chat/contacts');
  drawChatSide();
}

async function chatMore() {
  const d = D.chatDetail, peer = chatPeerOf();
  if (!d || !d.messages.length) return;
  const r = await api('GET', `/api/chat/${encodeURIComponent(peer)}?before_id=${d.messages[0].id}`);
  if (D.chatDetail !== d) return;
  const box = document.getElementById('chat-messages'), h = box.scrollHeight;
  d.messages = [...r.messages, ...d.messages]; d.more = r.more;
  drawChat(false);
  box.scrollTop = box.scrollHeight - h;
}

// accept_prob из бэкенда (matching.accept_prob) для живой подсказки: формат ок, интерес к стеку 1
const acceptProb = (to, min) => { const r = Math.max(-.5, Math.min(.5, (to - min) / Math.max(min, 1))); const z = -0.55 + 7 * r + (r < 0 ? 7 * r : 0); return 1 / (1 + Math.exp(-z)); };

function inviteFormView() {
  const c = D.cand;
  const n = D.candNeed;
  if (!c) return `${crumbs([candFrom(n), ['Приглашение']])}<div class="panel">Кандидат не найден или скрыл профиль.</div>`;
  // без потребности (из поиска) — роль по категории кандидата, вилку компания указывает сама
  if (!S.inviteForm || S.inviteForm.cid !== c.id || S.inviteForm.needId !== (n ? n.id : null)) S.inviteForm = {
    cid: c.id, needId: n ? n.id : null, role: roleTitle(n || c), from: n && n.from, to: n && n.to, format: (n && n.format) || 'Гибрид',
    desc: n ? n.text : '', task: false, taskId: null, taskText: '', server: null,
  };
  const f = S.inviteForm, mk = c.market, maxW = (META && META.fork_max_width) || .4;
  // задача вместо созвона — из заданий компании, которые кандидат сможет открыть: публичные его специализации
  // или привязанные к потребности приглашения (tasks._can_see); подходящих нет — своим текстом
  const tasks = (D.mytasks || []).filter(t => (t.public && t.spec === c.spec) || (n && t.need_id === n.id));
  if (f.task && tasks.length && !tasks.some(t => t.id === f.taskId)) f.taskId = tasks[0].id;
  const errs = [], warns = [];
  if (!f.from || !f.to) errs.push('Укажите обе границы вилки.');
  else {
    if (f.from > f.to) errs.push('Нижняя граница больше верхней.');
    if (f.from < mk.p25) errs.push(`Нижняя граница ниже 25-го перцентиля рынка для ${c.grade} (${RUB(mk.p25)} на руки).`);
    if ((f.to - f.from) / f.from > maxW) errs.push(`Вилка слишком широкая: верхняя граница не больше нижней + ${Math.round(maxW * 100)} %.`);
    if (f.to < c.salary) warns.push(`Верхняя граница ниже минимума кандидата (${RUB(c.salary)} на руки). Вероятность принятия упадёт примерно до ${DEC(acceptProb(f.to, c.salary))}.`);
  }
  if (f.task && !tasks.length && !f.taskText.trim()) errs.push('Опишите задачу или снимите галочку.');
  if (f.server) { errs.push(...f.server.errors.filter(x => !errs.includes(x))); warns.push(...f.server.warnings.filter(x => !warns.includes(x))); }
  const q = D.quota || { used: 0, max: 1 };
  const ok = !errs.length && q.used < q.max;
  return `
  ${crumbs([candFrom(n), ['Кандидат ' + esc(c.id), '/e/cand/' + esc(c.id) + needQ(n)], ['Приглашение']])}
  ${coBanners()}
  <div class="grid side fade">
    <form class="panel stack" id="inv-form" novalidate>
      <h2>Приглашение для ${esc(c.id)}</h2>
      <label class="field"><span>Роль</span><input class="input" id="f-role" value="${esc(f.role)}"></label>
      <div class="field"><span>Вилка на руки, ₽ · обязательно</span>
        <div class="grid g2 pair" style="gap:10px">
          <span class="pfx" data-p="от"><input class="input num" id="f-from" inputmode="numeric" value="${f.from || ''}" aria-label="от"></span>
          <span class="pfx" data-p="до"><input class="input num" id="f-to" inputmode="numeric" value="${f.to || ''}" aria-label="до"></span>
        </div>
        <div id="f-msgs" class="stack-s">${errs.map(e => `<div class="alert bad">${esc(e)}</div>`).join('')}${warns.map(e => `<div class="alert warn">${esc(e)}</div>`).join('')}${!errs.length && !warns.length ? '<div class="alert ok">Вилка в рынке и покрывает ожидания кандидата.</div>' : ''}</div>
      </div>
      <div class="field"><span>Формат</span><div class="seg" role="group">${((META && META.formats) || ['Офис', 'Гибрид', 'Удалённо']).map(x => `<button type="button" data-act="fmt" data-v="${x}" aria-pressed="${f.format === x}">${x}</button>`).join('')}</div></div>
      <label class="field"><span>О работе</span><textarea class="input" id="f-desc" style="min-height:80px">${esc(f.desc)}</textarea></label>
      <label class="check"><input type="checkbox" id="f-task" ${f.task ? 'checked' : ''}> Приложить задачу вместо первого созвона</label>
      ${!f.task ? '' : tasks.length ? `<label class="field"><span>Задача</span><select class="input" id="f-task-id">${tasks.map(t => `<option value="${t.id}" ${t.id === f.taskId ? 'selected' : ''}>${esc(t.title)}, ~${t.minutes} мин</option>`).join('')}</select></label>`
        : `<label class="field"><span>Задача</span><input class="input" id="f-task-text" maxlength="500" placeholder="Что сделать и сколько времени займёт" value="${esc(f.taskText)}"><span class="hint">Заданий, которые кандидат сможет открыть, нет: нужно публичное по ${esc(c.spec)} или привязанное к потребности — раздел «Задания»</span></label>`}
      <div class="row small muted">Срок ответа — ${(META && META.invite_ttl_days) || 7} дней. Изменить нельзя.</div>
      ${q.used >= q.max ? '<div class="alert bad">Квота на неделю исчерпана. Обновится в понедельник.</div>' : ''}
      <div class="row"><button class="btn primary" type="submit" ${ok ? '' : 'disabled'}>Отправить приглашение</button><button class="btn ghost" type="button" data-go="/e/cand/${esc(c.id)}${needQ(n)}">Отмена</button></div>
    </form>
    <aside class="stack">
      <div class="panel tight stack-s">
        <span class="label">Квота</span>

        <div class="meter"><i style="width:${q.max ? Math.min(100, q.used / q.max * 100) : 100}%"></i></div>
      </div>
      <div class="panel tight stack-s">
        <span class="label">Рынок · ${esc(c.spec)} · ${esc(c.grade)}</span>
        <dl class="kv small num" style="grid-template-columns:auto 1fr"><dt>25-й перцентиль</dt><dd>${RUB(mk.p25)}</dd><dt>медиана</dt><dd>${RUB(mk.p50)}</dd><dt>75-й перцентиль</dt><dd>${RUB(mk.p75)}</dd></dl>
        <span class="hint">на руки</span>
        <span class="demo-tag">демо-данные</span>
      </div>
      <div class="panel tight stack-s">
        <span class="label">Кандидат ожидает</span>

function refFields(f) {
  const hint = '<span class="hint">Эталон видите только вы: кандидату и другим компаниям он не показывается. Система проверит ответ сразу после отправки, вручную переоценить можно в любой момент.</span>';
  if (f.answer_type === 'open') return '<span class="hint">Открытый ответ: решение оцениваете вы — сильное, нормально или слабо.</span>';
  if (f.answer_type === 'text') return `<label class="field"><span>Эталонные ответы — через «;»</span><input class="input" id="tx-answers" value="${esc(f.answers)}" placeholder="SIGTERM; TERM; 15"></label>
    <button class="switch" role="switch" aria-checked="${f.exact}" data-act="tx-set" data-k="exact"><i></i> Точное совпадение (иначе без учёта регистра, ё/е, лишних пробелов и знаков по краям)</button>${hint}`;
  if (f.answer_type === 'number') return `<div class="grid g2"><label class="field"><span>Эталон — число</span><input class="input num" id="tx-value" inputmode="decimal" value="${esc(f.value)}"></label>
    <label class="field"><span>Допуск ±</span><input class="input num" id="tx-tol" inputmode="decimal" value="${esc(f.tol)}" placeholder="0"></label></div>${hint}`;
  if (f.answer_type === 'regex') return `<label class="field"><span>Шаблон (регулярное выражение, полное совпадение, без учёта регистра)</span><input class="input" id="tx-pattern" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(f.pattern)}" placeholder="\\d{3}-\\d{2}"></label>${hint}`;
  return `<label class="field"><span>Варианты — по одному на строку, верные отметьте «*» в начале (сама звёздочка в вариант не входит)</span><textarea class="input" id="tx-opts" style="min-height:100px" placeholder="Read Committed&#10;Repeatable Read&#10;*Serializable">${esc(f.opts)}</textarea></label>${hint}`;
}

// эталон из полей формы; ошибки формата ловит и сервер (422)
function taskRef(f) {
  const at = f.answer_type, dec = x => parseFloat(String(x).replace(/\s/g, '').replace(',', '.'));
  if (at === 'open') return {};
  if (at === 'text') return { reference: { answers: f.answers.split(';').map(x => x.trim()).filter(Boolean), exact: f.exact } };
  if (at === 'number') {
    const value = dec(f.value), tolerance = String(f.tol).trim() ? dec(f.tol) : 0;
    if (!Number.isFinite(value) || !Number.isFinite(tolerance)) throw new Error('Эталон и допуск — числа');
    return { reference: { value, tolerance } };
  }
  if (at === 'regex') return { reference: { pattern: f.pattern } };
  const lines = f.opts.split('\n').map(x => x.trim()).filter(Boolean);
  return { options: lines.map(x => x.replace(/^\*\s*/, '')), reference: { correct: lines.flatMap((x, i) => x.startsWith('*') ? [i] : []) } };
}

const refText = t => {
  const r = t.reference;
  if (!r) return '';
  if (t.answer_type === 'text') return r.answers.join('; ') + (r.exact ? ' (точно)' : '');
  if (t.answer_type === 'number') return r.tolerance ? `${r.value} ± ${r.tolerance}` : String(r.value);
  if (t.answer_type === 'regex') return r.pattern;
  return r.correct.map(i => t.options[i]).join('; ');
};

      ${C ? `<div class="tbl-wrap"><table class="tbl">

      ${C.false_alarm != null ? `<p class="small muted">Ложные срабатывания на честных кандидатах: ${PCT(C.false_alarm)}</p>` : ''}` : VAL_RUN()}

        <div class="stat"><span class="label">Корреляция θ «Алгоритмы» и CF</span><b>${DEC(St.cf_spearman)}</b><span class="small muted">n = ${St.cf_n ?? '—'}, Спирмен</span></div>
        ${St.theta_corr != null ? `<div class="stat"><span class="label">Оценка θ и «истинный» θ</span><b>${DEC(St.theta_corr)}</b><span class="small muted">корреляция на синтетике</span></div>` : ''}
        <div class="stat"><span class="label">Утечка: сложность клона задания</span><b>±${DEC(St.clone_b_spread)}</b><span class="small muted">разброс b внутри семейства</span></div>

};

// разделяющая сила: сводка, матрица «истинный × тест» (доли строки), соседние грейды, по специализациям, задания
function vsep(Sp) {
  const G = Sp.grades, it = Sp.items;
  const quart = (label, q) => `<tr><td>${label}</td>${['min', 'q1', 'median', 'q3', 'max'].map(k => `<td class="num">${DEC(q[k])}</td>`).join('')}</tr>`;
  return `<div class="grid g3" style="gap:16px">
    <div class="stat"><span class="label">Точное совпадение грейда</span><b>${PCT(Sp.accuracy)}</b><span class="small muted">${Sp.accuracy_point != null ? `по θ̂ без запаса SE — ${PCT(Sp.accuracy_point)}` : 'грейд по θ − SE'}</span></div>
    <div class="stat"><span class="label">В пределах ±1 грейда</span><b>${PCT(Sp.within_one)}</b><span class="small muted">из ошибок в соседний грейд — ${PCT(Sp.adjacent_error_share)}</span></div>
    <div class="stat"><span class="label">κ с квадратичными весами</span><b>${DEC(Sp.qwk)}</b><span class="small muted">согласие истинного и тестового грейда</span></div>
  </div>
  <div class="tbl-wrap"><table class="tbl heat">
    <caption>Строки — истинный грейд, столбцы — грейд по тесту; в ячейке доля строки, рамка — совпадение</caption>
    <thead><tr><th scope="col">Истинный грейд</th>${G.map(g => `<th scope="col" class="num">${esc(g)}</th>`).join('')}<th scope="col" class="num">Точность</th></tr></thead>
    <tbody>${Sp.confusion.map((row, i) => { const n = row.reduce((a, b) => a + b, 0) || 1; return `<tr><th scope="row">${esc(G[i])}</th>${row.map((x, j) => `<td class="c${i === j ? ' diag' : ''}" style="background:rgba(64,47,255,${(0.04 + 0.5 * x / n).toFixed(2)})"${i === j ? ` aria-label="${PCT(x / n)}, совпадение"` : ''}>${PCT(x / n)}</td>`).join('')}<td class="num"><b>${PCT(Sp.per_grade[i].accuracy)}</b></td></tr>`; }).join('')}</tbody>
  </table></div>
  <div class="grid g2" style="gap:16px">
    ${Sp.adjacent ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Соседние грейды</th><th class="num">AUC по θ̂</th><th class="num">Перекрытие θ̂</th></tr></thead>
      <tbody>${Sp.adjacent.map(p => `<tr><td>${esc(p.lo)} | ${esc(p.hi)}</td><td class="num">${DEC(p.auc)}</td><td class="num">${PCT(p.overlap)}</td></tr>`).join('')}</tbody>
    </table></div>` : ''}
    ${Sp.by_spec ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Специализация</th><th class="num">Семейств</th><th class="num">Точно</th><th class="num">±1</th><th class="num">SE</th></tr></thead>
      <tbody>${Sp.by_spec.map(r => `<tr><td>${esc(r.spec)}</td><td class="num">${r.families}</td><td class="num">${PCT(r.accuracy)}</td><td class="num">${PCT(r.within_one)}</td><td class="num">${DEC(r.se_mean)}</td></tr>`).join('')}</tbody>
    </table></div>` : ''}
  </div>
  ${it ? `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Дискриминативность заданий (${it.n})</th><th class="num">min</th><th class="num">Q1</th><th class="num">медиана</th><th class="num">Q3</th><th class="num">max</th></tr></thead>
    <tbody>${quart('a — крутизна кривой 2PL', it.a)}${quart(`r<sub>pb</sub> ответа с суммой остальных, выборка ${it.calib_n}`, it.rpb)}</tbody>
  </table></div>
  <p class="small muted">Слабо различающих заданий (r<sub>pb</sub> &lt; 0,2): ${PCT(it.rpb_poor)} — на модельных ответах по той же 2PL, калибровки по живым ответам пока нет. AUC — вероятность, что у кандидата старшего грейда оценка θ выше, чем у младшего; 0,5 — не различает.</p>` : ''}`;
}

// JSON (массив строк или {event, rows}) уходит как есть, иначе текст — CSV в multipart вместе с полями события
function orgBody(f) {
  const event = Object.fromEntries(ORG_FIELDS.filter(k => f[k].trim()).map(k => [k, f[k].trim()]));
  const t = f.text.trim();
  if (!t) throw new Error('Вставьте протокол или выберите файл');
  if (/^[[{]/.test(t)) {
    let j;
    try { j = JSON.parse(t); } catch { throw new Error('Протокол похож на JSON, но не разбирается: проверьте скобки и кавычки'); }
    return Array.isArray(j) ? { event, rows: j } : j;
  }
  const fd = new FormData();
  for (const [k, v] of Object.entries(event)) fd.append(k, v);
  fd.append('file', new Blob([t], { type: 'text/csv' }), 'protocol.csv');
  return fd;
}

/* ===================== загрузка данных экрана ===================== */
const or404 = p => p.catch(e => { if (e.status === 404) return null; throw e; });

// 403 — профиля нет (ME = null); сбой помечается noMe: флаг ME_ERR ставят show() (с учётом seq) и обработчик действий
async function loadMe() {
  ME = await api('GET', '/api/candidate/me').catch(e => { if (e.status === 403) return null; e.noMe = true; throw e; });
}

// компания работодателя (для плашки «не подтверждена» и квоты); без компании — на экран регистрации
async function ensureCo() {
  if (D.co) return;
  D.co = await api('GET', '/api/employer/company').catch(e => {
    if (e.status === 403) { go('/e/company', true); e.message = 'Сначала заполните данные компании'; }
    throw e;
  });
  D.coName = D.co.name;
}

// все потребности компании; текущая — выбранная в этой сессии или последняя созданная
async function ensureNeed() {
  S.needs = await api('GET', '/api/employer/needs');
  const n = S.needs.find(x => x.id === S.needId) || S.needs[0] || null;
  S.needId = n && n.id; S.needObj = n;
}
// сделать потребность текущей: лотерея, фильтры и черновик приглашения — от прежней, сбрасываются
function pickNeed(n) {
  S.needId = n.id; S.needObj = n; S.lot = null; S.filters.clear(); S.inviteForm = null;
}

async function loadPicks() {
  D.picks = S.needId ? await api('GET', `/api/employer/needs/${S.needId}/picks?limit=20&filters=${[...S.filters].join(',')}`) : null;
  if (D.picks) S.needObj = D.picks.need;
}
const loadSearch = async () => { D.search = await api('GET', '/api/employer/search?' + qs({ ...S.sf, limit: 20 })); };
const loadVac = async () => { D.vac = await api('GET', '/api/vacancies?' + qs({ ...S.vf, limit: 50 })); };

async function load(r) {
  // данные экрана — только из этой загрузки: после ошибки не показываем то, что осталось от прошлого визита
  for (const k of Object.keys(D)) if (k !== 'co' && k !== 'coName') delete D[k];
  if (!META) {
    META = await api('GET', '/api/meta').catch(e => { e.noMe = true; throw e; });  // до /me не дошли — профиль тоже не загружен
    CAP = META.cap;
    GRADE_TH = Object.entries(META.grade_th).filter(([g]) => g !== 'Intern').map(([g, t]) => ({ g, t }));
  }
  const [, side, page, arg] = r.split('/');
  if (roleOf(r) && !OPEN(r) && page !== 'chat' && TOK[side]) UNREAD = await api('GET', '/api/chat/unread').then(x => x.unread_count, e => { if (e.status === 401) throw e; return 0; });  // бейдж не критичен: ошибка сети его не роняет, протухший вход — обычный путь
  if (side === 'c' && !OPEN(r)) {
    await loadMe();
    if (page === 'profile') { ACH = ME ? await api('GET', '/api/achievements') : null; S.pf = pfFromMe(); S.cv = null; S.cfCode = null; }  // код CF — только один раз
    if (!ME) return;
    if (page === 'quest' && arg === 'go') {
      S.quest = await api('POST', '/api/quest/start', { story: S.story, target_grade: S.target || ME.grade_claimed, invitation_id: S.questInvite, mode: S.qMode || 'full' });
      S.qAt = Date.now(); S.finish = null; S.questInvite = null;
    } else if (page === 'quest') D.history = await api('GET', '/api/quest/history');
    else if (page === 'result') {
      [D.result, ACH, D.history] = await Promise.all([S.finish || or404(api('GET', '/api/quest/result')), api('GET', '/api/achievements'), api('GET', '/api/quest/history')]);
    }
    else if (page === 'home') { D.invites = null; D.invites = await api('GET', '/api/candidate/invites'); }  // null — признак ошибки загрузки
    else if (page === 'invite') {
      S.coFb = null;  // выбор отзыва — для конкретного приглашения
      [D.inv, D.invTasks] = await Promise.all([or404(api('GET', '/api/candidate/invites/' + encodeURIComponent(arg))), or404(api('GET', '/api/tasks/for-invitation/' + encodeURIComponent(arg)))]);
      S.declineFor = null;
    }
    else if (page === 'settings') { [ACH, D.auth] = await Promise.all([api('GET', '/api/achievements'), api('GET', '/api/auth/me')]); S.confirm = null; S.hiddenEdit = false; }
    else if (page === 'vacancies') [, D.apps] = await Promise.all([loadVac(), api('GET', '/api/vacancies/applications/mine')]);
    else if (page === 'vacancy') { [D.vacancy, D.apps] = await Promise.all([or404(api('GET', '/api/vacancies/' + encodeURIComponent(arg))), api('GET', '/api/vacancies/applications/mine')]); S.applyNote = ''; S.applyErr = null; }
    else if (page === 'applications') D.apps = await api('GET', '/api/vacancies/applications/mine');
    else if (page === 'tasks') [D.showcase, D.subs] = await Promise.all([api('GET', '/api/tasks/showcase'), api('GET', '/api/tasks/submissions/mine')]);
    else if (page === 'task') { S.taskInv = +r.split('/')[4] || null; [D.task, D.subs] = await Promise.all([or404(api('GET', '/api/tasks/' + encodeURIComponent(arg))), api('GET', '/api/tasks/submissions/mine')]); S.answer = ''; S.picks = []; }
    else if (page === 'chat') await loadChat(arg);
  }
  if (side === 'e' && !OPEN(r)) {
    if (page === 'company') {  // 403 — компании ещё нет: форма регистрации
      D.company = await api('GET', '/api/employer/company').catch(e => { if (e.status === 403) return null; throw e; });
      if (D.company) { D.co = D.company; D.coName = D.company.name; }
      return;
    }
    await ensureCo();
    await ensureNeed();
    if (page === 'need') { if (!S.need.text) S.need.text = (S.needObj && S.needObj.text) || NEED_TEXT; }
    else if (page === 'picks') await loadPicks();
    else if (page === 'search') await loadSearch();
    else if (page === 'cand' || page === 'invite') {
      // потребность — только явно из адреса (пришли из подборки или лотереи); из поиска и статусов — без неё
      const nid = +routeQ('need') || null;

// перерисовка того же экрана: без анимации появления, с сохранением прокрутки, фокуса и ввода полей, которых нет в capture()
const KEEP_INPUTS = ['cf-h', 'ctf-id', 'ctf-role', 'hid-inns'];
function rerender() {
  const y = scrollY, a = document.activeElement;
  // фокус — по id, иначе по data-act и остальным data-*: так различаются кнопки в разметке
  const sel = a && a !== document.body && $app.contains(a)
    ? a.id ? '#' + CSS.escape(a.id) : a.dataset.act ? Object.entries(a.dataset).map(([k, v]) => `[data-${k.replace(/[A-Z]/g, c => '-' + c.toLowerCase())}="${CSS.escape(v)}"]`).join('') : ''
    : '';
  const caret = sel && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  const kept = KEEP_INPUTS.map(id => [id, document.getElementById(id)]).filter(([, el]) => el).map(([id, el]) => [id, el.value]);
  $app.classList.add('still');
  render();
  scrollTo(0, y);
  for (const [id, v] of kept) { const el = document.getElementById(id); if (el) el.value = v; }
  const f = sel && $app.querySelector(sel);
  if (f) { f.focus({ preventScroll: true }); if (caret && typeof f.setSelectionRange === 'function') try { f.setSelectionRange(...caret); } catch { /* тип поля без выделения */ } }
}

// смена экрана: без входа — на экран входа своей роли; загрузка данных, рендер
// пока грузится следующий экран, прежний неактивен (inert): клик по устаревшей кнопке не уйдёт с параметрами старого экрана
function busy(on) { $app.inert = on; on ? $app.setAttribute('aria-busy', 'true') : $app.removeAttribute('aria-busy'); }
async function show(keep) {
  const r = route(), my = ++seq, y = scrollY;
  const side = r.split('/')[1];
  busy(true);
  if (r !== '/org') TOK.org = null;  // токен организатора — только пока открыта его страница
  if (roleOf(r) && !OPEN(r) && !TOK[side]) { toLogin(side, true); return; }  // без входа — на вход своей роли, после него — сюда же (?next=)
  try {
    await load(r);
    if (my === seq) ME_ERR = false;
  } catch (e) {
    if (my === seq) { ME_ERR = side === 'c' && !!e.noMe && e.status !== 401; fail(e); }
    if (e.status === 401) { if (my === seq && r === route()) busy(false); return; }
  }
  if (my !== seq || r !== route()) return;
  $app.classList.remove('still');  // смена экрана — анимация появления есть
  render();
  scrollTo(0, keep ? y : 0);
}
const refresh = () => show(true);

// таймер задания; на нуле — плашка: сервер ещё принимает ответ льготные секунды (quest.TIMEOUT_GRACE_S), потом засчитывает неверным
function startTimer() {
  clearInterval(timerId);
  const el = document.getElementById('timer'), tmo = document.getElementById('tmo');
  if (!el) return;
  let s = +el.dataset.sec, dl = +el.dataset.dl;
  const sub = !!el.dataset.sub;  // решение уже отправлено вовремя (песочница была занята): время ответа зафиксировано
  const tick = () => {
    el.querySelector('span').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('low', s < 60);
    tmo.hidden = s > 0 || sub;
    tmo.className = 'alert ' + (dl ? 'warn' : 'bad');
    tmo.lastChild.textContent = dl ? `Время вышло. Ответ засчитается, если отправить его в ближайшие ${dl} с.`
      : 'Время вышло, ответ не засчитается — переходите к следующему.';
  };
  tick();
  timerId = setInterval(() => {
    s = Math.max(0, s - 1); dl = Math.max(0, dl - 1);
    tick();
    if (!dl) clearInterval(timerId);
  }, 1000);
}

  if (e.key === 'Enter' && !e.isComposing && ENTER[e.target.id]) { const b = document.querySelector(`[data-act="${ENTER[e.target.id]}"]`); if (b) { e.preventDefault(); b.click(); } }
  if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && (!COARSE.matches || e.ctrlKey || e.metaKey)) { e.preventDefault(); document.querySelector('[data-act="chat-send"]').click(); }
  if (e.target.id === 'code-ed') {
    // редактор кода: Tab — отступ; Esc, затем Tab — обычный переход фокуса (клавиатура не запирается в поле)
    if (e.key === 'Escape') { S.edEsc = true; return; }
    if (e.key === 'Tab' && !S.edEsc) { e.preventDefault(); e.target.setRangeText(codeLang() === 'python' ? '    ' : '  ', e.target.selectionStart, e.target.selectionEnd, 'end'); }
    S.edEsc = false;
  }
});

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  const a = e.target.closest('[data-act]');
  // ссылка с Ctrl/⌘/Shift — браузер сам откроет новую вкладку или окно; обычный клик — переход без перезагрузки
  if (g && g.tagName === 'A' && (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button)) return;
  if (g && !g.disabled) { e.preventDefault(); if (route() !== g.dataset.go) go(g.dataset.go); return; }
  if (!a || a.disabled || a.matches(':disabled') || !ACT[a.dataset.act]) return;
  e.preventDefault();
  capture();
  const p = ACT[a.dataset.act](a, a.dataset);
  if (p && p.then) { a.disabled = true; p.catch(e => { fail(e); if (e.noMe && e.status !== 401) { ME_ERR = true; rerender(); } }).finally(() => { a.disabled = false; }); }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'p-spec') { capture(); S.pf.track = ((META && META.tracks[t.value]) || [])[0] || null; rerender(); }
  if (t.id === 'vx-spec') { capture(); S.vform.track = ''; rerender(); }
  if (t.id === 'tx-spec') { capture(); S.tform.competency = ''; rerender(); }
  if (t.id === 'sf-spec') { capture(); S.sf.track = ''; rerender(); }
  if (t.id.startsWith('nc-') && S.needCat) {
    const c = S.needCat;
    if (t.id === 'nc-spec') { c.spec = t.value; c.track = ''; rerender(); } else c[t.id.slice(3)] = t.value;
  }
  if (t.id === 'org-file' && t.files[0]) {  // файл протокола — в поле текста: видно, что уйдёт, и один путь отправки
    orgCapture();
    if (t.files[0].size > 2 * 1024 * 1024) { toast('Файл протокола больше 2 МБ'); return; }
    try { org().form.text = new TextDecoder('utf-8', { fatal: true }).decode(await t.files[0].arrayBuffer()); }
    catch { toast('Сохраните протокол в UTF-8'); return; }  // CP1251 молча стал бы кракозябрами
    finally { t.value = ''; }  // тот же файл можно выбрать снова
    rerender();
  }
  if (t.id === 'cv-file' && t.files[0]) {
    capture();
    const fd = new FormData();
    fd.append('file', t.files[0]);
    try {
      S.cv = await api('POST', '/api/candidate/cv', fd);
      const p = S.cv.parsed;
      if (p.spec) { S.pf.spec = p.spec; S.pf.track = p.track || ((META && META.tracks[p.spec]) || [])[0] || null; }
      if (p.skills.length) S.pf.skills = p.skills;
      if (p.years_exp != null) S.pf.years = p.years_exp;
      if (p.roles.length) S.pf.roles = p.roles;
      if (p.soft_skills.length) S.pf.soft = p.soft_skills;
      // подсказка грейда — только предвыбор: выбранный кандидатом или сохранённый грейд не перетираем
      if (p.grade_hint && !S.pf.gradeSet && !(ME && ME.grade_claimed)) S.pf.grade = p.grade_hint.grade;
      if (!S.pf.name && p.contacts.name) S.pf.name = p.contacts.name;  // своё не перетираем
      if (!S.pf.tg && p.contacts.tg) S.pf.tg = p.contacts.tg;
      if (ME) ME.experience = p.experience;  // профиль уже есть — сервер сохранил текст резюме, PDF возьмёт новые места работы
      toast('Резюме разобрано: проверьте поля'); rerender();
    } catch (err) { fail(err); }
  }
});

  const tmp = document.createElement('div');
  tmp.innerHTML = inviteFormView();
  document.getElementById('f-msgs').innerHTML = tmp.querySelector('#f-msgs').innerHTML;
  document.querySelector('#inv-form [type=submit]').disabled = tmp.querySelector('#inv-form [type=submit]').disabled;
}

document.addEventListener('input', e => {
  if (e.target.id === 'ap-note') { const el = document.getElementById('ap-left'); if (el) el.textContent = (300 - e.target.value.length) + ' символов'; }
  if (!S.inviteForm || !document.getElementById('inv-form')) return;
  const id = e.target.id;
  if (id === 'f-from' || id === 'f-to') {
    const v = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0;
    S.inviteForm[id === 'f-from' ? 'from' : 'to'] = v;
    S.inviteForm.server = null;
    invMsgs();
  }
  if (id === 'f-role') S.inviteForm.role = e.target.value;
  if (id === 'f-desc') S.inviteForm.desc = e.target.value;
  if (id === 'f-task') { S.inviteForm.task = e.target.checked; S.inviteForm.server = null; rerender(); }
  if (id === 'f-task-id') S.inviteForm.taskId = +e.target.value;
  if (id === 'f-task-text') { S.inviteForm.taskText = e.target.value; invMsgs(); }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'inv-form') return;
  e.preventDefault();
  const f = S.inviteForm, n = D.candNeed, btn = e.target.querySelector('[type=submit]');
  const t = f.task && (D.mytasks || []).find(x => x.id === f.taskId);
  btn.disabled = true;
  try {
    const r = await api('POST', '/api/employer/invites', {
      candidate_id: f.cid, need_id: n ? n.id : null, role: f.role, salary_from: f.from, salary_to: f.to,
      lottery_id: n && S.lot && S.lot.needId === n.id && S.lot.drawn && S.lot.drawn.drawn.some(d => d.public_id === f.cid) ? S.lot.created.id : null,
      format: f.format + (f.format !== 'Удалённо' && n && n.city ? ', ' + n.city : ''), description: f.desc,
      task: !f.task ? null : t ? `${t.title}: ~${t.minutes} мин, заменяет первый созвон` : f.taskText.trim(), task_id: t ? t.id : null,
    });
    S.inviteForm = null;
    toast(r.warnings.length ? 'Приглашение отправлено. ' + r.warnings[0] : 'Приглашение отправлено. Кандидат увидит его в кабинете' + (META && META.mail ? ' и получит письмо, если не отключил уведомления' : ''));
    go('/e/pipeline');
  } catch (err) {
    if (err.status === 422 && err.detail && err.detail.errors) { f.server = err.detail; rerender(); }
    else if (err.status === 409 || err.status === 429) { f.server = { errors: [err.message], warnings: [] }; rerender(); }  // ёмкость, дубль, квота — блокирующие ошибки
    else fail(err);
    btn.disabled = false;
  }
});

matchMedia('(max-width: 640px)').addEventListener('change', () => { if (document.querySelector('.quest .chart')) { capture(); rerender(); } });  // график теста — узкий или широкий холст после поворота
document.addEventListener('touchstart', () => {}, { passive: true });  // без него iOS Safari не показывает :active при касании
for (const ev of ['pointerdown', 'mousedown']) document.addEventListener(ev, e => { if (e.target.closest('[data-keepfocus]')) e.preventDefault(); });
// старые ссылки вида /#/c/home (до разделения кабинетов): тот же экран по новому адресу, без лишней записи в истории —
// при загрузке и при смене одного хеша на открытой странице
function oldHash() {
  if (!location.hash.startsWith('#/')) return false;
  const k = location.hash.slice(1) === '/e/signup' ? (TOK.e ? '/e/company' : '/e/login') : location.hash.slice(1), p = pathOf(k);
  // неизвестный старый ключ кабинета — тот же хвост в кабинете, там его встретит «Не найдено»
  history.replaceState(null, '', (p === '/' && /^\/[ce]\//.test(k) ? (k[1] === 'c' ? '/candidate' : '/employer') + k.slice(2) : p) + location.search);
  return true;
}
addEventListener('hashchange', () => { if (oldHash()) show(); });
oldHash();
fspReturn().catch(fail).finally(() => show());
</script>
</body>
</html>
