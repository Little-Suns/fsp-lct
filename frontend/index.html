<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ФСП Карьера — макет</title>
<link rel="icon" href="assets/mark.png">
<style>
@font-face { font-family: "JetBrains Mono"; src: url(assets/fonts/JetBrainsMono-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(assets/fonts/JetBrainsMono-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(assets/fonts/JetBrainsMono-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(assets/fonts/JetBrainsMono-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }

/* Макет: светлое «бумажное» поле с тонкой синей рамкой и линиями-трассами из брендбука ФСП;
   тёмные блоки (#1B1C21) — для атмосферы теста и героя. Красный — только для критичного. */
:root {
  --blue: #402FFF;
  --blue-ink: #2A1FD1;
  --blue-soft: #EDEBFF;
  --blue-line: #B9B2FF;
  --red: #EC1D35;
  --red-soft: #FDE8EA;
  --ink: #1B1C21;
  --ink-2: #4A4B55;
  --ink-3: #7C7D87;
  --line: #C8C9CA;
  --line-2: #E2E2E6;
  --mist: #EDEDED;
  --paper: #FFFFFF;
  --ground: #F6F6F8;
  --ok: #138A55;
  --ok-soft: #E3F4EC;
  --warn: #B86E00;
  --warn-soft: #FFF2DC;
  --dark: #1B1C21;
  --dark-2: #25262D;
  --dark-line: #3A3B45;
  --on-dark: #EDEDED;
  --on-dark-2: #A3A4AE;

  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  --r: 14px;
  --r-s: 8px;
  --gut: clamp(16px, 4vw, 40px);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 14px/1.55 var(--mono);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
img { max-width: 100%; display: block; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 4.2vw, 44px); }
h2 { font-size: clamp(20px, 2.4vw, 26px); }
h3 { font-size: 16px; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 500; }
.prose { font-family: var(--sans); font-size: 15px; line-height: 1.6; max-width: 62ch; color: var(--ink-2); }

/* ---------- шапка ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-2);
}
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px var(--gut); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand img { height: 30px; width: auto; }
.brand .prod { font-weight: 600; font-size: 13px; padding-left: 12px; border-left: 1px solid var(--line); line-height: 1.2; }
.brand .prod span { display: block; font-weight: 400; color: var(--ink-3); font-size: 11px; }
.roles { display: flex; gap: 4px; background: var(--mist); padding: 4px; border-radius: 999px; margin-left: auto; }
.roles button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.roles button[aria-current="true"] { background: var(--paper); color: var(--blue); font-weight: 600; box-shadow: 0 1px 2px rgba(27,28,33,.12); }
.mapbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
.mapbtn:hover { border-color: var(--blue); color: var(--blue); }

/* ---------- каркас ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 28px var(--gut) 80px; }
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; font-size: 12px; color: var(--ink-3); }
.crumbs b { color: var(--ink); font-weight: 500; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--blue); cursor: pointer; font-size: 12px; }

.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.side { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
.side-l { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
/* чат */
.chat { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: stretch; margin-bottom: 24px; }
.chat-list { max-height: 70vh; overflow-y: auto; align-content: start; }
.chat-peer { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px; border: 1px solid transparent; border-radius: var(--r-s); background: transparent; cursor: pointer; font: inherit; color: inherit; }
.chat-peer span.small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.chat-peer.on { background: var(--blue-soft); border-color: var(--blue-line); }
.chat-box { display: flex; flex-direction: column; height: 70vh; min-height: 360px; }
.chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
.msg { align-self: flex-start; max-width: 80%; padding: 8px 12px; border-radius: var(--r-s); background: var(--ground); }
.msg.me { align-self: flex-end; background: var(--blue-soft); }
.msg p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.msg time { display: block; text-align: right; margin-top: 4px; font-size: 11px; color: var(--ink-3); }
.dot { background: var(--red); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 11px; }
@media (max-width: 900px) { .chat { grid-template-columns: minmax(0, 1fr); } .chat-list { max-height: 30vh; } }
@media (max-width: 900px) { .g2, .g3, .side, .side-l { grid-template-columns: minmax(0, 1fr); } }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.sb { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }

.panel { background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r); padding: 22px; min-width: 0; }
.panel.tight { padding: 16px; }
.panel.frame { border: 1px solid var(--blue-line); position: relative; }
.panel h2 + *, .panel h3 + * { margin-top: 12px; }
.divider { height: 1px; background: var(--line-2); margin: 4px 0; }

/* ---------- кнопки и поля ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: none; transition: background .15s, border-color .15s, color .15s; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-ink); }
.btn.ghost { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--blue); color: var(--blue); }
.btn.danger { background: var(--paper); border-color: var(--line); color: var(--red); }
.btn.danger:hover { border-color: var(--red); }
.btn.dark { background: var(--on-dark); color: var(--ink); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 10px 12px; font-size: 14px; }
.input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
textarea.input { resize: vertical; min-height: 110px; line-height: 1.5; font-family: var(--sans); font-size: 15px; }
.hint { font-size: 12px; color: var(--ink-3); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--blue); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--paper); padding: 8px 14px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }

.switch { display: inline-flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; font-size: 13px; border: 0; background: none; padding: 0; }
.switch i { width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] i { background: var(--blue); }
.switch[aria-checked="true"] i::after { transform: translateX(16px); }

/* ---------- чипы, бейджи ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; background: var(--paper); white-space: nowrap; }
.chip.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-ink); }
.chip.ok { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.chip.warn { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.chip.bad { border-color: transparent; background: var(--red-soft); color: var(--red); }
.chip.dim { color: var(--ink-3); border-style: dashed; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--blue); }
.chip .x { opacity: .6; }

.cat { display: inline-flex; align-items: center; gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--blue); font-weight: 600; font-size: 13px; }
.cat span { padding: 5px 10px; color: var(--blue); }
.cat span + span { border-left: 1px solid var(--blue-line); }
.cat span:last-child { background: var(--blue); color: #fff; }

.trust { display: flex; flex-direction: column; gap: 0; }
.trust > div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--line-2); font-size: 13px; }
.trust > div:first-child { border-top: 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.dot.on { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 2px var(--paper); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-sent { background: var(--mist); color: var(--ink-2); }
.s-seen { background: var(--blue-soft); color: var(--blue-ink); }
.s-ok { background: var(--ok-soft); color: var(--ok); }
.s-no { background: var(--red-soft); color: var(--red); }
.s-exp { background: var(--mist); color: var(--ink-3); }

.alert { border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.alert b { font-weight: 600; }
.alert.warn { background: var(--warn-soft); color: #6E4200; }
.alert.bad { background: var(--red-soft); color: #8E0F1E; }
.alert.ok { background: var(--ok-soft); color: #0B5A37; }
.alert.info { background: var(--blue-soft); color: var(--blue-ink); }

/* ---------- полосы компетенций (θ ± SE) ---------- */
.comp { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 13px; }
.comp + .comp { margin-top: 10px; }
.scale { position: relative; height: 22px; }
.scale .track { position: absolute; inset: 10px 0; height: 2px; background: var(--line-2); }
.scale .tick { position: absolute; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.scale .se { position: absolute; top: 7px; height: 8px; background: var(--blue-line); border-radius: 4px; }
.scale .th { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--blue); border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--blue); }
.scale-legend { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 56px; gap: 12px; font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.scale-legend .lg { position: relative; height: 14px; }
.scale-legend .lg span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
@media (max-width: 560px) {
  .comp, .scale-legend { grid-template-columns: minmax(0, 1fr) 48px; }
  .comp > :first-child { grid-column: 1 / -1; }
  .scale-legend > :first-child { display: none; }
}

.meter { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }

/* ---------- герой ---------- */
.hero { background: var(--dark); color: var(--on-dark); border-radius: 22px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr); position: relative; }
.hero-txt { padding: clamp(24px, 5vw, 56px); display: flex; flex-direction: column; gap: 22px; position: relative; z-index: 1; }
.hero h1 { color: #fff; font-size: clamp(30px, 4.4vw, 52px); }
.hero h1 em { font-style: normal; color: var(--blue-line); }
.hero .lead { font-family: var(--sans); font-size: 17px; color: var(--on-dark-2); max-width: 46ch; }
.hero-img { position: relative; min-height: 320px; background: #16171B; }
.hero-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
.hero-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--dark) 0%, transparent 40%); }
.hero .eyebrow { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--on-dark-2); text-transform: uppercase; letter-spacing: .1em; }
.hero .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px rgba(64,47,255,.25); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } .hero-img { min-height: 220px; order: -1; } .hero-img::after { background: linear-gradient(0deg, var(--dark) 0%, transparent 55%); } }

.trace { position: absolute; pointer-events: none; color: var(--blue); }
.trace path { fill: none; stroke: currentColor; stroke-width: 1.2; }
.trace circle { fill: currentColor; }
@media (max-width: 1000px) { .trace { display: none; } }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--blue-line); border-radius: var(--r); background: var(--paper); overflow: hidden; }
.steps > div { padding: 22px; border-right: 1px solid var(--blue-line); display: flex; flex-direction: column; gap: 8px; }
.steps > div:last-child { border-right: 0; }
.steps .n { font-size: 12px; color: var(--blue); font-weight: 600; }
@media (max-width: 820px) { .steps { grid-template-columns: 1fr; } .steps > div { border-right: 0; border-bottom: 1px solid var(--blue-line); } .steps > div:last-child { border-bottom: 0; } }

.door { display: flex; flex-direction: column; gap: 14px; padding: 26px; border-radius: var(--r); background: var(--paper); border: 1px solid var(--line-2); cursor: pointer; text-align: left; transition: border-color .15s, transform .15s; }
.door:hover { border-color: var(--blue); transform: translateY(-2px); }
.door .go { margin-top: auto; color: var(--blue); font-weight: 600; }

/* ---------- квест ---------- */
.quest { background: var(--dark); color: var(--on-dark); border-radius: 22px; overflow: hidden; }
.quest-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 22px; border-bottom: 1px solid var(--dark-line); font-size: 13px; }
.quest-top .pr { display: flex; gap: 4px; }
.quest-top .pr i { width: 22px; height: 4px; border-radius: 2px; background: var(--dark-line); }
.quest-top .pr i.on { background: var(--blue); }
.quest-top .pr i.cur { background: var(--on-dark); }
.timer { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; gap: 8px; align-items: center; }
.timer.low { color: #FF6B7D; }
.quest .switch { color: var(--on-dark-2); }
.quest .seg { border-color: var(--dark-line); align-self: flex-start; } .quest .seg button { background: var(--dark-2); color: var(--on-dark); border-color: var(--dark-line); } .quest .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.quest .switch i { background: var(--dark-line); }
.quest-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.quest-body > div { padding: 26px; min-width: 0; }
.quest-body > div + div { border-left: 1px solid var(--dark-line); }
@media (max-width: 900px) { .quest-body { grid-template-columns: 1fr; } .quest-body > div + div { border-left: 0; border-top: 1px solid var(--dark-line); } }
.story { border-left: 2px solid var(--blue); padding-left: 14px; font-family: var(--sans); font-size: 15px; color: var(--on-dark); line-height: 1.6; }
.story .t { font-family: var(--mono); font-size: 12px; color: var(--blue-line); display: block; margin-bottom: 4px; }
.quest .q { font-size: 17px; font-weight: 600; color: #fff; }
.term { background: #0F1013; border: 1px solid var(--dark-line); border-radius: 10px; padding: 14px; font-size: 12px; line-height: 1.7; overflow-x: auto; white-space: pre; color: #C9CAD3; }
.term .e { color: #FF7A8A; }
.term .w { color: #F5C46B; }
.term .i { color: #8EA2FF; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--dark-line); background: var(--dark-2); color: var(--on-dark); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14px; font-family: var(--sans); }
.opt:hover { border-color: var(--blue-line); }
.opt .k { font-family: var(--mono); color: var(--on-dark-2); font-size: 12px; padding-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--blue); background: rgba(64,47,255,.18); }
.opt[aria-pressed="true"] .k { color: #fff; }
.code, .term { font-variant-ligatures: none; }
.code { background: #0F1013; border: 1px solid var(--dark-line); border-radius: 10px; overflow-x: auto; font-size: 12.5px; }
.code button { display: grid; grid-template-columns: 34px 1fr; width: 100%; min-width: max-content; text-align: left; border: 0; background: none; color: #C9CAD3; padding: 1px 12px 1px 0; cursor: pointer; white-space: pre; font-family: var(--mono); line-height: 1.75; }
.code button .ln { color: #5D5E69; text-align: right; padding-right: 12px; user-select: none; }
.code button:hover { background: #1A1B21; }
.code button[aria-pressed="true"] { background: rgba(236,29,53,.18); box-shadow: inset 3px 0 0 var(--red); }
.pre { white-space: pre-line; }
.code button[disabled] { cursor: default; } .code button[disabled]:hover { background: none; }
.code .kw { color: #A99BFF; } .code .st { color: #9FD8A8; } .code .cm { color: #6C6D78; }
.quest-foot { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 22px; border-top: 1px solid var(--dark-line); font-size: 12px; color: var(--on-dark-2); }
.quest .chart text { fill: var(--on-dark-2); font-size: 10px; font-family: var(--mono); }

/* ---------- карточки кандидатов / приглашений ---------- */
.cand { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 20px; padding: 18px 20px; background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r); cursor: pointer; transition: border-color .15s; text-align: left; width: 100%; }
.cand:hover { border-color: var(--blue); }
.cand .id { font-weight: 600; font-size: 15px; }
.cand .score { text-align: right; }
.cand .score b { font-size: 22px; font-weight: 600; color: var(--blue); display: block; line-height: 1; }
.cand .facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; font-size: 12px; border-top: 1px dashed var(--line-2); padding-top: 12px; }
.cand .facts b { display: block; font-size: 13px; font-weight: 500; color: var(--ink); }
@media (max-width: 700px) { .cand .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.inv { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r); cursor: pointer; text-align: left; width: 100%; }
.inv:hover { border-color: var(--blue); }
.logo-sq { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; }
.money { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 560px) { .inv { grid-template-columns: 44px minmax(0, 1fr); } .inv > :last-child { grid-column: 2; } }

.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 16px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 8px; } }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl td { padding: 12px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }

.tg { background: #E7EBF0; border-radius: 16px; padding: 14px; max-width: 360px; font-family: var(--sans); }
.tg .bubble { background: #fff; border-radius: 12px 12px 12px 4px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: #111; }
.tg .bubble b { font-weight: 600; }
.tg .kb { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
.tg .kb span { background: rgba(255,255,255,.7); border-radius: 8px; text-align: center; padding: 7px; font-size: 13px; color: #2D6BB5; font-weight: 500; }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(130px, 200px) minmax(0, 1fr) 52px; gap: 12px; align-items: center; font-size: 13px; }
.bar .b { height: 18px; background: var(--mist); border-radius: 4px; overflow: hidden; }
.bar .b i { display: block; height: 100%; background: var(--blue); }
.bar .b i.alt { background: var(--blue-line); }
.bar .b i.red { background: var(--red); }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
@media (max-width: 560px) { .bar { grid-template-columns: minmax(0, 1fr) 48px; } .bar > :first-child { grid-column: 1 / -1; } }

.stat { display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 12px; color: var(--ok); }

.demo-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 6px; }

/* ---------- карта экранов, тост ---------- */
.overlay { position: fixed; inset: 0; background: rgba(27,28,33,.45); z-index: 50; display: flex; justify-content: flex-end; }
.drawer { background: var(--paper); width: min(440px, 100%); height: 100%; overflow-y: auto; padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.drawer .grp { display: flex; flex-direction: column; gap: 2px; }
.drawer .grp button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 34px 1fr; font-size: 13px; }
.drawer .grp button:hover { background: var(--blue-soft); }
.drawer .grp button[aria-current="true"] { background: var(--blue); color: #fff; }
.drawer .grp button span:first-child { color: var(--ink-3); }
.drawer .grp button[aria-current="true"] span:first-child { color: var(--blue-line); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); }

.drop { border: 1.5px dashed var(--blue-line); border-radius: var(--r); padding: 22px; display: flex; gap: 16px; align-items: center; background: var(--blue-soft); }
.file-ico { width: 40px; height: 48px; border-radius: 6px; background: var(--paper); border: 1px solid var(--blue-line); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--red); flex: none; }

.parsed { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
@media (max-width: 600px) { .parsed { grid-template-columns: 1fr; gap: 4px; } .parsed > .label { margin-top: 8px; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.fade { animation: fade .25s ease-out; }
@keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" data-go="/">
      <img src="assets/logo.svg" alt="ФСП">
      <div class="prod">ФСП Карьера<span>обратный найм в ИТ</span></div>
    </a>
    <nav class="roles" aria-label="Роль">
      <button data-go="/c/home" data-role="c">Кандидат</button>
      <button data-go="/e/picks" data-role="e">Работодатель</button>
      <button data-go="/v" data-role="v">Валидация</button>
    </nav>
    <button class="mapbtn" data-act="map" aria-haspopup="dialog">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 3h12M1 7h12M1 11h12" stroke="currentColor" stroke-width="1.5"/></svg>
      Экраны
    </button>
    <button class="mapbtn" id="logout" data-act="logout" hidden>Выйти</button>
  </div>
</header>

<main id="app"></main>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== данные: API бэкенда ===================== */
const RUB = n => n == null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/[,  ]/g, ' ') + ' ₽';
const K = n => n == null ? '—' : Math.round(n / 1000) + ' тыс.';
const DEC = (v, d = 2) => v == null ? '—' : Number(v).toFixed(d).replace('.', ',');
const PCT1 = v => v == null ? '—' : (v * 100).toFixed(1).replace('.', ',') + ' %';
const PCT = v => v == null ? '—' : Math.round(v <= 1 ? v * 100 : v) + ' %';
const DATE = s => s ? new Date(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).replace(/\s*г\.$/, '') : '—';
const DAYMON = s => s ? new Date(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '—';

let META = null;   // /api/meta: справочники
let CAP = 4;       // лимит открытых приглашений у кандидата (из META)
let ME = null;     // /api/candidate/me
let ACH = null;    // /api/achievements
let GRADE_TH = [{ g: 'Junior', t: -0.5 }, { g: 'Middle', t: 0.5 }, { g: 'Senior', t: 1.5 }, { g: 'Lead', t: 2.3 }];
const D = {};      // данные текущего экрана
let UNREAD = 0;    // непрочитанные сообщения чата (бейдж в разделах)
const loadPen = l => l >= CAP ? .3 : 1 - .15 * l;
const NEED_TEXT = 'Ищем бэкендера на Python в команду платежей. Нужен опыт с PostgreSQL и Kafka, хорошо бы Kubernetes. Уровень — мидл, до 300 на руки. Гибрид, Москва.';

const S = {
  story: true,
  quest: null, qAns: null, codeMark: null, qComment: '', qItem: null, qShownAt: 0, finish: null,
  signup: { email: '', otp: '', sent: false, c152: false, publish: false, tg: true },
  esignup: { email: '', otp: '', sent: false },
  confirm: null,                     // ключ открытого инлайн-подтверждения (удаление аккаунта, отзыв согласий)
  target: null,                      // грейд, на который проходится тест
  questInvite: null,                 // тест по приглашению: invitation_id
  vf: { spec: '', grade: '', format: '', city: '', q: '' },   // фильтры вакансий кандидата
  sf: { spec: '', track: '', grade: '', skills: '', q: '', fsp: false, cf: false, hackathon: false, format: '', city: '', page: 1 },
  vform: null, tform: null, applyNote: '', answer: '', hiddenEdit: false, needAdd: null, plan: null,
  appDecline: null, reviewFor: null,
  pf: null, cv: null,
  declineFor: null, declineReason: null,
  need: { text: '', parsed: null },
  needId: null, needObj: null,
  filters: new Set(),
  lot: null,
  inviteForm: null,
};

/* ===================== API ===================== */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* приватный режим */ } },
};
const TOK = { c: LS.get('fsp.tok.c'), e: LS.get('fsp.tok.e') };
const setTok = (role, t) => { TOK[role] = t; LS.set('fsp.tok.' + role, t); };
const roleOf = p => p.startsWith('/e') ? 'e' : 'c';

async function api(method, path, body, role = roleOf(route())) {
  const headers = {};
  if (TOK[role]) headers.Authorization = 'Bearer ' + TOK[role];
  if (body !== undefined && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, { method, headers, body }); } catch { throw Object.assign(new Error('Сервер недоступен'), { status: 0 }); }
  const data = await r.json().catch(() => null);
  if (r.ok) return data;
  const det = data && data.detail;
  const msg = typeof det === 'string' ? det : Array.isArray(det) ? det.map(x => x.msg).join('; ') : det && det.errors ? det.errors.join(' ') : `Ошибка ${r.status}`;
  const err = Object.assign(new Error(msg), { status: r.status, detail: det });
  if (r.status === 401 && !path.startsWith('/api/auth/')) {
    clearSide(role);
    const to = role === 'e' ? '/e/signup' : '/c/signup';
    if (route() !== to) go(to);
  }
  throw err;
}
function fail(e) { toast(e && e.message ? e.message : 'Ошибка'); }

// сброс токена и данных одной роли: выход, 401, смена пользователя
function clearSide(role) {
  setTok(role, null);
  if (role === 'c') { ME = null; ACH = null; Object.assign(S, { quest: null, finish: null, pf: null, cv: null, confirm: null, questInvite: null, target: null, cfCode: null, applyNote: '', answer: '' }); }
  else { delete D.co; delete D.coName; delete D.company; Object.assign(S, { needId: null, needObj: null, lot: null, inviteForm: null, vform: null, tform: null, plan: null, need: { text: '', parsed: null }, appDecline: null }); S.filters.clear(); }
}
// демо-персонажи (только при DEMO=1 на сервере): c — Орлов, e — «Ладога Пэй», newco — неподтверждённый «Новый Стартап»
async function demoLogin(who) {
  const role = who === 'c' ? 'c' : 'e';
  clearSide(role);
  if (who === 'newco') return emailLogin('e', 'newco.hr@gmail.com');
  const d = await api('POST', '/api/auth/demo/' + (role === 'e' ? 'employer' : 'candidate'), undefined, role);
  setTok(role, d.token);
}
// вход по коду: в демо сервер возвращает код в ответе — подставляем его сами
async function emailLogin(role, email) {
  const r = await api('POST', '/api/auth/email', { email, role: role === 'e' ? 'employer' : 'candidate' }, role);
  if (!r.otp) throw new Error('Код отправлен на почту: введите его в форме входа');
  await verifyLogin(role, email, r.otp);
}
async function verifyLogin(role, email, otp) {
  const r = await api('POST', '/api/auth/verify', { email, otp }, role);
  const want = role === 'e' ? 'employer' : 'candidate';
  if (r.role !== want) throw new Error(want === 'employer' ? 'Эта почта зарегистрирована как кандидат' : 'Эта почта зарегистрирована как работодатель');
  clearSide(role);
  setTok(role, r.token);
}

// ФСП ID (OIDC): сервер отдаёт адрес провайдера и ставит куку потока; браузер уходит туда целиком
// согласия, отмеченные на экране регистрации, переживают уход к провайдеру (страница перезагрузится)
async function fspStart(mode) {
  const r = await api('POST', '/api/auth/fsp/start', { mode }, 'c');
  try { sessionStorage.setItem('fsp.signup', JSON.stringify({ c152: S.signup.c152, publish: S.signup.publish, tg: S.signup.tg })); } catch { /* приватный режим */ }
  location.assign(r.url);
}
const FSP_ERR = {
  state: 'Вход через ФСП ID устарел или открыт в другом браузере — начните заново',
  denied: 'Вход через ФСП ID отменён',
  provider: 'ФСП ID недоступен или отклонил запрос — попробуйте позже',
  token: 'ФСП ID прислал неподтверждённые данные — вход отклонён',
  email: 'В ФСП ID не подтверждена почта — подтвердите её или войдите по коду',
  role: 'Эта почта зарегистрирована как работодатель — войдите по коду',
  taken: 'Этот ФСП ID уже привязан к другому аккаунту',
  other: 'К аккаунту уже привязан другой ФСП ID — сначала отвяжите его в настройках',
};
const fspAch = a => a === 'consent' ? 'Достижения ФСП подтянем после согласия на внешние данные — в настройках' : +a ? `Подтверждено достижений ФСП: ${a}` : 'Новых достижений в ФСП ID нет';
// возврат из ФСП ID: билет или код ошибки — во фрагменте (не уходит на сервер и в Referer), сразу стираем его из адреса
async function fspReturn() {
  if (!location.hash.startsWith('#fsp=')) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const kind = p.get('fsp');  // login | linked | error; ошибка у вошедшего — это привязка из настроек
  history.replaceState(null, '', location.pathname + '#/c/' + (kind === 'linked' || (kind === 'error' && TOK.c) ? 'settings' : 'signup'));
  if (kind === 'error') return toast(FSP_ERR[p.get('e')] || 'Не удалось войти через ФСП ID');
  if (kind === 'linked') return toast('ФСП ID привязан. ' + fspAch(p.get('ach')));
  const r = await api('POST', '/api/auth/fsp/exchange', { ticket: p.get('t') || '' }, 'c');
  if (r.role !== 'candidate') throw new Error('Эта почта зарегистрирована как работодатель');
  clearSide('c');
  setTok('c', r.token);
  try { Object.assign(S.signup, JSON.parse(sessionStorage.getItem('fsp.signup')) || {}); sessionStorage.removeItem('fsp.signup'); } catch { /* приватный режим */ }
  history.replaceState(null, '', location.pathname + (r.has_profile ? '#/c/home' : '#/c/profile'));
  toast(r.has_profile ? 'Вход через ФСП ID. ' + fspAch(p.get('ach')) : 'Вход через ФСП ID: заполните профиль');
}

/* ===================== утилиты ===================== */
const $app = document.getElementById('app');
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2800);
}
const go = p => { location.hash = '#' + p; };
const route = () => (location.hash.slice(1) || '/');

const trace = (cls, w, h, d, dots) => `<svg class="trace ${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/>${dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5"/>`).join('')}</svg>`;

const catTag = (s = ME && ME.spec, t = ME && ME.track, g = ME && (ME.grade || ME.grade_claimed)) => `<span class="cat">${[s, t, g].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}</span>`;
const BADGE = { fsp: 'ФСП', hackathon: 'Хакатон', ctftime: 'CTF' };
// бейджи достижений на анонимной карточке: ФСП / хакатон / CTF + рейтинг Codeforces
const badgeChips = c => (c.badges || (c.fsp ? [{ source: 'fsp', title: c.fsp }] : [])).filter((b, i, arr) => BADGE[b.source] && arr.findIndex(x => x.source === b.source) === i).map(b => `<span class="chip ok" title="${esc(b.title)}">${BADGE[b.source]}</span>`).join('') + (c.cf ? `<span class="chip ok">CF ${Math.round(c.cf)}</span>` : '');

// разделы кабинета: одна строка чипов под хлебными крошками
const NAV = {
  c: [['/c/home', 'Кабинет'], ['/c/vacancies', 'Вакансии'], ['/c/applications', 'Мои отклики'], ['/c/tasks', 'Задачи'], ['/c/chat', 'Чат'], ['/c/result', 'Тест'], ['/c/settings', 'Настройки и приватность']],
  e: [['/e/picks', 'Подборка'], ['/e/search', 'Поиск по банку'], ['/e/vacancies', 'Вакансии'], ['/e/tasks', 'Задания'], ['/e/pipeline', 'Приглашения'], ['/e/chat', 'Чат']],
};
const NAV_OF = { '/c/invite': '/c/home', '/c/vacancy': '/c/vacancies', '/c/task': '/c/tasks', '/c/quest': '/c/result', '/e/vacancy': '/e/vacancies', '/e/task': '/e/tasks', '/e/need': '/e/picks', '/e/invite': '/e/pipeline' };
function subnav(side) {
  const r = route(), base = r.split('/').slice(0, 3).join('/'), cur = NAV_OF[base] || base;
  return `<nav class="chips" aria-label="Разделы" style="margin-bottom:16px">${NAV[side].map(([p, l]) => `<button class="chip ${p === cur ? 'on' : ''}" data-go="${p}">${l}${p.endsWith('/chat') && UNREAD > 0 ? ` <span class="dot">${UNREAD}</span>` : ''}</button>`).join('')}</nav>`;
}
// плашка неподтверждённой компании (квота урезана, кандидаты видят предупреждение)
const unverifiedBanner = () => D.co && !D.co.verified ? `<div class="alert warn" style="margin-bottom:16px"><span>!</span><span><b>Компания не прошла проверку.</b> Квота — ${D.co.quota ? D.co.quota.max : 3} приглашения в неделю; кандидаты видят «${D.co.domain_confirmed ? 'почта на домене подтверждена' : 'почта на домене не подтверждена'}»${D.co.inn_checksum_valid === false ? ' и «ИНН: контрольные цифры не сходятся»' : ''}. Укажите корректный ИНН и входите с почты на домене сайта компании. <button class="btn ghost small" data-go="/e/signup">Данные компании</button></span></div>` : '';
// инлайн-подтверждение вместо confirm(): показывается, когда S.confirm === key
const confirmBox = (key, text, ok) => S.confirm === key ? `<div class="panel stack" role="alertdialog" aria-label="Подтверждение" style="border-color:var(--red)">
  <p class="small">${text}</p>
  <div class="row"><button class="btn danger" data-act="confirm-yes" data-k="${key}">${ok}</button><button class="btn ghost" data-act="confirm-no">Отмена</button></div></div>` : '';
// после отзыва согласия на обработку бэкенд запрещает менять ПДн (403): только восстановить согласие, выгрузить или удалить
const withdrawn = () => !!(ME && (!ME.consent_152 || ME.needs_reconsent));
const withdrawnAlert = () => ME && ME.consent_152 && ME.needs_reconsent ? `<div class="alert warn" style="margin-bottom:16px"><span>!</span><span><b>Текст согласия обновился — подтвердите согласия.</b> Пока вы не подтвердите новую редакцию, профиль скрыт и редактировать данные нельзя. <button class="btn primary small" data-act="reconsent">Подтвердить согласия</button> <button class="btn ghost small" data-go="/c/settings">Настройки</button></span></div>` : withdrawn() ? `<div class="alert bad" style="margin-bottom:16px"><span>!</span><span><b>Согласие на обработку отозвано: восстановите его или удалите аккаунт.</b> Пока оно отозвано, профиль скрыт и редактировать данные нельзя. <button class="btn ghost small" data-act="consent-152">Восстановить согласие</button> <button class="btn ghost small" data-go="/c/settings">Настройки</button></span></div>` : '';
// последнее событие журнала согласий по цели: {granted, at, version} | null
const consentLog = k => { const e = ME && ME.consents && ME.consents[k]; return `<span class="small muted" data-consent="${k}">Журнал: ${e ? `${e.granted ? 'дано' : 'отозвано'} ${DATE(e.at)}, версия ${esc(e.version || '—')}` : 'событий нет'}</span>`; };
const noProfile = title => `${crumbs([['Главная', '/'], [title]])}<div class="panel stack"><h2>Профиль ещё не создан</h2><p class="prose small">Заполните профиль и пройдите тест — после этого откроются вакансии, задачи и приглашения.</p><div class="row"><button class="btn primary" data-go="/c/profile">Заполнить профиль</button></div></div>`;
const APP_ST = { sent: ['s-sent', 'отправлен'], seen: ['s-seen', 'просмотрен'], accepted: ['s-ok', 'приглашение на интервью'], declined: ['s-no', 'отказ'], withdrawn: ['s-exp', 'отозван'] };
const appChip = st => `<span class="status ${(APP_ST[st] || APP_ST.sent)[0]}">${(APP_ST[st] || [0, esc(st)])[1]}</span>`;
const REVIEW = { strong: ['ok', 'сильное решение'], ok: ['', 'нормально'], weak: ['warn', 'слабо'] };
const reviewChip = r => r ? `<span class="chip ${REVIEW[r][0]}">${REVIEW[r][1]}</span>` : '<span class="chip dim">ждёт оценки</span>';
// о компании — отдельные проверяемые факты, а не общее «подтверждена»: почта входа на домене сайта, контрольные цифры ИНН.
// domain_confirmed / inn_checksum_valid приходят в приглашениях, вакансиях и задачах; verified — запасной вариант для старых ответов.
const domainOk = co => co.domain_confirmed !== undefined ? !!co.domain_confirmed : !!co.verified;
const coChip = co => (domainOk(co) ? '<span class="chip ok">почта на домене подтверждена</span>' : '<span class="chip warn">почта на домене не подтверждена</span>') +
  (co.inn_checksum_valid === false ? ' <span class="chip warn">ИНН: контрольные цифры не сходятся</span>' : '');
const domainWarn = co => domainOk(co) ? '' : '<div class="alert warn"><span>!</span><span><b>Почта на домене не подтверждена.</b> Рекрутер вошёл не с почты на домене сайта компании. Не передавайте паспортные и платёжные данные до собеседования.</span></div>';
const qs = o => Object.entries(o).filter(([, v]) => v !== '' && v !== false && v != null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');

function crumbs(items) {
  return `<div class="crumbs">${items.map((it, i) => i === items.length - 1 ? `<b>${it[0]}</b>` : `<button data-go="${it[1]}">${it[0]}</button><span>/</span>`).join('')}</div>`;
}

function compRows(list, showTh = true) {
  const pos = v => ((v + 3) / 6 * 100).toFixed(1);
  const legend = `<div class="scale-legend"><span></span><div class="lg">${GRADE_TH.map(g => `<span style="left:${pos(g.t)}%">${g.g}</span>`).join('')}</div><span></span></div>`;
  return (showTh ? legend : '') + list.map(c => `
    <div class="comp">
      <span>${esc(c.n)}</span>
      <div class="scale" title="θ = ${Number(c.t).toFixed(2)}, SE = ${c.se.toFixed(2)}">
        <div class="track"></div>
        ${GRADE_TH.map(g => `<div class="tick" style="left:${pos(g.t)}%"></div>`).join('')}
        <div class="se" style="left:${pos(c.t - c.se)}%; width:${(c.se * 2 / 6 * 100).toFixed(1)}%"></div>
        <div class="th" style="left:${pos(c.t)}%"></div>
      </div>
      <span class="num muted small">${c.t.toFixed(2)}</span>
    </div>`).join('');
}

function lineChart(p) {
  // panel {type:'chart', x, series:[{name, axis, max, data}], marker:{i, label}}
  const t = p.x, W = 520, H = 210, L = 44, R = 40, T = 16, B = 28;
  const left = p.series.find(s => s.axis !== 'right') || p.series[0];
  const right = p.series.find(s => s.axis === 'right');
  const x = i => L + i * (W - L - R) / Math.max(1, t.length - 1);
  const yOf = s => v => T + (H - T - B) * (1 - v / (s.max || Math.max(...s.data, 1)));
  const path = (arr, f) => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + f(v).toFixed(1)).join(' ');
  const lm = left.max || Math.max(...left.data, 1), y1 = yOf(left);
  const m = p.marker;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(p.series.map(s => s.name).join(', '))}">
    ${[0, 1, 2, 3, 4, 5].map(k => Math.round(lm * k / 5)).map(v => `<line x1="${L}" x2="${W - R}" y1="${y1(v)}" y2="${y1(v)}" stroke="#2A2B33"/><text x="${L - 6}" y="${y1(v) + 3}" text-anchor="end">${v}</text>`).join('')}
    ${right ? [0, .5, 1].map(k => Math.round((right.max || Math.max(...right.data, 1)) * k)).map(v => `<text x="${W - R + 6}" y="${yOf(right)(v) + 3}">${v}</text>`).join('') : ''}
    ${m ? `<line x1="${x(m.i)}" x2="${x(m.i)}" y1="${T}" y2="${H - B}" stroke="#EC1D35" stroke-dasharray="3 3"/>
    <text x="${x(m.i) - 6}" y="${T + 10}" text-anchor="end" style="fill:#FF7A8A">${esc(m.label)}</text>` : ''}
    ${right ? `<path d="${path(right.data, yOf(right))}" fill="none" stroke="#8C84FF" stroke-width="1.5" stroke-dasharray="4 3"/>` : ''}
    <path d="${path(left.data, y1)}" fill="none" stroke="#EDEDED" stroke-width="2"/>
    ${t.map((s, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(s)}</text>`).join('')}
  </svg>
  <div class="row small" style="color:var(--on-dark-2);margin-top:6px;gap:18px">
    <span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="#EDEDED" stroke-width="2"/></svg> ${esc(left.name)}${right ? ' (слева)' : ''}</span>
    ${right ? `<span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="#8C84FF" stroke-width="1.5" stroke-dasharray="4 3"/></svg> ${esc(right.name)} (справа)</span>` : ''}
  </div>`;
}

function logsPanel(p) {
  // panel {type:'logs', lines:[{t, src, lvl, msg}]}
  const cls = l => /err|crit|fatal/i.test(l) ? 'e' : /warn/i.test(l) ? 'w' : 'i';
  return `<div class="term">${p.lines.map(l => `<span class="${cls(l.lvl)}">${esc(l.t)} ${esc((l.src || '').padEnd(13))} ${esc((l.lvl || '').padEnd(5))}</span> ${esc(l.msg)}`).join('\n')}</div>`;
}

// простая подсветка: комментарии, строки, ключевые слова Python / SQL
const HL = /(#.*$|--\s.*$)|("[^"]*"|'[^']*')|\b(async|def|await|with|if|elif|else|return|for|while|in|try|except|finally|break|continue|import|from|class|raise|not|and|or|is|None|True|False|lambda|yield|SELECT|FROM|WHERE|UPDATE|INSERT|INTO|SET|ALTER|TABLE|ADD|COLUMN|CREATE|INDEX|BEGIN|COMMIT|ON|AND|OR|NOT|NULL|DEFAULT|JOIN|ORDER|BY|LIMIT|FOR|DROP|CONCURRENTLY|VALUES|GROUP|HAVING|DELETE)\b/g;
function hl(line) {
  let out = '', last = 0;
  line.replace(HL, (m, cm, st, kw, off) => { out += esc(line.slice(last, off)) + `<span class="${cm ? 'cm' : st ? 'st' : 'kw'}">${esc(m)}</span>`; last = off + m.length; return m; });
  return out + esc(line.slice(last));
}
function codePanel(p, clickable) {
  // panel {type:'code', lang, lines:[str], caption?}; для mark/review строки кликабельны (номер строки с 1)
  return `<div class="code" role="group" aria-label="Код">${p.lines.map((l, i) => `<button ${clickable ? `data-act="mark" data-line="${i + 1}" aria-pressed="${S.codeMark === i + 1}"` : 'disabled'}><span class="ln">${i + 1}</span><span>${hl(l)}</span></button>`).join('')}</div>
    ${p.caption ? `<p class="small" style="color:var(--on-dark-2);margin-top:10px">${esc(p.caption)}</p>` : ''}`;
}

// задание теста приходит с сервера: POST /api/quest/start (продолжает незаконченную сессию) → /answer → /finish
function sceneView() {
  const q = S.quest;
  if (!q) return `<div class="panel">Не удалось загрузить задание. <button class="btn ghost small" data-go="/c/quest">К вводной</button></div>`;
  if (q.done || !q.item) return `
  <div class="quest fade" style="padding:clamp(24px,5vw,52px);display:flex;flex-direction:column;gap:18px;align-items:flex-start">
    <span class="label" style="color:var(--on-dark-2)">Все задания пройдены · ${q.progress.n} из ${q.progress.total}</span>
    <h2 style="color:#fff">${S.story ? '18:00. Смена закончена' : 'Тест закончен'}</h2>
    <p class="prose" style="color:var(--on-dark-2)">Траектория была адаптивной: после каждого ответа пересчитывали θ и SE и подбирали следующее задание. Тест останавливается, когда погрешность достаточно мала.</p>
    <button class="btn primary" data-act="finish">Посмотреть категорию</button>
  </div>`;
  const it = q.item, n = q.progress.n, total = q.progress.total, p = it.panel;
  const isMark = it.kind !== 'choice';
  if (S.qItem !== it.id) { S.qItem = it.id; S.qAns = null; S.codeMark = null; S.qComment = ''; S.qShownAt = Date.now(); }
  const left = !p ? '' : p.type === 'logs' ? logsPanel(p) : p.type === 'chart' ? lineChart(p) : codePanel(p, isMark);
  const right = isMark
    ? `<div class="stack">
         <p class="q">${esc(it.prompt)}</p>
         <p class="small" style="color:var(--on-dark-2)">${S.codeMark ? `Отмечена строка ${S.codeMark}.${it.comment ? ' Коротко объясните, что не так.' : ''}` : 'Пока ничего не отмечено.'}</p>
         ${it.comment ? `<textarea class="input" id="rv-comment" placeholder="Комментарий к ревью, 1–2 предложения" style="background:var(--dark-2);border-color:var(--dark-line);color:var(--on-dark);min-height:90px">${esc(S.qComment)}</textarea>` : ''}
       </div>`
    : `<div class="stack"><p class="q">${esc(it.prompt)}</p><div class="opts">${it.options.map((o, i) => `<button class="opt" data-act="ans" data-i="${i}" aria-pressed="${S.qAns === i}"><span class="k">${'ABCDEFGH'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`;
  const canNext = isMark ? !!S.codeMark : S.qAns != null;
  const sec = q.remaining_s != null ? Math.max(0, q.remaining_s - Math.round((Date.now() - (S.qAt || Date.now())) / 1000)) : it.time_limit_s;
  return `
  ${crumbs([['Тест-квест', '/c/quest'], [(S.story ? 'Сцена ' : 'Задание ') + n]])}
  <div class="quest fade">
    <div class="quest-top">
      <b>${S.story ? esc(it.scene_title) : 'Задание ' + n}</b>
      <div class="pr" aria-label="Прогресс">${Array.from({ length: total }, (_, i) => `<i class="${i + 1 < n ? 'on' : i + 1 === n ? 'cur' : ''}"></i>`).join('')}</div>
      <span style="color:var(--on-dark-2)">${esc(it.competency)}</span>
      <button class="switch" role="switch" aria-checked="${S.story}" data-act="story"><i></i> сюжет</button>
      <span class="timer" id="timer" data-sec="${sec}">⏱ <span>${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</span></span>
    </div>
    <div class="quest-body">
      <div class="stack">
        ${S.story && it.story ? `<p class="story">${it.time ? `<span class="t">${esc(it.time)}</span>` : ''}${esc(it.story)}</p>` : ''}
        ${left}
      </div>
      <div>${right}</div>
    </div>
    <div class="quest-foot">
      <span>Ответ сохраняется сразу. Правильность не показываем до конца теста.</span>
      <div class="row">
        <button class="btn primary small" ${canNext ? '' : 'disabled'} data-act="qnext">Дальше</button>
      </div>
    </div>
  </div>`;
}

function inviteView() {
  const inv = D.inv;
  if (!inv) return `${crumbs([['Кабинет', '/c/home'], ['Приглашение']])}<div class="panel">Приглашение не найдено.</div>`;
  const id = inv.id;
  const reasons = Object.entries((META && META.decline_reasons) || {});
  const r = inv.recruiter || {};
  let actions = '';
  if (inv.status === 'accepted') {
    const me = inv.company_sees || {};
    actions = `<div class="panel stack" style="border-color:var(--ok)">
      <div class="alert ok"><b>Вы приняли приглашение.</b> Ваши контакты открыты компании.</div>
      <dl class="kv"><dt>Компания видит</dt><dd>${[me.name, me.email, me.tg].filter(Boolean).map(esc).join(', ')}</dd></dl>
    </div>`;
  } else if (inv.status === 'declined') {
    actions = `<div class="alert bad">Вы отклонили приглашение. Причина «${esc(inv.reason)}» передана компании без ваших контактов.</div>`;
  } else if (inv.status === 'expired') {
    actions = `<div class="alert warn">Срок ответа истёк. Компания видит, что приглашение осталось без ответа.</div>`;
  } else if (S.declineFor === id) {
    actions = `<div class="panel stack">
      <h3>Почему нет?</h3>
      <p class="small muted">Компания увидит только причину. Это помогает подбирать вам более точные предложения.</p>
      <div class="chips">${reasons.map(([k, x]) => `<button class="chip ${S.declineReason === k ? 'on' : ''}" data-act="reason" data-v="${k}">${esc(x)}</button>`).join('')}</div>
      <textarea class="input" id="dc-comment" placeholder="Комментарий, по желанию" style="min-height:70px">${esc(S.dcComment)}</textarea>
      <div class="row"><button class="btn danger" ${S.declineReason ? '' : 'disabled'} data-act="decline" data-id="${id}">Отклонить</button><button class="btn ghost" data-act="cancel-decline">Отмена</button></div>
    </div>`;
  } else {
    actions = `<div class="row"><button class="btn primary" data-act="accept" data-id="${id}">Принять и открыть мои контакты</button><button class="btn ghost" data-act="ask-decline" data-id="${id}">Нет: указать причину</button></div>`;
  }
  if (inv.chat_peer != null) actions = `<div class="row">${chatBtn('c', inv.chat_peer, 'btn ghost')}</div>` + actions;
  return `
  ${crumbs([['Кабинет', '/c/home'], [esc(inv.company)]])}
  ${subnav('c')}
  <div class="grid side fade">
    <div class="stack">
      ${domainWarn(inv)}
      <div class="panel stack">
        <div class="row"><span class="logo-sq" style="background:${esc(inv.color)}">${esc(inv.company[0])}</span><div><b>${esc(inv.company)}</b><br><span class="small muted">${esc(inv.about)}</span></div><span style="margin-left:auto">${coChip(inv)}</span></div>
        <h2>${esc(inv.role)}</h2>
        <div class="row" style="gap:20px">
          <div class="stat"><span class="label">Вилка на руки</span><b class="num" style="font-size:24px">${RUB(inv.from)} — ${RUB(inv.to)}</b></div>
        </div>
        <div class="alert ${inv.fork_check.ok ? 'ok' : 'warn'}">${esc(inv.fork_check.text)}.</div>
        <dl class="kv">
          <dt>Формат</dt><dd>${esc(inv.format)}</dd>
          <dt>О работе</dt><dd class="prose pre" style="font-size:14px">${esc(inv.desc) || '<span class="muted">—</span>'}</dd>
          <dt>Задача</dt><dd>${inv.task ? esc(inv.task) : '<span class="muted">не приложена</span>'}</dd>
          ${isOpen(inv) ? `<dt>Срок ответа</dt><dd>${inv.due} дн. из ${(META && META.invite_ttl_days) || 7}</dd>` : ''}
          <dt>Почему вы</dt><dd>${esc(inv.why) || '<span class="muted">—</span>'}</dd>
        </dl>
        ${inv.task && inv.status !== 'declined' && inv.status !== 'expired' ? `<div class="alert info"><span>→</span><span>Можно пройти тест под эту вакансию: задания сместятся к нужным компетенциям, грейд считается как обычно. <button class="btn ghost small" data-act="quest-invite" data-id="${id}">Пройти тест по приглашению</button></span></div>` : ''}
      </div>
      ${(D.invTasks || []).length ? `<div class="panel stack-s">
        <h3>Задания по приглашению</h3>
        <p class="small muted">Задания компании по этой вакансии. Решение уйдёт вместе с приглашением, контакты не раскрываются.</p>
        ${D.invTasks.map(t => `<div class="row sb" style="padding:6px 0;border-bottom:1px dashed var(--line-2)"><button class="btn ghost small" data-go="/c/task/${t.id}/${id}" style="justify-content:flex-start">${esc(t.title)}</button><span class="row small" style="gap:6px"><span class="muted">${KIND_T[t.kind] || esc(t.kind)} · ~${t.minutes} мин</span>${t.submitted ? reviewChip(t.review) : '<span class="chip">не решено</span>'}</span></div>`).join('')}
      </div>` : ''}
      ${actions}
    </div>
    <aside class="stack">
      <div class="panel tight stack-s">
        <span class="label">Связаться с компанией</span>
        <dl class="kv small" style="grid-template-columns:auto 1fr"><dt>Рекрутер</dt><dd>${esc(r.name || '—')}</dd><dt>Почта</dt><dd>${esc(r.email || '—')}</dd><dt>Telegram</dt><dd>${esc(r.tg || '—')}</dd></dl>
        <span class="hint">Контакт компании виден сразу. Ваши контакты компания получит, только если вы примете приглашение.</span>
      </div>
      <div class="panel tight stack-s">
        <span class="label">Что знает компания сейчас</span>
        <p class="small">${inv.company_knows === 'contacts' ? 'Ваши ФИО и контакты: вы приняли приглашение.' : `Только анонимную карточку ${esc(inv.public_id)}. ФИО и контакты откроются после принятия.`}</p>
        <div class="divider"></div>
        <span class="label">Ваша нагрузка</span>
        <p class="small num">${inv.load.open} из ${inv.load.cap} открытых приглашений. Когда лимит заполнен, вы опускаетесь в выдаче, а компании видят «много предложений».</p>
      </div>
    </aside>
  </div>`;
}

const onChat = () => /^\/[ce]\/chat(\/|$)/.test(route());
const chatSide = () => route().startsWith('/c') ? 'c' : 'e';
const chatMe = () => chatSide() === 'c' ? 'candidate' : 'employer';

const WHEN = s => new Date(s).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function drawChat(stick = true) {
  const box = document.getElementById('chat-messages');
  if (!box || !D.chatDetail) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = chatMessages();
  if (stick || atBottom) box.scrollTop = box.scrollHeight;
}
function drawChatSide() {
  UNREAD = ((D.chatContacts && D.chatContacts.contacts) || []).reduce((n, c) => n + c.unread_count, 0);
  const l = document.getElementById('chat-list'), nav = document.querySelector('nav.chips');

async function loadChat(peer) {
  const me = chatMe();
  D.chatDetail = peer ? await api('GET', '/api/chat/' + encodeURIComponent(peer)).catch(e => { if (e.status === 403 || e.status === 404) return null; throw e; }) : null;
  if (D.chatDetail && D.chatDetail.messages.some(m => m.sender !== me && !m.read_at)) await api('POST', '/api/chat/' + encodeURIComponent(peer) + '/read');
  D.chatContacts = await api('GET', '/api/chat/contacts');
  UNREAD = D.chatContacts.contacts.reduce((n, c) => n + c.unread_count, 0);
}

// опрос раз в несколько секунд: подтягивает новые сообщения и отметки «прочитано», не трогая поле ввода
let chatBusy = false;
let chatAgain = false;  // сигнал пришёл, пока шёл прошлый опрос: после него повторяем
async function pollChat() {
  if (!onChat() || document.hidden || $app.inert) return;
  if (chatBusy) { chatAgain = true; return; }
  chatBusy = true;
  const my = seq, peer = chatPeerOf(), d = D.chatDetail, me = chatMe();
  try {
    const dt = peer != null && d ? await api('GET', '/api/chat/' + encodeURIComponent(peer)) : null;
    if (my !== seq || !onChat()) return;
    if (dt && dt.messages.some(m => m.sender !== me && !m.read_at)) await api('POST', '/api/chat/' + encodeURIComponent(peer) + '/read');
    const cs = await api('GET', '/api/chat/contacts');
    if (my !== seq || !onChat()) return;
    D.chatContacts = cs;
    if (dt && D.chatDetail === d) {
      if (dt.can_write !== d.can_write) { d.can_write = dt.can_write; rerender(); }
      const first = dt.messages.length ? dt.messages[0].id : Infinity, sig = a => a.map(m => m.id + (m.read_at ? 'r' : '')).join();
      const merged = [...d.messages.filter(m => m.id < first), ...dt.messages];
      if (sig(merged) !== sig(d.messages)) { d.messages = merged; drawChat(false); }
    }
    drawChatSide();
  } catch (e) {
    // доступ закрыт посреди сессии (отозвано согласие, профиль скрыт): убираем уже загруженное
    if ((e.status === 403 || e.status === 404) && my === seq && onChat() && D.chatDetail === d) { D.chatDetail = null; rerender(); }
  } finally {
    chatBusy = false;
    if (chatAgain) { chatAgain = false; pollChat(); }
  }
}

// Push: сервер шлёт «data: new», когда у участника появилось новое; клиент после этого перечитывает данные обычными GET.
let chatCtl = null, chatStreamSide = null;
function chatStop() { if (chatCtl) chatCtl.abort(); chatCtl = chatStreamSide = null; }
async function chatNudge() {
  if (document.hidden) return;
  if (onChat()) return pollChat();
  const side = chatSide();
  if (!TOK[side] || !/^\/[ce]\//.test(route())) return;
  try {
    UNREAD = (await api('GET', '/api/chat/unread')).unread_count;
    const nav = document.querySelector('nav.chips');
    if (nav && route().startsWith('/' + side)) nav.outerHTML = subnav(side);
  } catch { /* бейдж не критичен */ }
}
async function chatStream(side) {
  chatStop();
  const ctl = chatCtl = new AbortController();
  chatStreamSide = side;
  while (!ctl.signal.aborted) {
    try {
      const r = await fetch('/api/chat/stream', { headers: { Authorization: 'Bearer ' + TOK[side] }, signal: ctl.signal });
      if (r.status === 401 || r.status === 403) { if (chatCtl === ctl) chatCtl = chatStreamSide = null; return; }  // нет входа или профиля — без повторов
      if (!r.ok) throw new Error('stream ' + r.status);  // 5xx/429: не читаем тело, повтор через паузу
      chatNudge();  // догоняем всё, что пришло, пока потока не было (первое подключение и каждое переподключение)
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        if (parts.some(x => x.startsWith('data:'))) chatNudge();
      }
    } catch { /* обрыв сети или abort */ }
    if (!ctl.signal.aborted) await new Promise(res => setTimeout(res, 3000));  // переподключение
  }
}

async function chatSend() {
  const el = document.getElementById('chat-input'), peer = chatPeerOf(), text = el ? el.value.trim() : '';
  if (!text || peer == null) return;
  const m = await api('POST', '/api/chat/' + encodeURIComponent(peer), { text });
  if (chatPeerOf() !== peer) return;
  el.value = '';
  D.chatDetail.messages.push(m);
  drawChat();
  D.chatContacts = await api('GET', '/api/chat/contacts');
  drawChatSide();
}

async function chatMore() {
  const d = D.chatDetail, peer = chatPeerOf();
  if (!d || !d.messages.length) return;
  const r = await api('GET', `/api/chat/${encodeURIComponent(peer)}?before_id=${d.messages[0].id}`);
  if (D.chatDetail !== d) return;
  const box = document.getElementById('chat-messages'), h = box.scrollHeight;
  d.messages = [...r.messages, ...d.messages]; d.more = r.more;
  drawChat(false);
  box.scrollTop = box.scrollHeight - h;
}

// accept_prob из бэкенда (matching.accept_prob) для живой подсказки: формат ок, интерес к стеку 1
const acceptProb = (to, min) => { const r = Math.max(-.5, Math.min(.5, (to - min) / Math.max(min, 1))); const z = -0.55 + 7 * r + (r < 0 ? 7 * r : 0); return 1 / (1 + Math.exp(-z)); };

    desc: n ? n.text : '', task: true, server: null,

  const f = S.inviteForm, mk = c.market, maxW = (META && META.fork_max_width) || .4;

V['/v'] = () => {
  const R = D.val;
  const ds = R && R.dataset, Q = R && R.quality, M = R && R.market, C = R && R.cheater, St = R && R.stability;
  const vs = Q ? Q.variants : [];
  const qo = M && M.rows.some(r => r.quota_only != null);
  return `

  </div>
  <div class="grid g2">
    <div class="panel stack">
      <h3>Качество выдачи, top-${R ? R.k : 10}</h3>

      ${Q ? `<div class="bars">
        <span class="label">precision@${R.k} (доля релевантных в топе)</span>

        <span class="label" style="margin-top:8px">nDCG@${R.k}</span>

      </div>
      ${Q.by_kind ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>nDCG@${R.k} по типам потребностей</th>${vs.map(v => `<th class="num">${esc(VSHORT[v.key] || v.key)}</th>`).join('')}</tr></thead>
        <tbody>${Object.entries(Q.by_kind).map(([k, row]) => `<tr><td>${esc(KIND[k] || k)}</td>${vs.map(v => `<td class="num">${DEC(row[v.key] && row[v.key].ndcg)}</td>`).join('')}</tr>`).join('')}</tbody>

      <h3>Симуляция рынка</h3>

      ${M ? `<div class="tbl-wrap"><table class="tbl">

      </table></div>
      ${M.top5_share ? `<p class="small muted">Доля приглашений у топ-5 % кандидатов: ${PCT1(M.top5_share.with_limits)} с лимитами, ${PCT1(M.top5_share.no_limits)} без них.${M.rounds ? ` Раундов симуляции: ${M.rounds}.` : ''}</p>` : ''}` : VAL_RUN}

        ${St.theta_corr != null ? `<div class="stat"><span class="label">Оценка θ и «истинный» θ</span><b>${DEC(St.theta_corr)}</b><span class="small muted">корреляция на синтетике</span></div>` : ''}

async function load(r) {
  // данные экрана — только из этой загрузки: после ошибки не показываем то, что осталось от прошлого визита
  for (const k of Object.keys(D)) if (k !== 'co' && k !== 'coName') delete D[k];
  if (!META) {
    META = await api('GET', '/api/meta');
    CAP = META.cap;
    GRADE_TH = Object.entries(META.grade_th).filter(([g]) => g !== 'Intern').map(([g, t]) => ({ g, t }));
  }
  const [, side, page, arg] = r.split('/');
  if ((side === 'c' || side === 'e') && page !== 'signup' && page !== 'chat' && TOK[side]) UNREAD = await api('GET', '/api/chat/unread').then(x => x.unread_count, e => { if (e.status === 401) throw e; return 0; });  // бейдж не критичен: ошибка сети его не роняет, протухший вход — обычный путь
  if (side === 'c' && page !== 'signup') {
    await loadMe();
    if (page === 'profile') { ACH = ME ? await api('GET', '/api/achievements') : null; S.pf = pfFromMe(); S.cv = null; S.cfCode = null; }  // код CF — только один раз
    if (!ME) return;
    if (page === 'quest' && arg === 'go') {
      S.quest = await api('POST', '/api/quest/start', { story: S.story, target_grade: S.target || ME.grade_claimed, invitation_id: S.questInvite });
      S.qAt = Date.now(); S.finish = null; S.questInvite = null;
    } else if (page === 'quest') D.history = await api('GET', '/api/quest/history');
    else if (page === 'result') {
      [D.result, ACH, D.history] = await Promise.all([S.finish || or404(api('GET', '/api/quest/result')), api('GET', '/api/achievements'), api('GET', '/api/quest/history')]);
    }
    else if (page === 'home') { D.invites = null; D.invites = await api('GET', '/api/candidate/invites'); }  // null — признак ошибки загрузки
    else if (page === 'invite') {
      [D.inv, D.invTasks] = await Promise.all([or404(api('GET', '/api/candidate/invites/' + encodeURIComponent(arg))), or404(api('GET', '/api/tasks/for-invitation/' + encodeURIComponent(arg)))]);
      S.declineFor = null;
    }
    else if (page === 'settings') { [ACH, D.auth] = await Promise.all([api('GET', '/api/achievements'), api('GET', '/api/auth/me')]); S.confirm = null; S.hiddenEdit = false; }
    else if (page === 'vacancies') [, D.apps] = await Promise.all([loadVac(), api('GET', '/api/vacancies/applications/mine')]);
    else if (page === 'vacancy') { [D.vacancy, D.apps] = await Promise.all([or404(api('GET', '/api/vacancies/' + encodeURIComponent(arg))), api('GET', '/api/vacancies/applications/mine')]); S.applyNote = ''; S.applyErr = null; }
    else if (page === 'applications') D.apps = await api('GET', '/api/vacancies/applications/mine');
    else if (page === 'tasks') [D.showcase, D.subs] = await Promise.all([api('GET', '/api/tasks/showcase'), api('GET', '/api/tasks/submissions/mine')]);
    else if (page === 'task') { S.taskInv = +r.split('/')[4] || null; [D.task, D.subs] = await Promise.all([or404(api('GET', '/api/tasks/' + encodeURIComponent(arg))), api('GET', '/api/tasks/submissions/mine')]); S.answer = ''; }
    else if (page === 'chat') await loadChat(arg);
  }
  if (side === 'e') {
    if (page === 'signup') {
      D.company = TOK.e ? await api('GET', '/api/employer/company').catch(() => null) : null;
      if (D.company) { D.co = D.company; D.coName = D.company.name; }
      return;
    }
    await ensureCo();
    await ensureNeed();
    if (page === 'need') { if (!S.need.text) S.need.text = (S.needObj && S.needObj.text) || NEED_TEXT; }
    else if (page === 'picks') await loadPicks();
    else if (page === 'search') await loadSearch();
    else if (page === 'cand' || page === 'invite') {
      D.cand = await or404(api('GET', `/api/employer/candidates/${encodeURIComponent(arg)}${S.needId ? '?need_id=' + S.needId : ''}`));
      if (page === 'invite') D.quota = await api('GET', '/api/employer/quota');
    }
    else if (page === 'pipeline') D.pipe = await api('GET', '/api/employer/pipeline');
    else if (page === 'vacancies') D.myvac = await api('GET', '/api/vacancies/mine');
    else if (page === 'vacancy') { D.vapps = await or404(api('GET', `/api/vacancies/${encodeURIComponent(arg)}/applications`)); S.appDecline = null; }
    else if (page === 'tasks') D.mytasks = await api('GET', '/api/tasks/mine');
    else if (page === 'task') D.tsubs = await or404(api('GET', `/api/tasks/${encodeURIComponent(arg)}/submissions`));
    else if (page === 'chat') await loadChat(arg);
  }
  if (side === 'v') D.val = await or404(api('GET', '/api/validation'));
}

let timerId, seq = 0;
const PARAM_VIEWS = [['/c/chat/', () => chatView('c')], ['/e/chat/', () => chatView('e')], ['/c/invite/', inviteView], ['/c/vacancy/', cVacancyView], ['/c/task/', cTaskView], ['/e/cand/', candView], ['/e/invite/', inviteFormView], ['/e/vacancy/', eVacancyView], ['/e/task/', eTaskView]];
function render() {
  const r = route();
  let html;
  try {
    const pv = PARAM_VIEWS.find(([p]) => r.startsWith(p));
    html = V[r] ? V[r]() : pv ? pv[1]() : V['/']();
  } catch (e) {
    console.error(e);
    html = `<div class="panel stack"><p>Не удалось показать экран: данные не загрузились.</p><div class="row"><button class="btn ghost small" data-act="reload">Повторить</button></div></div>`;
  }
  $app.innerHTML = html;
  busy(false);
  const cm = document.getElementById('chat-messages');
  if (cm) cm.scrollTop = cm.scrollHeight;
  const role = r.startsWith('/c') ? 'c' : r.startsWith('/e') ? 'e' : r.startsWith('/v') ? 'v' : '';
  document.querySelectorAll('.roles button').forEach(b => b.setAttribute('aria-current', b.dataset.role === role));
  document.getElementById('logout').hidden = !(role === 'c' || role === 'e') || !TOK[role];
  if ((role === 'c' || role === 'e') && TOK[role]) { if (chatStreamSide !== role) chatStream(role); } else chatStop();
  startTimer();
}
function rerender() { const y = scrollY; render(); scrollTo(0, y); }

// смена экрана: без входа — на экран входа своей роли; загрузка данных, рендер
// пока грузится следующий экран, прежний неактивен (inert): клик по устаревшей кнопке не уйдёт с параметрами старого экрана
function busy(on) { $app.inert = on; on ? $app.setAttribute('aria-busy', 'true') : $app.removeAttribute('aria-busy'); }
async function show(keep) {
  const r = route(), my = ++seq, y = scrollY;
  const side = r.split('/')[1];
  busy(true);
  if ((side === 'c' || side === 'e') && r !== `/${side}/signup` && !TOK[side]) { go(`/${side}/signup`); return; }
  try {
    await load(r);
  } catch (e) {
    if (my === seq) fail(e);
    if (e.status === 401) { if (my === seq && r === route()) busy(false); return; }
  }
  if (my !== seq || r !== route()) return;
  render();
  scrollTo(0, keep ? y : 0);
}
const refresh = () => show(true);

function startTimer() {
  clearInterval(timerId);
  const el = document.getElementById('timer');
  if (!el) return;
  let s = +el.dataset.sec;
  el.classList.toggle('low', s < 60);
  timerId = setInterval(() => {
    s = Math.max(0, s - 1);
    el.querySelector('span').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    el.classList.toggle('low', s < 60);
    if (!s) clearInterval(timerId);
  }, 1000);
}
