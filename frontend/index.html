<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>ФСП Карьера</title>
<link rel="icon" href="/assets/mark.png">
<!-- на телефоне стенд добавляется на домашний экран как приложение: манифест и иконка -->
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ФСП Карьера">
<meta name="color-scheme" content="light dark">
<script>
/* тема применяется до первой отрисовки, чтобы не было вспышки: 'light' | 'dark', без выбора — по системе */
try { const th = localStorage.getItem("fsp.theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) { /* приватный режим */ }
</script>
<style>
@font-face { font-family: "JetBrains Mono"; src: url(/assets/fonts/JetBrainsMono-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/assets/fonts/JetBrainsMono-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/assets/fonts/JetBrainsMono-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/assets/fonts/JetBrainsMono-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }

/* Макет: светлое «бумажное» поле с тонкой синей рамкой и линиями-трассами из брендбука ФСП;
   тёмные блоки (#1B1C21) — для атмосферы теста и героя. Красный — только для критичного. */
:root {
  --blue: #402FFF;
  --blue-ink: #2A1FD1;
  --blue-hover: #2A1FD1;
  --on-dark-accent: #B9B2FF;
  --bar-alt: #B9B2FF;
  --on-blue-2: #B9B2FF;
  --logo-ring: transparent;
  --blue-soft: #EDEBFF;
  --blue-line: #B9B2FF;
  --red: #EC1D35;
  --red-soft: #FDE8EA;
  --ink: #1B1C21;
  --ink-2: #4A4B55;
  --ink-3: #7C7D87;
  --line: #C8C9CA;
  --line-2: #E2E2E6;
  --mist: #EDEDED;
  --paper: #FFFFFF;
  --ground: #F6F6F8;
  --ok: #138A55;
  --ok-soft: #E3F4EC;
  --warn: #B86E00;
  --warn-soft: #FFF2DC;
  --dark: #1B1C21;
  --dark-2: #25262D;
  --dark-line: #3A3B45;
  --on-dark: #EDEDED;
  --on-dark-2: #A3A4AE;
  --blue-text: #402FFF;
  --on-accent: #FFFFFF;
  --on-red: #FFFFFF;
  --alert-warn: #6E4200;
  --alert-bad: #8E0F1E;
  --alert-ok: #0B5A37;
  --toast-bg: #1B1C21;
  --toast-fg: #FFFFFF;
  --shadow: rgba(27,28,33,.12);
  --logo-filter: none;
  color-scheme: light;

  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  --r: 14px;
  --r-s: 8px;
  --gut: clamp(16px, 4vw, 40px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --blue: #5E50FF;       /* заливка: белый текст ≥ 5,1:1 */
  --blue-text: #8C84FF;  /* текст и рамки на тёмном: ≥ 5,8:1 на --paper */
  --blue-ink: #B5AFFF;
  --blue-hover: #4B3DF0;
  --on-blue-2: #FFFFFF;
  --logo-ring: var(--line);
  --blue-soft: #23224A;
  --blue-line: #4A44A8;
  --red: #FF6B7D;
  --on-red: #1B1C21;
  --red-soft: #3A1219;
  --ink: #EDEDF0;
  --ink-2: #B4B5C0;
  --ink-3: #9496A3;
  --line: #3A3B45;
  --line-2: #2A2B33;
  --mist: #25262D;
  --paper: #17181D;
  --ground: #0F1013;
  --ok: #4CC38A;
  --ok-soft: #12301F;
  --warn: #F2B84B;
  --warn-soft: #3A2A0A;
  --alert-warn: #FFD79A;
  --alert-bad: #FFB3BC;
  --alert-ok: #9BE3BF;
  --toast-bg: #EDEDF0;
  --toast-fg: #1B1C21;
  --shadow: rgba(0,0,0,.5);
  --logo-filter: invert(1) hue-rotate(180deg);  /* логотип с тёмными буквами */
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --blue: #5E50FF;       /* заливка: белый текст ≥ 5,1:1 */
  --blue-text: #8C84FF;  /* текст и рамки на тёмном: ≥ 5,8:1 на --paper */
  --blue-ink: #B5AFFF;
  --blue-hover: #4B3DF0;
  --on-blue-2: #FFFFFF;
  --logo-ring: var(--line);
  --blue-soft: #23224A;
  --blue-line: #4A44A8;
  --red: #FF6B7D;
  --on-red: #1B1C21;
  --red-soft: #3A1219;
  --ink: #EDEDF0;
  --ink-2: #B4B5C0;
  --ink-3: #9496A3;
  --line: #3A3B45;
  --line-2: #2A2B33;
  --mist: #25262D;
  --paper: #17181D;
  --ground: #0F1013;
  --ok: #4CC38A;
  --ok-soft: #12301F;
  --warn: #F2B84B;
  --warn-soft: #3A2A0A;
  --alert-warn: #FFD79A;
  --alert-bad: #FFB3BC;
  --alert-ok: #9BE3BF;
  --toast-bg: #EDEDF0;
  --toast-fg: #1B1C21;
  --shadow: rgba(0,0,0,.5);
  --logo-filter: invert(1) hue-rotate(180deg);  /* логотип с тёмными буквами */
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 14px/1.55 var(--mono);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
img { max-width: 100%; display: block; }
a { color: var(--blue-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 4.2vw, 44px); }
h2 { font-size: clamp(20px, 2.4vw, 26px); }
h3 { font-size: 16px; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 500; }
.prose { font-family: var(--sans); font-size: 15px; line-height: 1.6; max-width: 62ch; color: var(--ink-2); }

/* ---------- шапка ---------- */
.top {
  position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line-2);
}
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px var(--gut); padding-left: max(var(--gut), env(safe-area-inset-left)); padding-right: max(var(--gut), env(safe-area-inset-right)); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.brand img { height: 30px; width: auto; filter: var(--logo-filter); }
.brand .prod { font-weight: 600; font-size: 13px; padding-left: 12px; border-left: 1px solid var(--line); line-height: 1.2; }
.brand .prod span { display: block; font-weight: 400; color: var(--ink-3); font-size: 11px; }
#theme { margin-left: auto; }
.topbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
@media (hover: hover) { .topbtn:hover { border-color: var(--blue); color: var(--blue-text); } }
/* телефон и планшет: шапка в одну строку — логотип, значок темы и «Выйти»; кабинет выбирается на главной (логотип вне кабинета → «Кандидатам» / «Компаниям») */
@media (max-width: 900px) {
  .top-in { flex-wrap: nowrap; height: 56px; padding-top: 0; padding-bottom: 0; gap: 12px; }
  .brand { min-width: 0; gap: 10px; }
  .brand img { height: 26px; }
  .brand .prod { padding-left: 10px; white-space: nowrap; }
  .topbtn { min-height: 40px; padding: 8px 14px; }
  .top #theme { padding: 6px 12px; font-size: 17px; line-height: 1; }  /* только значок ☾ / ☀, подпись — в aria-label */
  .on-wide { display: none; }
}
@media (max-width: 430px) { .brand .prod span { display: none; } }  /* подпись под названием (кабинет) не помещается рядом с темой и «Выйти»: кабинет видно по крошкам */
@media (max-width: 360px) { .brand .prod { display: none; } }  /* самый узкий телефон: только логотип ФСП */
@media (max-height: 480px) and (orientation: landscape) { .top { position: static; } }  /* телефон боком: шапка не съедает и без того низкий экран */

/* ---------- каркас ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 28px var(--gut) 80px; }
main { padding-left: max(var(--gut), env(safe-area-inset-left)); padding-right: max(var(--gut), env(safe-area-inset-right)); padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
@media (max-width: 560px) { main { padding-top: 16px; } }
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; font-size: 12px; color: var(--ink-3); }
.crumbs b { color: var(--ink); font-weight: 500; }
.crumbs a { color: var(--blue-text); text-decoration: none; font-size: 12px; }
@media (hover: hover) { .crumbs a:hover { text-decoration: underline; } }

.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.side { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
.side-l { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
/* чат */
.chat { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: stretch; margin-bottom: 24px; }
.chat-list { max-height: 70vh; overflow-y: auto; align-content: start; }
.chat-peer { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px; border: 1px solid transparent; border-radius: var(--r-s); background: transparent; cursor: pointer; font: inherit; color: inherit; }
.chat-peer span.small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.chat-peer.on { background: var(--blue-soft); border-color: var(--blue-line); }
.chat-box { display: flex; flex-direction: column; height: 70vh; min-height: 360px; }
.chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
.msg { align-self: flex-start; max-width: 80%; padding: 8px 12px; border-radius: var(--r-s); background: var(--ground); }
.msg.me { align-self: flex-end; background: var(--blue-soft); }
.msg p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.msg time { display: block; text-align: right; margin-top: 4px; font-size: 11px; color: var(--ink-3); }
.unread { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: var(--on-red); font-size: 11px; line-height: 1; vertical-align: middle; flex: none; }
.btn.chat-back { display: none; }
.row.chat-head { padding-bottom: 12px; border-bottom: 1px solid var(--line-2); gap: 10px; flex-wrap: nowrap; }
.chat-head b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* телефон и планшет: либо список диалогов, либо открытый диалог на всю высоту экрана (без строки разделов) */
@media (max-width: 900px) {
  .chat { grid-template-columns: minmax(0, 1fr); }
  .chat-list { max-height: none; }
  .btn.chat-back { display: inline-flex; }
  .chat.has-peer .chat-list, .chat:not(.has-peer) .chat-box { display: none; }
  .chat.has-peer .chat-box:not(.chat-empty) { height: calc(100dvh - 56px - env(safe-area-inset-top) - var(--chat-gap, 96px)); min-height: 320px; }
  main:has(.chat.has-peer) .subnav { display: none; }
  .chat.has-peer { margin-bottom: 0; }
  main:has(.chat.has-peer) { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .msg { max-width: 88%; }
}
@media (max-width: 560px) { .chat { --chat-gap: 76px; } }
@media (max-width: 900px) { .g2, .g3, .side, .side-l { grid-template-columns: minmax(0, 1fr); } .g2.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* телефон и планшет: боковая колонка списка (фильтры, квота, карта) раскладывается вокруг списка —
   нужное для выбора (.m-before) — над ним, справочное — под ним, чтобы список не уезжал на пару экранов вниз */
@media (max-width: 900px) {
  .side-l > aside { display: contents; }
  .side-l > aside > * { order: 2; }
  .side-l > aside > .m-before { order: 0; }
  .side-l > :not(aside) { order: 1; }
}
/* сворачиваемая панель: на широком экране всегда открыта, на телефоне — по кнопке */
.btn.fold-btn, .fold-n { display: none; }
@media (max-width: 900px) {
  .btn.fold-btn { display: inline-flex; }
  .chip.lot-tag { display: none; }
  .fold-n { display: inline; }
  .fold:not(.open) .fold-b { display: none; }
}
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.sb { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }

.panel { background: var(--paper); border: 1px solid transparent; border-radius: var(--r); padding: 22px; min-width: 0; }  /* рамка прозрачная: край — край заливки, как у героя, квеста и плашек; в forced-colors рамку рисует система */
.panel.tight { padding: 16px; }
.panel.frame { position: relative; }
.panel h2 + *, .panel h3 + * { margin-top: 12px; }
.divider { height: 1px; background: var(--line-2); margin: 4px 0; }

/* ---------- кнопки и поля ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-weight: 500; font-size: 14px; text-decoration: none; transition: background .15s, border-color .15s, color .15s; }
.btn.primary { background: var(--blue); color: var(--on-accent); }
@media (hover: hover) { .btn.primary:hover { background: var(--blue-hover); } }
.btn.ghost { background: var(--paper); border-color: var(--line); color: var(--ink); }
@media (hover: hover) { .btn.ghost:hover { border-color: var(--blue); color: var(--blue-text); } }
.btn.danger { background: var(--paper); border-color: var(--line); color: var(--red); }
@media (hover: hover) { .btn.danger:hover { border-color: var(--red); } }
.btn.dark { background: var(--on-dark); color: var(--dark); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 10px 12px; font-size: 14px; }
.input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
input[type="search"].input { -webkit-appearance: none; appearance: none; }
textarea.input { resize: vertical; min-height: 110px; line-height: 1.5; font-family: var(--sans); font-size: 15px; }
.hint { font-size: 12px; color: var(--ink-3); }
.fsp-hint { margin-left: auto; }
@media (max-width: 560px) { .fsp-btn { flex-wrap: wrap; row-gap: 0; } .fsp-hint { flex: 1 1 100%; margin-left: 0; padding-left: 36px; text-align: left; } }
/* «от» / «до» внутри поля вилки: подпись видна и когда поле заполнено */
.pfx { position: relative; display: block; min-width: 0; }
.pfx::before { content: attr(data-p); position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-3); pointer-events: none; }
.pfx .input { padding-left: 40px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--blue); }

/* перегородки — фон в зазоре 1px: при переносе на узком экране строки заполняются целиком, без пустых ячеек */
.seg { display: inline-flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 100%; }
.seg button { flex: 1 1 auto; border: 0; background: var(--paper); padding: 8px 14px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"], .seg button[aria-current="true"] { background: var(--blue); color: var(--on-accent); }
@media (max-width: 560px) { .seg { display: flex; } .seg button { padding: 8px 6px; } }

.switch { display: inline-flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; font-size: 13px; border: 0; background: none; padding: 0; }
.switch i { width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] i { background: var(--blue); }
.switch[aria-checked="true"] i::after { transform: translateX(16px); }

/* ---------- чипы, бейджи ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; background: var(--paper); white-space: nowrap; }
.chip.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-ink); }
.chip.ok { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.chip.warn { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.chip.bad { border-color: transparent; background: var(--red-soft); color: var(--red); }
.chip.dim { color: var(--ink-3); border-style: dashed; }
button.chip, a.chip { cursor: pointer; }
a.chip { color: inherit; text-decoration: none; }
a.chip.on { color: var(--blue-ink); }
@media (hover: hover) { button.chip:hover, a.chip:hover { border-color: var(--blue); } }
.chip .x { opacity: .6; }
.chip { max-width: 100%; }
@media (max-width: 400px) { .chip { white-space: normal; } }  /* длинная плашка («почта на домене не подтверждена») переносится, а не вылезает за край */
.subnav { margin-bottom: 16px; }
/* телефон и планшет: разделы кабинета — одна строка с прокруткой во всю ширину экрана, активный раздел виден */
@media (max-width: 900px) {
  .subnav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
    margin-left: calc(-1 * max(var(--gut), env(safe-area-inset-left))); margin-right: calc(-1 * max(var(--gut), env(safe-area-inset-right)));
    padding: 4px max(var(--gut), env(safe-area-inset-right)) 4px max(var(--gut), env(safe-area-inset-left));  /* 4px — не режет рамку фокуса */
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--gut), #000 calc(100% - var(--gut)), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 var(--gut), #000 calc(100% - var(--gut)), transparent 100%); }
  .subnav::-webkit-scrollbar { display: none; }
  .subnav .chip { flex: none; }
}

.cat { display: inline-flex; align-items: center; gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--blue); font-weight: 600; font-size: 13px; }
.cat span { padding: 5px 10px; color: var(--blue-text); }
.cat span + span { border-left: 1px solid var(--blue-line); }
.cat span:last-child { background: var(--blue); color: var(--on-accent); }

.trust { display: flex; flex-direction: column; gap: 0; }
.trust > div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--line-2); font-size: 13px; }
.trust > div:first-child { border-top: 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.dot.on { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 2px var(--paper); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-sent { background: var(--mist); color: var(--ink-2); }
.s-seen { background: var(--blue-soft); color: var(--blue-ink); }
.s-ok { background: var(--ok-soft); color: var(--ok); }
.s-no { background: var(--red-soft); color: var(--red); }
.s-exp { background: var(--mist); color: var(--ink-3); }

.alert { border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.alert b { font-weight: 600; }
.alert.warn { background: var(--warn-soft); color: var(--alert-warn); }
.alert.bad { background: var(--red-soft); color: var(--alert-bad); }
.alert.ok { background: var(--ok-soft); color: var(--alert-ok); }
.alert.info { background: var(--blue-soft); color: var(--blue-ink); }

/* ---------- полосы компетенций (θ ± SE) ---------- */
.comp { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 13px; }
.comp + .comp { margin-top: 10px; }
.scale { position: relative; height: 22px; }
.scale .track { position: absolute; inset: 10px 0; height: 2px; background: var(--line-2); }
.scale .tick { position: absolute; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.scale .se { position: absolute; top: 7px; height: 8px; background: var(--blue-line); border-radius: 4px; }
.scale .th { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--blue); border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--blue); }
.scale-legend { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 56px; gap: 12px; font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.scale-legend .lg { position: relative; height: 14px; }
.scale-legend .lg span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
@media (max-width: 560px) {
  .comp, .scale-legend { grid-template-columns: minmax(0, 1fr) 48px; }
  .comp > :first-child { grid-column: 1 / -1; }
  .scale-legend > :first-child { display: none; }
}

.meter { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }

/* ---------- герой ---------- */
.hero { background: var(--dark); color: var(--on-dark); border-radius: 22px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr); position: relative; }
.hero-txt { padding: clamp(24px, 5vw, 56px); display: flex; flex-direction: column; gap: 22px; position: relative; z-index: 1; }
.hero h1 { color: #fff; font-size: clamp(30px, 4.4vw, 52px); }
.hero h1 em { font-style: normal; color: var(--on-dark-accent); }
.hero .lead { font-family: var(--sans); font-size: 17px; color: var(--on-dark-2); max-width: 46ch; }
.hero-img { position: relative; min-height: 320px; background: #16171B; }
.hero-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
.hero-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--dark) 0%, transparent 40%); }
.hero .eyebrow { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--on-dark-2); text-transform: uppercase; letter-spacing: .1em; }
.hero .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px rgba(64,47,255,.25); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } .hero-img { min-height: 220px; order: -1; } .hero-img::after { background: linear-gradient(0deg, var(--dark) 0%, transparent 55%); } }

.trace { position: absolute; pointer-events: none; color: var(--blue); }
.trace path { fill: none; stroke: currentColor; stroke-width: 1.2; }
.trace circle { fill: currentColor; }
@media (max-width: 1000px) { .trace { display: none; } }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid transparent; border-radius: var(--r); background: var(--paper); overflow: hidden; }
.steps > div { padding: 22px; border-right: 1px solid var(--blue-line); display: flex; flex-direction: column; gap: 8px; }
.steps > div:last-child { border-right: 0; }
.steps .n { font-size: 12px; color: var(--blue-text); font-weight: 600; }
@media (max-width: 820px) { .steps { grid-template-columns: 1fr; } .steps > div { border-right: 0; border-bottom: 1px solid var(--blue-line); } .steps > div:last-child { border-bottom: 0; } }

/* ---------- квест ---------- */
.quest { background: var(--dark); color: var(--on-dark); border-radius: 22px; overflow: hidden; overflow: clip; }  /* clip, а не hidden: внутри работает sticky */
.quest-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 22px; border-bottom: 1px solid var(--dark-line); font-size: 13px; }
.quest-top .pr { display: flex; gap: 4px; flex: 0 1 auto; min-width: 0; }
.quest-top .pr i { flex: 0 1 22px; min-width: 3px; height: 4px; border-radius: 2px; background: var(--dark-line); }
.quest-top .pr i.on { background: var(--blue); }
.quest-top .pr i.cur { background: var(--on-dark); }
.timer { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; gap: 8px; align-items: center; }
.timer.low { color: #FF6B7D; }
.quest .switch { color: var(--on-dark-2); }
.quest .seg { border-color: var(--dark-line); background: var(--dark-line); align-self: flex-start; } .quest .seg button { background: var(--dark-2); color: var(--on-dark); } .quest .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
@media (max-width: 560px) { .quest .seg { align-self: stretch; } }
.quest .switch i { background: var(--dark-line); }
.quest-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.quest-body > div { padding: 26px; min-width: 0; }
.quest-body > div + div { border-left: 1px solid var(--dark-line); }
@media (max-width: 900px) { .quest-body { grid-template-columns: 1fr; } .quest-body > div + div { border-left: 0; border-top: 1px solid var(--dark-line); } }
.story { border-left: 2px solid var(--blue); padding-left: 14px; font-family: var(--sans); font-size: 15px; color: var(--on-dark); line-height: 1.6; }
.story .t { font-family: var(--mono); font-size: 12px; color: var(--on-dark-accent); display: block; margin-bottom: 4px; }
.quest .q { font-size: 17px; font-weight: 600; color: #fff; }
.term { background: #0F1013; border: 1px solid var(--dark-line); border-radius: 10px; padding: 14px; font-size: 12px; line-height: 1.7; overflow-x: auto; white-space: pre; color: #C9CAD3; }
.term .e { color: #FF7A8A; }
.term .w { color: #F5C46B; }
.term .i { color: #8EA2FF; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--dark-line); background: var(--dark-2); color: var(--on-dark); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14px; font-family: var(--sans); }
@media (hover: hover) { .opt:hover { border-color: var(--on-dark-accent); } }
.opt .k { font-family: var(--mono); color: var(--on-dark-2); font-size: 12px; padding-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--blue); background: rgba(64,47,255,.18); }
.opt[aria-pressed="true"] .k { color: #fff; }
.code, .term { font-variant-ligatures: none; }
.code { background: #0F1013; border: 1px solid var(--dark-line); border-radius: 10px; overflow-x: auto; font-size: 12.5px; }
.code button { display: grid; grid-template-columns: 34px 1fr; width: 100%; min-width: max-content; text-align: left; border: 0; background: none; color: #C9CAD3; padding: 1px 12px 1px 0; cursor: pointer; white-space: pre; font-family: var(--mono); line-height: 1.75; }
.code button .ln { color: #5D5E69; text-align: right; padding-right: 12px; user-select: none; }
@media (hover: hover) { .code button:hover { background: #1A1B21; } }
.code button[aria-pressed="true"] { background: rgba(236,29,53,.18); box-shadow: inset 3px 0 0 var(--red); }
.pre { white-space: pre-line; }
.code button[disabled] { cursor: default; } @media (hover: hover) { .code button[disabled]:hover { background: none; } }
.code .kw { color: #A99BFF; } .code .st { color: #9FD8A8; } .code .cm { color: #6C6D78; }
.quest-foot { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 22px; border-top: 1px solid var(--dark-line); font-size: 12px; color: var(--on-dark-2); }
.quest .chart text { fill: var(--on-dark-2); font-size: 10px; font-family: var(--mono); }
.quest .chart.nar text { font-size: 12px; }
.code-ed { width: 100%; min-height: 320px; resize: vertical; background: #0F1013; color: #E6E6EE; border: 1px solid var(--dark-line); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 13px; line-height: 1.6; tab-size: 4; white-space: pre; overflow: auto; font-variant-ligatures: none; }
.code-ed:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
.code-tools { display: none; }
/* телефон: шапка задания (таймер, прогресс) прилипает под шапкой сайта, кнопка «Дальше» — к низу экрана;
   логи и код переносятся по строкам вместо прокрутки вбок */
@media (max-width: 640px) {
  .quest { border-radius: 16px; }
  .quest-top { position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 5; background: var(--dark);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 10px 16px; }
  .quest-top .qt-title { grid-column: 1; grid-row: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quest-top .timer { grid-column: 2; grid-row: 1; margin: 0; }
  .quest-top .pr { grid-column: 1 / -1; grid-row: 2; }
  .quest-top .qt-comp { grid-column: 1; grid-row: 3; min-width: 0; font-size: 12px; }
  .quest-top .switch { grid-column: 2; grid-row: 3; }
  .quest-body > div { padding: 18px 16px; }
  .quest .q { font-size: 16px; }
  .quest-foot { position: sticky; bottom: 0; z-index: 5; background: var(--dark); flex-wrap: nowrap; gap: 12px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); font-size: 11px; line-height: 1.4; box-shadow: 0 -10px 18px rgba(0,0,0,.35); }
  .quest-foot:has(> #tmo:not([hidden])) { flex-wrap: wrap; }  /* плашка таймера — отдельной строкой над подсказкой и «Дальше» */
  .quest-foot .row { flex: none; }
  /* у задачи на код подсказка длинная, а отправка — осознанный последний шаг: низ не прилипает */
  .quest-foot.qf-code { position: static; flex-wrap: wrap; box-shadow: none; }
  .quest-foot.qf-code .row { flex: 1 1 100%; }
  .quest-foot .btn.small { min-height: 44px; padding: 10px 18px; font-size: 14px; }
  .term { white-space: pre-wrap; overflow-wrap: anywhere; }
  .code button { white-space: pre-wrap; min-width: 0; }
  .code button > span:last-child { overflow-wrap: anywhere; }
  .code-ed { min-height: 260px; }
}
@media (pointer: coarse) { .code-tools { display: flex; } .code-keys { display: none; } }
@media (max-height: 480px) and (orientation: landscape) { .quest-top, .quest-foot { position: static; box-shadow: none; } }

/* ---------- карточки кандидатов / приглашений ---------- */
.cand { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 20px; padding: 18px 20px; background: var(--paper); border: 1px solid transparent; border-radius: var(--r); cursor: pointer; transition: background .15s; text-align: left; width: 100%; }
@media (hover: hover) { button.cand:hover { background: var(--mist); } }
.panel .cand { background: var(--ground); }  /* карточка внутри панели (лотерея): без рамки её выделяет подложка */
.cand .id { font-weight: 600; font-size: 15px; }
.cand .score { text-align: right; }
.cand .score b { font-size: 22px; font-weight: 600; color: var(--blue-text); display: block; line-height: 1; }
.cand .facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; font-size: 12px; border-top: 1px dashed var(--line-2); padding-top: 12px; }
.cand .facts b { display: block; font-size: 13px; font-weight: 500; color: var(--ink); }
@media (max-width: 700px) { .cand .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.inv { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; background: var(--paper); border: 1px solid transparent; border-radius: var(--r); cursor: pointer; transition: background .15s; text-align: left; width: 100%; }
@media (hover: hover) { button.inv:hover { background: var(--mist); } }
.logo-sq { box-shadow: inset 0 0 0 1px var(--logo-ring); width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; }
.inv-st { align-items: flex-end; }
.money { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 560px) {
  .inv { grid-template-columns: 44px minmax(0, 1fr); align-items: start; }
  .inv > :last-child { grid-column: 2; }
  .inv-st { flex-direction: row; flex-wrap: wrap; align-items: center; }
}
/* шапка приглашения, вакансии, задачи: логотип и компания рядом, плашки проверки — справа, на телефоне — строкой ниже */
.co-head > div, .co-head > b { flex: 1 1 160px; min-width: 0; }
.co-chips { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 560px) { .co-chips { margin-left: 0; flex-basis: 100%; } }

.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 16px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; gap: 2px 12px; } .kv dd { margin-bottom: 8px; } }

/* таблица шире экрана прокручивается внутри обёртки; тени по краям показывают, что за краем есть столбцы */
.tbl-wrap { overflow-x: auto; overscroll-behavior-x: contain;
  background: linear-gradient(90deg, var(--paper) 30%, rgba(255,255,255,0)) left / 28px 100% no-repeat local,
    linear-gradient(270deg, var(--paper) 30%, rgba(255,255,255,0)) right / 28px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, color-mix(in srgb, var(--ink) 18%, transparent), transparent) left / 12px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, color-mix(in srgb, var(--ink) 18%, transparent), transparent) right / 12px 100% no-repeat scroll; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl td { padding: 12px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.num { white-space: nowrap; }
@media (max-width: 640px) {
  .tbl { font-size: 12px; }
  .tbl th { padding: 8px 6px; letter-spacing: .03em; white-space: normal; vertical-align: bottom; }
  .tbl td { padding: 9px 6px; }
  .tbl th:first-child, .tbl td:first-child { padding-left: 0; }
  table.tbl.heat td.c { padding: 8px 3px; }
  .tbl.heat caption { position: sticky; left: 0; }
}


.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(130px, 200px) minmax(0, 1fr) 52px; gap: 12px; align-items: center; font-size: 13px; }
.bar .b { height: 18px; background: var(--mist); border-radius: 4px; overflow: hidden; }
.bar .b i { display: block; height: 100%; background: var(--blue); }
.bar .b i.alt { background: var(--bar-alt); }
/* матрица «истинный грейд × грейд теста»: насыщенность фона — доля строки (текст — --ink, контраст ≥ 4,5:1 в обеих темах), диагональ — рамкой */
.tbl.heat caption { caption-side: top; text-align: left; font-size: 12px; color: var(--ink-3); padding-bottom: 6px; }
.tbl.heat td.c { text-align: center; font-variant-numeric: tabular-nums; padding: 10px 6px; }
.tbl.heat td.c.diag { outline: 2px solid var(--blue-ink); outline-offset: -2px; font-weight: 600; }
.bar .b i.red { background: var(--red); }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
@media (max-width: 560px) { .bar { grid-template-columns: minmax(0, 1fr) 48px; } .bar > :first-child { grid-column: 1 / -1; } }

.stat { display: flex; flex-direction: column; gap: 4px; }
.stat b { font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 12px; color: var(--ok); }

.demo-tag { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 6px; }

/* ---------- тост ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-fg); padding: 12px 18px; border-radius: 10px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
@media (max-width: 640px) { body:has(.quest-foot:not(.qf-code)) .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); } }  /* над прилипшей «Дальше» */

.drop { border: 1.5px dashed var(--blue-line); border-radius: var(--r); padding: 22px; display: flex; gap: 16px; align-items: center; background: var(--blue-soft); }
.file-ico { width: 40px; height: 48px; border-radius: 6px; background: var(--paper); border: 1px solid var(--blue-line); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--red); flex: none; }

.parsed { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
@media (max-width: 600px) { .parsed { grid-template-columns: 1fr; gap: 4px; } .parsed > .label { margin-top: 8px; } }

/* ---------- телефон и планшет ---------- */
@media (max-width: 640px) {
  /* широкие таблицы (воронка, история тестов): строка — карточка «подпись — значение» */
  .tbl.stack thead { display: none; }
  .tbl.stack tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
  .tbl.stack tr:last-child { border-bottom: 0; }
  .tbl.stack td { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; padding: 4px 0; border: 0; text-align: right; }
  .tbl.stack td:not([data-l]) { justify-content: flex-start; flex-wrap: wrap; text-align: left; }
  .tbl.stack td[data-l]::before { content: attr(data-l); flex: none; max-width: 45%; text-align: left; color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .tbl.stack td .chips { justify-content: flex-end; }
  .tbl.stack td[data-l]:empty { display: none; }
  /* категория «спец · трек · грейд» в узкой колонке карточки не обрезается, а переносится; перенесённая часть — во всю ширину */
  .cat { flex-wrap: wrap; max-width: 100%; }
  .cat span { padding: 5px 8px; flex: 1 0 auto; text-align: center; }
  .scale-legend .lg span { font-size: 0; }
  .scale-legend .lg span::before { content: attr(data-s); font-size: 10px; }
}
@media (max-width: 560px) {
  .panel { padding: 16px; }
  .panel.tight { padding: 14px; }
  /* кнопки в строке действий заполняют её: крупная цель для пальца, без рваного края; поля рядом с кнопками — тоже */
  .row:not(.sb) > .btn { flex: 1 1 auto; }
  .chat-box .row > .btn { flex: none; }
  .row > .input { flex: 1 1 140px; max-width: none !important; }
  .stack > .input, .stack-s > .input { max-width: none !important; }
  .row > .seg { flex: 1 1 auto; }
  .kv dd { overflow-wrap: anywhere; }
  /* карточка без числовой оценки справа (статус, «другая специализация») — в одну колонку: заголовок не сжимается */
  .cand { padding: 16px; }
  .cand:not(:has(.score > b)) { grid-template-columns: minmax(0, 1fr); }
  .cand:not(:has(.score > b)) .score { text-align: left; }
  .drop { flex-wrap: wrap; padding: 16px; }
  .drop > div:not(.file-ico) { flex: 1 1 180px; }
  .drop > .btn { flex: 1 1 100%; }
}
@media (max-width: 900px) { .chat-box.chat-empty { height: auto; min-height: 0; } }
@media (pointer: coarse) {
  /* сенсорный экран: зона нажатия не меньше 36 px */
  .crumbs a { padding: 10px 0; margin: -10px 0; }
  button.chip, a.chip, .btn.small, .seg button, .switch { min-height: 36px; }
  .check input { width: 20px; height: 20px; margin-top: 0; flex: none; }
  /* поле меньше 16 px — iOS увеличивает страницу при фокусе */
  .input, select.input, textarea.input, .code-ed { font-size: 16px; }
  button, a, .opt, .cand, .inv { touch-action: manipulation; }
}
/* отклик на нажатие: системная подсветка касания выключена, наведение — только с мышью */
.btn:active, button.chip:active, a.chip:active, .seg button:active, button.cand:active, button.inv:active, .opt:active, .chat-peer:active { opacity: .72; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.fade { animation: fade .25s ease-out; }
.still .fade { animation: none; }  /* перерисовка того же экрана (rerender): без анимации появления */
@keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/" data-go="/">
      <img src="/assets/logo.svg" alt="ФСП">
      <div class="prod">ФСП Карьера<span id="cab">обратный найм в ИТ</span></div>
    </a>
    <button class="topbtn" id="theme" data-act="theme"></button>
    <button class="topbtn" id="logout" data-act="logout" hidden>Выйти</button>
  </div>
</header>

<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== данные: API бэкенда ===================== */
// суммы — с неразрывными пробелами: на узком экране «230 000 ₽» не рвётся посередине
const RUB = n => n == null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/[,  ]/g, '\u00a0') + '\u00a0₽';
const K = n => n == null ? '—' : Math.round(n / 1000) + '\u00a0тыс.';
const DEC = (v, d = 2) => v == null ? '—' : Number(v).toFixed(d).replace('.', ',');
const PCT1 = v => v == null ? '—' : (v * 100).toFixed(1).replace('.', ',') + ' %';
const PCT = v => v == null ? '—' : Math.round(v <= 1 ? v * 100 : v) + ' %';
const DATE = s => s ? new Date(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).replace(/\s*г\.$/, '') : '—';
const DAYMON = s => s ? new Date(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '—';

let META = null;   // /api/meta: справочники
let CAP = 4;       // лимит открытых приглашений у кандидата (из META)
let ME = null;     // /api/candidate/me
let ME_ERR = false;  // /me не загрузился (сеть, 5xx): экраны кандидата — ошибка с повтором, а не «профиль не создан»
let ACH = null;    // /api/achievements
let GRADE_TH = [{ g: 'Junior', t: -0.5 }, { g: 'Middle', t: 0.5 }, { g: 'Senior', t: 1.5 }, { g: 'Lead', t: 2.3 }];
const D = {};      // данные текущего экрана
let UNREAD = 0;    // непрочитанные сообщения чата (бейдж в разделах)
const loadPen = l => l >= CAP ? .3 : 1 - .15 * l;
const NEED_TEXT = 'Ищем бэкендера на Python в команду платежей. Нужен опыт с PostgreSQL и Kafka, хорошо бы Kubernetes. Уровень — мидл, до 300 на руки. Гибрид, Москва.';

const S = {
  story: true,
  quest: null, qAns: null, codeMark: null, qComment: '', qItem: null, qShownAt: 0, finish: null,
  qLang: 'python', qCode: {}, qRun: null, qPasted: 0, edEsc: false,   // задача на код: язык, черновики по языкам, запуск на примерах, вставлено символов
  signup: { email: '', otp: '', sent: false, c152: false, publish: false },
  esignup: { email: '', otp: '', sent: false },
  confirm: null,                     // ключ открытого инлайн-подтверждения (удаление аккаунта, отзыв согласий)
  target: null,                      // грейд, на который проходится тест
  questInvite: null,                 // тест по приглашению: invitation_id
  vf: { spec: '', grade: '', format: '', city: '', q: '' },   // фильтры вакансий кандидата
  sf: { spec: '', track: '', grade: '', skills: '', q: '', fsp: false, cf: false, hackathon: false, format: '', city: '', page: 1 },
  vform: null, tform: null, applyNote: '', answer: '', picks: [], hiddenEdit: false, needAdd: null, needCat: null, plan: null,
  appDecline: null, reviewFor: null,
  pf: null, cv: null,
  declineFor: null, declineReason: null,
  need: { text: '', parsed: null },
  needId: null, needObj: null, needs: [],
  filters: new Set(),
  lot: null,
  inviteForm: null,
  fold: {},                          // открытые на телефоне сворачиваемые панели: фильтры, лотерея
};

/* ===================== API ===================== */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* приватный режим */ } },
};
const TOK = { c: LS.get('fsp.tok.c'), e: LS.get('fsp.tok.e'), org: null };  // org — токен организатора, только в памяти
const setTok = (role, t) => { TOK[role] = t; LS.set('fsp.tok.' + role, t); };

/* ===================== маршруты: адрес ↔ экран ===================== */
// экраны внутри — по ключам ('/c/home', '/e/cand/A-1042'), в адресной строке — настоящие пути кабинетов (History API).
// Одна таблица в обе стороны; «*» — один сегмент адреса (id, собеседник чата). Сервер отдаёт страницу на /candidate…, /employer…, /v и /org.
const ROUTES = [
  ['/', '/'], ['/v', '/v'], ['/org', '/org'],
  ['/c/home', '/candidate'], ['/c/login', '/candidate/login'], ['/c/signup', '/candidate/signup'], ['/c/profile', '/candidate/profile'],
  ['/c/quest', '/candidate/test'], ['/c/quest/go', '/candidate/test/run'], ['/c/result', '/candidate/test/result'],
  ['/c/invite/*', '/candidate/invites/*'], ['/c/vacancies', '/candidate/vacancies'], ['/c/vacancy/*', '/candidate/vacancies/*'],
  ['/c/applications', '/candidate/applications'], ['/c/tasks', '/candidate/tasks'], ['/c/task/*', '/candidate/tasks/*'],
  ['/c/task/*/*', '/candidate/tasks/*/*'],  // задание из приглашения: /candidate/tasks/<задание>/<приглашение>
  ['/c/chat', '/candidate/chat'], ['/c/chat/*', '/candidate/chat/*'], ['/c/settings', '/candidate/settings'],
  ['/e/picks', '/employer'], ['/e/login', '/employer/login'], ['/e/signup', '/employer/signup'], ['/e/company', '/employer/company'],
  ['/e/need', '/employer/needs/new'], ['/e/search', '/employer/search'],
  ['/e/cand/*', '/employer/candidates/*'], ['/e/invite/*', '/employer/candidates/*/invite'], ['/e/pipeline', '/employer/invites'],
  ['/e/vacancies', '/employer/vacancies'], ['/e/vacancy/*', '/employer/vacancies/*'], ['/e/tasks', '/employer/tasks'], ['/e/task/*', '/employer/tasks/*'],
  ['/e/chat', '/employer/chat'], ['/e/chat/*', '/employer/chat/*'],
];
// шаблон from → to по сегментам: одинаковое число сегментов, «*» — любой непустой сегмент
function conv(from, to, s) {
  const a = from.split('/'), b = s.split('/'), xs = [];
  if (a.length !== b.length) return null;
  for (let i = 0; i < a.length; i++) if (a[i] === '*') { if (!b[i]) return null; xs.push(b[i]); } else if (a[i] !== b[i]) return null;
  return to.replace(/\*/g, () => xs.shift());
}
const keyOf = p => { for (const [k, u] of ROUTES) { const r = conv(u, k, p); if (r) return r; } return null; };
// ключ может нести параметры: '/e/cand/A-1042?need=5' → '/employer/candidates/A-1042?need=5'
const pathOf = k => { const [p, q] = k.split('?'); for (const [k0, u] of ROUTES) { const r = conv(k0, u, p); if (r) return r + (q ? '?' + q : ''); } return '/'; };
const routeQ = k => new URLSearchParams(location.search).get(k);  // параметр адреса: /employer/candidates/A-1042?need=5
// ключ экрана по адресу; неизвестный путь внутри кабинета — экран «Не найдено» этого кабинета
const route = () => {
  const p = location.pathname.replace(/\/+$/, '') || '/';
  return keyOf(p) || (/^\/employer\//.test(p) ? '/e/404' : /^\/candidate\//.test(p) ? '/c/404' : '/');
};
// кабинет экрана явно: c | e, вне кабинетов (главная, /v, /org) — ''
const roleOf = k => k.startsWith('/c/') ? 'c' : k.startsWith('/e/') ? 'e' : '';
// экраны кабинета, открытые без входа: вход, регистрация, «Не найдено»
const OPEN = k => /^\/[ce]\/(login|signup|404)$/.test(k);
// переход: адрес — в историю, экран — после текущего обработчика (как прежде по hashchange); тот же адрес — ничего
function nav(p, replace) {
  if (location.pathname + location.search === p) return;
  history[replace ? 'replaceState' : 'pushState'](null, '', p);
  setTimeout(show);
}
const go = (k, replace, q) => nav(pathOf(k) + (q ? '?' + q : ''), replace);
// вход с возвратом: ?next= — адрес экрана, с которого увели на вход (только свой кабинет, не вход и не чужой сайт)
const nextOk = (n, side) => { if (typeof n !== 'string' || !/^\/[^/\\]/.test(n)) return null; const k = keyOf(n.split(/[?#]/)[0]); return k && roleOf(k) === side && !OPEN(k) ? n : null; };
const nextPath = side => nextOk(new URLSearchParams(location.search).get('next'), side);
const toLogin = (side, replace) => go(`/${side}/login`, replace, route() === '/' || OPEN(route()) ? '' : 'next=' + encodeURIComponent(location.pathname + location.search));

async function api(method, path, body, role = roleOf(route())) {
  const headers = {};
  if (TOK[role]) headers.Authorization = 'Bearer ' + TOK[role];
  if (body !== undefined && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  let r;
  try { r = await fetch(path, { method, headers, body }); } catch { throw Object.assign(new Error('Сервер недоступен'), { status: 0 }); }
  const data = await r.json().catch(() => null);
  if (r.ok) return data;
  const det = data && data.detail;
  const msg = typeof det === 'string' ? det : Array.isArray(det) ? det.map(x => x.msg).join('; ') : det && det.errors ? det.errors.join(' ') : `Ошибка ${r.status}`;
  const err = Object.assign(new Error(msg), { status: r.status, detail: det });
  if (r.status === 401 && (role === 'c' || role === 'e') && !path.startsWith('/api/auth/')) {  // org — без выхода из кабинетов
    clearSide(role);
    if (route() !== `/${role}/login`) toLogin(role);
  }
  throw err;
}
function fail(e) { toast(e && e.message ? e.message : 'Ошибка'); }

// сброс токена и данных одной роли: выход, 401, смена пользователя
function clearSide(role) {
  setTok(role, null);
  // согласия 152-ФЗ с экрана регистрации — только того, кто входит сейчас: следующий человек во вкладке ставит их сам
  if (role === 'c') { ME = null; ME_ERR = false; ACH = null; Object.assign(S.signup, { c152: false, publish: false }); Object.assign(S, { quest: null, finish: null, pf: null, cv: null, confirm: null, questInvite: null, target: null, cfCode: null, applyNote: '', answer: '' }); }
  else { delete D.co; delete D.coName; delete D.company; Object.assign(S, { needId: null, needObj: null, needs: [], lot: null, inviteForm: null, vform: null, tform: null, plan: null, need: { text: '', parsed: null }, appDecline: null }); S.filters.clear(); }
}
// вход по коду; учётка другой роли — отказ с плашкой «войдите как …» на экране входа (S.roleErr)
async function verifyLogin(role, email, otp) {
  const r = await api('POST', '/api/auth/verify', { email, otp }, role);
  const want = role === 'e' ? 'employer' : 'candidate';
  if (r.role !== want) {  // почта уже подставлена во вход другой роли
    S.roleErr = role; (role === 'c' ? S.esignup : S.signup).email = email; rerender();
    throw new Error(want === 'employer' ? 'Эта почта зарегистрирована как кандидат' : 'Эта почта зарегистрирована как работодатель');
  }
  const { c152, publish } = S.signup;  // согласия, отмеченные на регистрации этим же человеком, переживают вход
  clearSide(role);
  Object.assign(S.signup, { c152, publish });
  setTok(role, r.token);
  return r;
}
// после входа: ?next= своего кабинета, иначе — дом кабинета или первый шаг (профиль кандидата, данные компании)
function afterLogin(side, hasProfile, next) {
  if (!hasProfile) return go(side === 'e' ? '/e/company' : '/c/profile');
  if (next) return nav(next);
  go(side === 'e' ? '/e/picks' : '/c/home');
}

// ФСП ID (OIDC): сервер отдаёт адрес провайдера и ставит куку потока; браузер уходит туда целиком
// согласия, отмеченные на экране регистрации, переживают уход к провайдеру (страница перезагрузится)
// role — c | e (сторона входа), idp — alias стороннего провайдера через брокер Keycloak (kc_idp_hint)
async function fspStart(mode, role = 'c', idp = '') {
  const side = mode === 'link' ? 'c' : role;
  const r = await api('POST', '/api/auth/fsp/start', { mode, role: side === 'e' ? 'employer' : 'candidate', ...(idp ? { idp } : {}) }, side);
  try { sessionStorage.setItem('fsp.signup', JSON.stringify({ side, mode, next: nextPath(side), c152: S.signup.c152, publish: S.signup.publish })); } catch { /* приватный режим */ }
  location.assign(r.url);
}
// кнопки входа через Keycloak: кандидату — «ФСП ID» (подтянем достижения), компании — SSO; плюс сторонние провайдеры брокера (META.fsp_idps)
const fspButtons = side => {
  const mark = '<img src="/assets/mark.png" alt="" style="width:28px;height:28px;border-radius:6px">';
  const main = side === 'e'
    ? `<button class="btn ghost block" data-act="fsp-login" data-side="e" style="justify-content:flex-start;padding:14px 16px">${mark} Войти через SSO (Keycloak)</button>`
    : `<button class="btn ghost block fsp-btn" data-act="fsp-login" data-side="c" style="justify-content:flex-start;padding:14px 16px">${mark} Войти через ФСП ID <span class="muted small fsp-hint">подтянем достижения</span></button>`;
  return main + ((META && META.fsp_idps) || []).map(i => `<button class="btn ghost block" data-act="fsp-login" data-side="${side}" data-idp="${esc(i.alias)}" style="justify-content:flex-start">Войти через ${esc(i.label)}</button>`).join('');
};
const FSP_ERR = {
  state: 'Вход через ФСП ID устарел или открыт в другом браузере — начните заново',
  denied: 'Вход через ФСП ID отменён',
  provider: 'ФСП ID недоступен или отклонил запрос — попробуйте позже',
  token: 'ФСП ID прислал неподтверждённые данные — вход отклонён',
  email: 'В ФСП ID не подтверждена почта — подтвердите её или войдите по коду',
  role: 'Этот аккаунт уже зарегистрирован с другой ролью (кандидат или работодатель) — войдите по коду',
  taken: 'Этот ФСП ID уже привязан к другому аккаунту',
  other: 'К аккаунту уже привязан другой ФСП ID — сначала отвяжите его в настройках',
  link: 'Аккаунт с этой почтой уже есть — войдите по коду и привяжите ФСП ID в настройках',
};
// у компании это SSO и привязки в настройках нет — тексты без «ФСП ID» и без отсылки к настройкам
const FSP_ERR_E = {
  state: 'Вход через SSO устарел или открыт в другом браузере — начните заново',
  denied: 'Вход через SSO отменён',
  provider: 'SSO недоступен или отклонил запрос — попробуйте позже',
  token: 'SSO прислал неподтверждённые данные — вход отклонён',
  email: 'В SSO не подтверждена почта — подтвердите её или войдите по коду',
  taken: 'Этот аккаунт SSO уже привязан к другой почте',
  other: 'К этой почте уже привязан другой аккаунт SSO — войдите по коду',
  link: 'Аккаунт с этой почтой уже есть — войдите по коду',
};
const fspErr = (code, side) => {
  const t = side === 'e' && Object.hasOwn(FSP_ERR_E, code) ? FSP_ERR_E : FSP_ERR;
  return Object.hasOwn(t, code) ? t[code] : side === 'e' ? 'Не удалось войти через SSO' : 'Не удалось войти через ФСП ID';
};
const fspAch = a => a === 'consent' ? 'Достижения ФСП подтянем после согласия на внешние данные — в настройках' : +a ? `Подтверждено достижений ФСП: ${a}` : 'Новых достижений в ФСП ID нет';
// возврат из ФСП ID: билет или код ошибки — во фрагменте (не уходит на сервер и в Referer), сразу стираем его из адреса.
// Сервер возвращает на вход своей роли (/candidate/login, /employer/login), привязку — в /candidate/settings, неизвестный
// поток — на «/»: там сторона — подсказка из sessionStorage (только для адреса и текста ошибки; сторону входа определяет r.role)
async function fspReturn() {
  if (!location.hash.startsWith('#fsp=')) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const kind = p.get('fsp');  // login | linked | error
  let form = {};
  try { form = JSON.parse(sessionStorage.getItem('fsp.signup')) || {}; sessionStorage.removeItem('fsp.signup'); } catch { /* приватный режим */ }
  let side = roleOf(route()) || (form.side === 'e' ? 'e' : 'c');
  const link = route() === '/c/settings' || form.mode === 'link';
  history.replaceState(null, '', pathOf(kind === 'linked' || (kind === 'error' && link) ? '/c/settings' : `/${side}/login`));
  if (kind === 'error') {
    if (p.get('e') === 'role') S.roleErr = side;  // учётка другой роли: на экране входа — ссылка на вход другой роли
    return toast(fspErr(p.get('e'), side));
  }
  if (kind === 'linked') return toast('ФСП ID привязан. ' + fspAch(p.get('ach')));
  const r = await api('POST', '/api/auth/fsp/exchange', { ticket: p.get('t') || '' }, side);
  side = r.role === 'employer' ? 'e' : 'c';  // роль выдал сервер: ей же принадлежит токен
  clearSide(side);
  setTok(side, r.token);
  const { c152, publish, tg } = form;
  Object.assign(S.signup, { c152: !!c152, publish: !!publish, tg: tg !== false });  // согласия с экрана регистрации пережили уход к провайдеру
  const next = r.has_profile && nextOk(form.next, side);
  history.replaceState(null, '', next || pathOf(side === 'e' ? (r.has_profile ? '/e/picks' : '/e/company') : r.has_profile ? '/c/home' : '/c/profile'));
  if (side === 'e') return toast(r.has_profile ? 'Вход через SSO' : 'Вход через SSO: укажите данные компании');
  toast(r.has_profile ? 'Вход через ФСП ID. ' + fspAch(p.get('ach')) : 'Вход через ФСП ID: заполните профиль');
}

/* ===================== утилиты ===================== */
const $app = document.getElementById('app');
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2800);
}

const trace = (cls, w, h, d, dots) => `<svg class="trace ${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/>${dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5"/>`).join('')}</svg>`;

const catTag = (s = ME && ME.spec, t = ME && ME.track, g = ME && ME.grade) => `<span class="cat">${[s, t, g].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}</span>`;
const BADGE = { fsp: 'ФСП', hackathon: 'Хакатон', ctftime: 'CTF' };
const RESULT = { winner: 'победитель', prize: 'призёр', finalist: 'финалист', participant: 'участник отбора' };
// подсказка бейджа: название + дисциплина и результат из протокола (факты, дисциплины не ранжируются)
const badgeTitle = b => [b.title, b.discipline, RESULT[b.result]].filter(Boolean).join(' · ');
// грейд категории — только по тесту (без теста кандидат работодателю не виден); тест показал не тот грейд, что заявлен, — видны оба
const gradeNote = c => c.grade && c.grade_claimed && c.grade_claimed !== c.grade ? `<span class="chip dim">заявлен ${esc(c.grade_claimed)}, тест — ${esc(c.grade)}</span>` : '';

function compRows(list, showTh = true) {
  const pos = v => ((v + 3) / 6 * 100).toFixed(1);
  const legend = `<div class="scale-legend"><span></span><div class="lg">${GRADE_TH.map(g => `<span style="left:${pos(g.t)}%" data-s="${g.g.length > 4 ? g.g.slice(0, 3) : g.g}">${g.g}</span>`).join('')}</div><span></span></div>`;
  return (showTh ? legend : '') + list.map(c => `
    <div class="comp">
      <span>${esc(c.n)}</span>
      <div class="scale" title="θ = ${Number(c.t).toFixed(2)}, SE = ${c.se.toFixed(2)}">
        <div class="track"></div>
        ${GRADE_TH.map(g => `<div class="tick" style="left:${pos(g.t)}%"></div>`).join('')}
        <div class="se" style="left:${pos(c.t - c.se)}%; width:${(c.se * 2 / 6 * 100).toFixed(1)}%"></div>
        <div class="th" style="left:${pos(c.t)}%"></div>
      </div>
      <span class="num muted small">${c.t.toFixed(2)}</span>
    </div>`).join('');
}

function lineChart(p) {
  // panel {type:'chart', x, series:[{name, axis, max, data}], marker:{i, label}}
  // телефон: холст уже — подписи крупнее; подпись события уходит в легенду, по оси X — каждая вторая метка (последняя — всегда)
  const nar = innerWidth <= 640;
  const t = p.x, W = nar ? 360 : 520, H = nar ? 230 : 210, L = 44, R = nar ? 34 : 40, T = 16, B = 28;
  const lefts = p.series.filter(s => s.axis !== 'right'), left = lefts[0] || p.series[0];
  const LC = ['#EDEDED', '#F2B84B'];  // серии слева делят одну шкалу
  const right = p.series.find(s => s.axis === 'right');
  const x = i => L + i * (W - L - R) / Math.max(1, t.length - 1);
  const yOf = s => v => T + (H - T - B) * (1 - v / (s.max || Math.max(...s.data, 1)));
  const path = (arr, f) => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + f(v).toFixed(1)).join(' ');
  const lm = left.max || Math.max(...left.data, 1), y1 = yOf(left);
  const m = p.marker;
  return `<svg class="chart${nar ? ' nar' : ''}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(p.series.map(s => s.name).join(', '))}">
    ${[0, 1, 2, 3, 4, 5].map(k => Math.round(lm * k / 5)).map(v => `<line x1="${L}" x2="${W - R}" y1="${y1(v)}" y2="${y1(v)}" stroke="#2A2B33"/><text x="${L - 6}" y="${y1(v) + 3}" text-anchor="end">${v}</text>`).join('')}
    ${right ? [0, .5, 1].map(k => Math.round((right.max || Math.max(...right.data, 1)) * k)).map(v => `<text x="${W - R + 6}" y="${yOf(right)(v) + 3}">${v}</text>`).join('') : ''}
    ${m ? `<line x1="${x(m.i)}" x2="${x(m.i)}" y1="${T}" y2="${H - B}" stroke="#EC1D35" stroke-dasharray="3 3"/>
    ${nar ? '' : `<text x="${x(m.i) - 6}" y="${T + 10}" text-anchor="end" style="fill:#FF7A8A">${esc(m.label)}</text>`}` : ''}
    ${right ? `<path d="${path(right.data, yOf(right))}" fill="none" stroke="#8C84FF" stroke-width="1.5" stroke-dasharray="4 3"/>` : ''}
    ${lefts.map((s, k) => `<path d="${path(s.data, y1)}" fill="none" stroke="${LC[k % 2]}" stroke-width="2"/>`).join('')}
    ${t.map((s, i) => nar && t.length > 6 && (t.length - 1 - i) % 2 ? '' : `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(s)}</text>`).join('')}
  </svg>
  <div class="row small" style="color:var(--on-dark-2);margin-top:6px;gap:18px">
    ${lefts.map((s, k) => `<span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="${LC[k % 2]}" stroke-width="2"/></svg> ${esc(s.name)}${right ? ' (слева)' : ''}</span>`).join('')}
    ${right ? `<span><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="#8C84FF" stroke-width="1.5" stroke-dasharray="4 3"/></svg> ${esc(right.name)} (справа)</span>` : ''}
    ${nar && m ? `<span style="color:#FF7A8A"><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="#EC1D35" stroke-dasharray="3 3"/></svg> ${esc(m.label)}</span>` : ''}
  </div>`;
}

function logsPanel(p) {
  // panel {type:'logs', lines:[{t, src, lvl, msg}]}
  const cls = l => /err|crit|fatal/i.test(l) ? 'e' : /warn/i.test(l) ? 'w' : 'i';
  return `<div class="term">${p.lines.map(l => `<span class="${cls(l.lvl)}">${esc(l.t)} ${esc((l.src || '').padEnd(13))} ${esc((l.lvl || '').padEnd(5))}</span> ${esc(l.msg)}`).join('\n')}</div>`;
}

// простая подсветка: комментарии, строки, ключевые слова Python / SQL
const HL = /(#.*$|--\s.*$)|("[^"]*"|'[^']*')|\b(async|def|await|with|if|elif|else|return|for|while|in|try|except|finally|break|continue|import|from|class|raise|not|and|or|is|None|True|False|lambda|yield|SELECT|FROM|WHERE|UPDATE|INSERT|INTO|SET|ALTER|TABLE|ADD|COLUMN|CREATE|INDEX|BEGIN|COMMIT|ON|AND|OR|NOT|NULL|DEFAULT|JOIN|ORDER|BY|LIMIT|FOR|DROP|CONCURRENTLY|VALUES|GROUP|HAVING|DELETE)\b/g;
function hl(line) {
  let out = '', last = 0;
  line.replace(HL, (m, cm, st, kw, off) => { out += esc(line.slice(last, off)) + `<span class="${cm ? 'cm' : st ? 'st' : 'kw'}">${esc(m)}</span>`; last = off + m.length; return m; });
  return out + esc(line.slice(last));
}
function codePanel(p, clickable) {
  // panel {type:'code', lang, lines:[str], caption?}; для mark/review строки кликабельны (номер строки с 1)
  return `<div class="code" role="group" aria-label="Код">${p.lines.map((l, i) => `<button ${clickable ? `data-act="mark" data-line="${i + 1}" aria-pressed="${S.codeMark === i + 1}"` : 'disabled'}><span class="ln">${i + 1}</span><span>${hl(l)}</span></button>`).join('')}</div>
    ${p.caption ? `<p class="small" style="color:var(--on-dark-2);margin-top:10px">${esc(p.caption)}</p>` : ''}`;
}

  </div>

    <div class="panel"><span class="label">Защита от завала</span><p class="prose small" style="margin-top:8px">У кандидата не больше ${CAP} открытых приглашений. У работодателя — недельная квота, которая растёт с долей принятых.</p></div>

// форма входа по коду (почта → код) и кнопки ФСП ID / SSO — одна на вход и регистрацию роли; extra — согласия регистрации кандидата
function codeForm(side, extra = '') {
  const c = side === 'c', f = c ? S.signup : S.esignup, id = c ? 'su' : 'es', act = c ? 'otp' : 'eotp';
  return `${roleErrBox(side)}
      ${fspButtons(side)}
      <div class="row muted small"><span style="flex:1;height:1px;background:var(--line-2)"></span>или по почте<span style="flex:1;height:1px;background:var(--line-2)"></span></div>
      <label class="field"><span>${c ? 'Почта' : 'Рабочая почта'}</span><input class="input" id="${id}-mail" type="email" autocomplete="email" autocapitalize="off" enterkeyhint="send" placeholder="${c ? 'you@example.ru' : 'hr@company.ru'}" value="${esc(f.email)}"></label>
      ${extra}
      ${f.sent ? `
      <label class="field"><span>Код из письма</span><input class="input num" id="${id}-otp" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="go" maxlength="6" value="${esc(f.otp)}" style="max-width:200px"></label>
      ${f.otp ? '<span class="hint">Демо-режим: письма не отправляются, код подставлен из ответа сервера</span>' : ''}
      <div class="row"><button class="btn primary" data-act="${act}-verify">Войти</button><button class="btn ghost" data-act="${act}-send">Отправить код ещё раз</button></div>`
      : `<button class="btn primary" data-act="${act}-send">Получить код на почту</button>`}`;
}
// учётка другой роли (вход по коду или ФСП ID): отказ и ссылка на вход другой роли
const roleErrBox = side => S.roleErr === side ? `<div class="alert bad" role="alert"><span>!</span><span>${side === 'c' ? 'Эта учётная запись зарегистрирована как компания.' : 'Эта учётная запись зарегистрирована как кандидат.'} <a ${href(side === 'c' ? '/e/login' : '/c/login')}>${side === 'c' ? 'Войти как компания' : 'Войти как кандидат'}</a></span></div>` : '';
const loggedIn = side => TOK[side] ? `<div class="alert ok"><span>✓</span><span>Вы уже вошли. <a class="btn ghost small" ${href(side === 'c' ? '/c/home' : '/e/picks')}>В кабинет</a></span></div>` : '';
const candAside = () => `<div class="stack">
      <div class="panel tight stack-s">
        <span class="label">Что увидят компании</span>
        <p class="small">Анонимную карточку: <b>Кандидат A-1042</b>, категорию, перцентиль, подтверждённые навыки, бейджи ФСП и Codeforces — только если вы согласились на публикацию.</p>
      </div>
      <div class="panel tight stack-s">
        <span class="label">Чего не увидят</span>
        <p class="small">ФИО, фото, возраст, пол, вуз. Эти поля не участвуют в ранжировании.</p>
      </div>
      <p class="small muted">Нанимаете? <a ${href('/e/login')}>Вход для компаний</a></p>
    </div>`;
// согласия 152-ФЗ — раздельные: обработка (обязательно) и публикация карточки; те же галочки — в шаге «Профиль», если вошли без них
const consentChecks = p => `<label class="check"><input type="checkbox" id="${p}-152" ${S.signup.c152 ? 'checked' : ''}> Согласен на обработку персональных данных по 152-ФЗ (обязательно). Работодатели не видят ФИО и контакты, пока я не приму приглашение.</label>
      <label class="check"><input type="checkbox" id="${p}-pub" ${S.signup.publish ? 'checked' : ''}> Показывать мою обезличенную карточку работодателям. Без этого согласия компании меня не найдут; включить можно позже в настройках.</label>`;

/* ===================== кандидат ===================== */

  <div class="grid side fade">

      <h1>Вход для кандидатов</h1>
      <p class="prose">Войдите по почте или через ФСП ID. Профиля ещё нет — <a ${href('/c/signup')}>создайте его</a>: это один раз.</p>

// неизвестный адрес внутри кабинета (опечатка, устаревшая ссылка)
const notFound = side => `${crumbs([['Главная', '/'], ['Не найдено']])}<div class="panel stack fade"><h2>Страница не найдена</h2><p class="prose small">Такого адреса в ${side === 'c' ? 'кабинете кандидата' : 'кабинете компании'} нет: ссылка устарела или в ней опечатка.</p><div class="row"><a class="btn primary" ${href(side === 'c' ? '/c/home' : '/e/picks')}>В кабинет</a></div></div>`;

V['/e/404'] = () => notFound('e');

// резюме: распознанные контакты и места работы (контакты — только для формы самого кандидата)
function cvDetails(p) {
  const c = p.contacts || {};
  const who = [c.name, c.email, c.tg].filter(Boolean);
  const jobs = (p.experience || []).map(jobLine);
  return `${who.length ? `<p class="small muted">Контакты: ${esc(who.join(' · '))}</p>` : ''}${jobs.length ? `<p class="small muted">Места работы: ${jobs.join('; ')}</p>` : ''}`;
}
// роли и софт-скиллы: справочные, со слов кандидата
const softChips = (roles, soft) => (roles && roles.length) || (soft && soft.length)
  ? `<div class="chips">${[...(roles || []), ...(soft || [])].map(x => `<span class="chip">${esc(x)}</span>`).join('')}<span class="chip dim">со слов кандидата</span></div>` : '';

function pfFromMe() {
  const m = ME || {};
  return {
    name: m.name || '', tg: m.tg || '', spec: m.spec || 'Backend', track: m.track || 'Python',
    grade: m.grade_claimed || 'Middle', min: m.min || null, city: m.city || 'Москва',
    formats: m.formats && m.formats.length ? [...m.formats] : ['Гибрид', 'Удалённо'],
    skills: [...(m.skills_claimed || [])], years: m.years_exp == null ? null : m.years_exp,
    roles: [...(m.roles || [])], soft: [...(m.soft_skills || [])],
  };
}
// места работы для PDF-профиля: ровно то, что сервер положит в раздел «Опыт» (ME.experience), — кандидат проверяет и может исключить
const jobLine = j => `${j.from} — ${j.to || 'н. в.'}${j.title ? ' · ' + esc(j.title) : ''}`;
function pdfExpField() {
  const jobs = (ME && ME.experience) || [];
  if (!jobs.length) return '';
  const on = ME.pdf_experience !== false;
  return `<div class="field"><span>Опыт в PDF-профиле</span>
    <p class="small" style="${on ? '' : 'text-decoration:line-through;opacity:.6'}">${jobs.map(jobLine).join('<br>')}</p>
    <span class="hint">Распознано из резюме автоматически — проверьте. PDF-профиль вы можете отправить работодателю; если места работы распознаны неверно, исключите их или замените резюме.</span>
    <button class="switch" role="switch" aria-checked="${on}" data-act="pdfexp"><i></i> Включать места работы в PDF-профиль</button>
  </div>`;
}

// одна строка достижения: название, место, команда/роль, вес в сигнале, подтверждено ли
const achRow = a => `<div class="small" style="margin-top:4px">${esc(a.title)}${a.place ? ` · <span class="num">${a.place}</span> место` : ''}${a.result && !(a.place && a.place <= 3) ? ` · ${esc(RESULT[a.result] || a.result)}` : ''}${a.discipline ? ` · ${esc(a.discipline)}` : ''}${a.sport_rank ? ` · <b>${esc(a.sport_rank)}</b>` : ''}${a.team ? ` · ${esc(a.team)}` : ''}${a.role ? ` · ${esc(a.role)}` : ''}
  <span class="muted">· ${a.verified ? 'подтверждено протоколом' : 'не подтверждено'}${a.date ? ', ' + DATE(a.date) : ''}</span></div>`;

function achPanel() {
  const A = ACH;
  if (!A) return `<div class="panel stack"><div class="row sb"><h3>Достижения</h3><span class="muted small">по желанию, на грейд не влияют</span></div>
    <p class="small muted">Сохраните профиль, чтобы подключить ФСП, хакатоны, Codeforces и CTFtime.</p></div>`;
  const cf = A.codeforces, ct = A.ctftime, ok = A.consent_external;
  const cfBlock = cf && cf.verified
    ? `<b>Codeforces</b> · ${esc(cf.handle)}, рейтинг <span class="num">${Math.round(cf.rating || 0)}</span>${cf.rank ? ` (${esc(cf.rank)})` : ''}
       <br><span class="muted small">Владение подтверждено кодом в профиле Codeforces</span>${(cf.achievements || []).map(achRow).join('')}`
    : cf
      ? `<b>Codeforces</b> · ${esc(cf.handle)}, не подтверждён
         <div class="stack-s" style="margin-top:8px">${S.cfCode ? `<span class="small">Укажите код <code>${esc(S.cfCode.code)}</code> в поле «Организация» профиля Codeforces, затем нажмите «Проверить». Код действует до ${esc(new Date(S.cfCode.expires_at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}.</span>
         <span class="hint">Код показывается один раз — сохраните его. Потеряли — получите новый, прежний перестанет действовать.</span>`
         : '<span class="small">Код подтверждения показывается один раз, сразу после запроса. Получите новый код и впишите его в профиль Codeforces.</span>'}
         <div class="row"><input class="input" id="cf-h" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(cf.handle)}" style="max-width:200px"><button class="btn ghost small" data-act="cf-link">Получить новый код</button><button class="btn ghost small" data-act="cf-verify">Проверить</button></div></div>`
      : `<b>Codeforces</b> · не подключён
         <div class="row" style="margin-top:8px"><input class="input" id="cf-h" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="хэндл" style="max-width:200px" ${ok ? '' : 'disabled'}><button class="btn ghost small" data-act="cf-link" ${ok ? '' : 'disabled'}>Подключить</button></div>`;
  const ctBlock = ct
    ? `<b>CTFtime</b> · ${esc(ct.team || 'команда ' + ct.team_id)}${ct.rating != null ? `, рейтинг <span class="num">${DEC(ct.rating, 1)}</span>` : ''}${ct.role ? ` · ${esc(ct.role)}` : ''}
       <br><span class="muted small">Состав команды CTFtime не подтверждает участие: место команды учитывается с пониженным весом</span>${(ct.achievements || []).map(achRow).join('')}`
    : `<b>CTFtime</b> · не подключён
       <div class="row" style="margin-top:8px"><input class="input num" id="ctf-id" placeholder="ID команды" inputmode="numeric" style="max-width:140px" ${ok ? '' : 'disabled'}><input class="input" id="ctf-role" autocapitalize="off" placeholder="роль: web, pwn…" style="max-width:160px" ${ok ? '' : 'disabled'}><button class="btn ghost small" data-act="ctf-link" ${ok ? '' : 'disabled'}>Подключить</button></div>`;
  return `<div class="panel stack">
    <div class="row sb"><h3>Достижения</h3><span class="muted small">по желанию, на грейд не влияют</span></div>
    <div class="trust">
      <div><span class="dot ${A.fsp.some(a => a.verified) ? 'on' : ''}"></span><div><b>ФСП</b> · ${A.fsp.length ? '' : '<span class="muted">соревнований в протоколах ФСП не найдено</span>'}
        ${A.sport_rank ? `<div class="small" style="margin-top:4px">Спортивный разряд: <b>${esc(A.sport_rank)}</b></div>` : ''}
        ${A.fsp.map(achRow).join('')}<span class="muted small">Подтягивается из протоколов ФСП по ФСП ID: места, результат, дисциплина, разряд</span></div></div>
      <div><span class="dot ${A.hackathons.some(a => a.verified) ? 'on' : ''}"></span><div><b>Хакатоны</b> · ${A.hackathons.length ? '' : '<span class="muted">нет в импортированных протоколах</span>'}
        ${A.hackathons.map(achRow).join('')}<span class="muted small">Протоколы загружают организаторы</span></div></div>
      <div><span class="dot ${cf && cf.verified ? 'on' : ''}"></span><div>${cfBlock}</div></div>
      <div><span class="dot ${ct ? 'on' : ''}"></span><div>${ctBlock}</div></div>
    </div>
    <button class="switch" role="switch" aria-checked="${ok}" data-act="consent-ext"><i></i> Согласие на обработку данных внешних профилей (Codeforces, CTFtime)</button>
    ${confirmBox('revokeExt', 'Отозвать согласие? Привязки Codeforces и CTFtime и полученные из них достижения будут удалены.', 'Отозвать')}
    <span class="hint">Отзыв согласия удаляет привязки и полученные из них достижения. Достижения повышают позицию внутри категории${A.signal ? ` (сводный сигнал <span class="num">${DEC(A.signal)}</span>)` : ''}. Если их нет, штрафа нет.</span>
  </div>`;
}

          <label class="field"><span>Стек-трек</span>
            <select class="input" id="p-track">${tracks.map(t => `<option ${t === f.track ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
        </div>
        <div class="field"><span>Грейд, на который претендуете</span>
          <div class="seg" role="group">${((META && META.grades) || ['Intern', 'Junior', 'Middle', 'Senior', 'Lead']).map(g => `<button data-act="pgrade" data-v="${g}" aria-pressed="${g === f.grade}">${g}</button>`).join('')}</div>
          ${S.cv && S.cv.parsed && S.cv.parsed.grade_hint ? `<p class="small" id="grade-hint">По резюме похоже на <b>${esc(S.cv.parsed.grade_hint.grade)}</b>: ${esc(S.cv.parsed.grade_hint.why)}. Это подсказка — выберите сами, тест подтвердит или нет.</p>` : ''}

        </div>

function irtExpressHint() {
  const base = '5 заданий по минуте, по одному на компетенцию. Оценка предварительная: погрешность больше, грейд выше Middle по 5 заданиям почти не присваивается, в карточке пометка «экспресс-оценка».';
  if (ME && ME.grade && !ME.grade_express) return base + ' Ваш грейд уже подтверждён полным тестом — экспресс его не изменит.';
  if (ME && ME.grade_express) return base + ' Предварительная категория уже есть — повторный экспресс её не изменит.';
  return base + ' Кулдаун 90 дней не запускает: полный тест можно пройти сразу.';
}

const pyVal = v => v === true ? 'True' : v === false ? 'False' : v == null ? 'None' : Array.isArray(v) ? '[' + v.map(pyVal).join(', ') + ']' : JSON.stringify(v);
const tsVal = v => Array.isArray(v) ? '[' + v.map(tsVal).join(', ') + ']' : JSON.stringify(v);
const RUN_ST = { ok: 'верно', wrong: 'неверный ответ', tle: 'превышено время', mle: 'превышена память', re: 'ошибка выполнения', ce: 'ошибка компиляции', skip: 'не запускался' };

function codeTask(it) {

    </div>`;
}
// сенсорная клавиатура без Tab: отступ и обратный отступ кнопками над редактором — у курсора или у всех строк выделения
function codeIndent(back) {
  const el = document.getElementById('code-ed'), w = codeLang() === 'python' ? 4 : 2, v = el.value, s = el.selectionStart;
  if (document.activeElement !== el) return el.focus();  // без фокуса курсор неизвестно где: сначала касание в нужную строку
  let e = el.selectionEnd;
  const ls = s ? v.lastIndexOf('\n', s - 1) + 1 : 0;
  if (s === e) {
    if (!back) el.setRangeText(' '.repeat(w), s, e, 'end');
    else {  // ведущие пробелы строки, где бы ни стоял курсор
      const n = v.slice(ls, ls + w).match(/^ */)[0].length;
      if (n) el.setRangeText('', ls, ls + n, 'preserve');
    }
  } else {
    if (v[e - 1] === '\n') e--;  // выделение до начала следующей строки её не захватывает
    const cut = new RegExp(`^ {1,${w}}`);
    el.setRangeText(v.slice(ls, e).split('\n').map(l => back ? l.replace(cut, '') : ' '.repeat(w) + l).join('\n'), ls, e, 'select');
  }
  S.qCode[codeLang()] = el.value;
}
function codeEditor(it) {
  const lang = codeLang(), code = S.qCode[lang] != null ? S.qCode[lang] : it.code.templates[lang], R = S.qRun;
  const res = !R ? '' : `<div class="stack-s" id="run-res">

      <span class="small" style="color:var(--on-dark-2)">Осталось запусков: ${esc(R.runs_left)}</span>

  return `<div class="stack">

    <textarea class="code-ed" id="code-ed" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Решение">${esc(code)}</textarea>

    <div class="row"><button class="btn dark small" data-act="code-run">Запустить на примерах</button></div>
    ${res}

}
