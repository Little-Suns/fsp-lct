    S.cfCode = await api('POST', '/api/achievements/codeforces/link', { handle: document.getElementById('cf-h').value.trim() });
    await reloadAch(); toast('Хэндл сохранён: впишите код в профиль Codeforces и нажмите «Проверить»'); rerender();
  },
  async 'cf-verify'() {
    ACH = await api('POST', '/api/achievements/codeforces/verify');  // 400 — код истёк, 409 — согласие отозвано: текст сервера в тосте
    if (ACH.codeforces && ACH.codeforces.verified) S.cfCode = null;
    toast(ACH.codeforces && ACH.codeforces.verified ? 'Код найден в профиле Codeforces. Владение подтверждено' : 'Код пока не найден');
    rerender();
  },
  async 'ctf-link'() {
    const id = parseInt(document.getElementById('ctf-id').value, 10);
    if (!id) throw new Error('Укажите ID команды CTFtime');
    ACH = await api('POST', '/api/achievements/ctftime/link', { team_id: id, role: document.getElementById('ctf-role').value.trim() || null });
    toast('Команда CTFtime привязана'); rerender();
  },

  // тест-квест
  target: (a, d) => { S.target = d.v; rerender(); },
  'quest-invite': (a, d) => { S.questInvite = +d.id; go('/c/quest'); },
  async story() {
    S.story = !S.story;
    if (route() === '/c/quest/go' && S.quest && !S.quest.done) { S.quest = await api('POST', '/api/quest/start', { story: S.story }); S.qAt = Date.now(); }
    rerender();
  },
  ans: (a, d) => { S.qAns = +d.i; rerender(); },
  mark: (a, d) => { S.codeMark = +d.line; rerender(); },
  async qnext() {
    const it = S.quest.item;
    S.quest = await api('POST', '/api/quest/answer', {
      item_id: it.id, response: it.kind === 'choice' ? S.qAns : S.codeMark,
      comment: it.comment ? S.qComment : null, ms: Date.now() - S.qShownAt,
    });
    S.qAt = Date.now();
    render(); scrollTo(0, 0);
  },
  async finish() {
    try { S.finish = await api('POST', '/api/quest/finish'); }
    catch (e) { if (e.status !== 409) throw e; S.finish = null; toast(e.message); }  // повторный finish: тест уже завершён
    go('/c/result');
  },

  // кабинет кандидата
  async status(a, d) { await api('PATCH', '/api/candidate/status', { status: d.v }); ME.status = d.v; rerender(); },
  async notif(a, d) { ME.notif = (await api('PATCH', '/api/candidate/notif', { [d.k]: !(ME.notif && ME.notif[d.k]) })).notif; rerender(); },
  async accept(a, d) { D.inv = await api('POST', `/api/candidate/invites/${d.id}/accept`); toast('Приглашение принято. Компания получила ваши контакты'); rerender(); },
  'ask-decline': (a, d) => { S.declineFor = +d.id; S.declineReason = null; S.dcComment = ''; rerender(); },
  'cancel-decline': () => { S.declineFor = null; rerender(); },
  reason: (a, d) => { S.declineReason = d.v; rerender(); },
  async decline(a, d) {
    D.inv = await api('POST', `/api/candidate/invites/${d.id}/decline`, { reason: S.declineReason, comment: S.dcComment || null });
    S.declineFor = null; toast('Отказ отправлен. Компания видит только причину'); rerender();
  },

  // вакансии и задачи (кандидат)
  async 'vf-apply'() { await loadVac(); rerender(); },
  async 'vf-reset'() { S.vf = { spec: '', grade: '', format: '', city: '', q: '' }; await loadVac(); rerender(); },
  async apply(a, d) {
    try {
      await api('POST', `/api/vacancies/${d.id}/apply`, { note: S.applyNote.trim() || null });
    } catch (e) {
      if ([403, 409, 429].includes(e.status)) { S.applyErr = e.message; rerender(); return; }
      throw e;
    }
    toast('Отклик отправлен: компания видит ваши контакты'); await refresh();
  },
  async withdraw(a, d) { await api('POST', `/api/vacancies/applications/${d.id}/withdraw`); toast('Отклик отозван'); await refresh(); },
  async 'task-submit'(a, d) {
    if (!S.answer.trim()) throw new Error('Напишите решение');
    await api('POST', `/api/tasks/${d.id}/submit`, { answer: S.answer.trim(), invitation_id: S.taskInv || null });
    toast('Решение отправлено. Оценка появится в «Моих решениях»'); await refresh();
  },

  // работодатель
  async 'co-save'() {
    const v = id => document.getElementById(id).value.trim();
    D.company = await api('POST', '/api/employer/company', {
      inn: v('co-inn'), name: v('co-name'), recruiter_name: v('co-rec'), site_domain: v('co-site') || null,
      recruiter_email: v('co-mail') || null, about: v('co-about') || null,
    });
    D.co = D.company; D.coName = D.company.name;
    toast(D.company.verified ? 'Компания проверена' : 'Компания сохранена без подтверждения: квота 3 приглашения в неделю');
    if (D.company.verified) go('/e/need'); else rerender();
  },
  async parse(a) {
    a.textContent = 'Разбираю…';
    S.need.parsed = await api('POST', '/api/employer/needs/parse', { text: S.need.text });
    S.plan = null; rerender();
  },
  'need-rm': (a, d) => { const l = S.need.parsed[d.k]; l.splice(l.indexOf(d.v), 1); rerender(); },
  'need-add': (a, d) => { S.needAdd = d.k || null; rerender(); const el = document.getElementById('need-skill'); if (el) el.focus(); },
  'need-add-ok': (a, d) => {
    const s = (document.getElementById('need-skill').value || '').trim();
    const p = S.need.parsed, v = (META.skills.find(x => x.toLowerCase() === s.toLowerCase())) || s;
    if (v && !p.must.includes(v) && !p.nice.includes(v)) p[d.k].push(v);
    S.needAdd = null; rerender();
  },
  async plan() {
    S.plan = await api('POST', '/api/quest/plan', S.need.parsed ? { text: S.need.text } : { need_id: S.needId });
    rerender();
  },
  async 'need-save'() {
    const p = S.need.parsed;
    const n = await api('POST', '/api/employer/needs', {
      text: S.need.text, spec: p.spec, track: p.track, grade: p.grade, must: p.must, nice: p.nice,
      salary_from: p.from, salary_to: p.to, format: p.format, city: p.city, parsed_by: p.parsed_by,
    });
    S.needId = n.id; S.needObj = n; S.lot = null; S.filters.clear(); S.inviteForm = null; S.need.parsed = null; S.plan = null;
    go('/e/picks');
  },
  async filter(a, d) { S.filters.has(d.k) ? S.filters.delete(d.k) : S.filters.add(d.k); await loadPicks(); rerender(); },
  'lot-skill': (a, d) => { const m = S.lot.must; m.includes(d.v) ? m.splice(m.indexOf(d.v), 1) : m.push(d.v); rerender(); },
  'lot-free': () => { S.lot.require_free = !S.lot.require_free; rerender(); },
  async 'lot-create'() {
    const n = S.needObj, L = S.lot;
    if (!L.fork_to) throw new Error('Укажите верхнюю границу ожиданий');
    L.created = await api('POST', '/api/lottery/', {
      need_id: n.id, draw_count: L.draw_count,
      threshold: { spec: n.spec, track: n.track, grade_min: n.grade, must_skills: L.must, fork_to: L.fork_to, require_free: L.require_free },
    });
    rerender();
  },
  async 'lot-draw'() { S.lot.drawn = await api('POST', `/api/lottery/${S.lot.created.id}/draw`); rerender(); },
  async 'lot-verify'() { S.lot.verify = await api('GET', `/api/lottery/${S.lot.created.id}/verify`); rerender(); },
  'lot-reset': () => { Object.assign(S.lot, { created: null, drawn: null, verify: null }); rerender(); },
  invite: (a, d) => go('/e/invite/' + d.id),
  fmt: (a, d) => { S.inviteForm.format = d.v; S.inviteForm.server = null; rerender(); },
  async fb(a, d) {
    await api('POST', `/api/employer/invites/${d.id}/feedback`, { value: d.v });
    toast('Спасибо. Отметка уйдёт в калибровку теста'); await refresh();
  },

  // поиск по банку
  async 'sf-apply'() { S.sf.page = 1; await loadSearch(); rerender(); },
  async 'sf-reset'() { S.sf = { spec: '', track: '', grade: '', skills: '', q: '', fsp: false, cf: false, hackathon: false, format: '', city: '', page: 1 }; await loadSearch(); rerender(); },
  async 'sf-flag'(a, d) { S.sf[d.k] = !S.sf[d.k]; S.sf.page = 1; await loadSearch(); rerender(); },
  async 'sf-facet'(a, d) { S.sf[d.k] = S.sf[d.k] === d.v ? '' : d.v; if (d.k === 'spec') S.sf.track = ''; S.sf.page = 1; await loadSearch(); rerender(); },
  async 'sf-page'(a, d) { S.sf.page = +d.v; await loadSearch(); render(); scrollTo(0, 0); },

  // вакансии (работодатель)
  'vac-new': () => { S.vform = vformFrom(null); rerender(); },
  'vac-edit': (a, d) => { S.vform = vformFrom(D.myvac.find(v => v.id === +d.id)); rerender(); scrollTo(0, 0); },
  'vac-cancel': () => { S.vform = null; rerender(); },
  'vx-set': (a, d) => { S.vform[d.k] = d.v; S.vform.server = null; rerender(); },
  async 'vac-save'() {
    const f = S.vform;
    const body = { title: f.title, description: f.description, spec: f.spec, track: f.track || null, grade: f.grade, must: skillList(f.must), nice: skillList(f.nice), salary_from: f.from, salary_to: f.to, format: f.format, city: f.city || null };
    let r;
    try {
      r = f.id ? await api('PATCH', `/api/vacancies/${f.id}`, body) : await api('POST', '/api/vacancies', body);
    } catch (e) {
      if (e.status === 422 && e.detail && e.detail.errors) { f.server = e.detail; rerender(); return; }
      throw e;
    }
    S.vform = null;
    toast((f.id ? 'Вакансия сохранена' : 'Вакансия опубликована') + (r.warnings && r.warnings.length ? '. ' + r.warnings[0] : ''));
    await refresh();
  },
  async 'vac-close'(a, d) { await api('POST', `/api/vacancies/${d.id}/close`); toast('Вакансия закрыта'); await refresh(); },
  'app-decline': (a, d) => { S.appDecline = d.id ? +d.id : null; S.appReason = null; rerender(); },
  'app-reason': (a, d) => { S.appReason = d.v; rerender(); },
  async 'app-status'(a, d) {
    await api('POST', `/api/vacancies/applications/${d.id}/status`, { status: d.v, reason: d.v === 'declined' ? S.appReason : null });
    S.appDecline = null;
    toast({ seen: 'Отмечено как просмотренное', accepted: 'Кандидат приглашён на интервью', declined: 'Отказ отправлен' }[d.v]); await refresh();
  },

  // задания (работодатель)
  'task-new': () => { const n = S.needObj; S.tform = { title: '', text: '', spec: n ? n.spec : 'Backend', competency: '', kind: 'approach', minutes: 45, public: true, link: false }; rerender(); },
  'task-cancel': () => { S.tform = null; rerender(); },
  'tx-set': (a, d) => { S.tform[d.k] = d.k === 'public' || d.k === 'link' ? !S.tform[d.k] : d.v; rerender(); },
  async 'task-save'() {
    const f = S.tform;
    await api('POST', '/api/tasks', { title: f.title, text: f.text, spec: f.spec, competency: f.competency || null, kind: f.kind, minutes: f.minutes, public: f.public, need_id: f.link && S.needObj ? S.needObj.id : null });
    S.tform = null; toast('Задание создано'); await refresh();
  },
  async review(a, d) {
    const c = document.getElementById('rvc-' + d.id);
    await api('POST', `/api/tasks/submissions/${d.id}/review`, { review: d.v, comment: c && c.value.trim() ? c.value.trim() : null });
    toast('Оценка сохранена'); await refresh();
  },
};

Object.assign(ACT, { 'chat-send': chatSend, 'chat-more': chatMore });
// ponytail: SSE живёт в памяти одного процесса (Hub в services/chat.py); при нескольких воркерах — Redis pub/sub.
document.addEventListener('visibilitychange', () => { if (!document.hidden) chatNudge(); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.querySelector('[data-act="chat-send"]').click(); }
});

addEventListener('hashchange', () => { closeMap(); show(); });

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'close-map' && (e.target === a || a.tagName === 'BUTTON')) { closeMap(); return; }
  if (g && !g.disabled) { e.preventDefault(); if (route() === g.dataset.go) { closeMap(); } else go(g.dataset.go); return; }
  if (!a || a.disabled || a.matches(':disabled') || !ACT[a.dataset.act]) return;
  e.preventDefault();
  capture();
  const p = ACT[a.dataset.act](a, a.dataset);
  if (p && p.then) { a.disabled = true; p.catch(fail).finally(() => { a.disabled = false; }); }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'p-spec') { capture(); S.pf.track = ((META && META.tracks[t.value]) || [])[0] || null; rerender(); }
  if (t.id === 'vx-spec') { capture(); S.vform.track = ''; rerender(); }
  if (t.id === 'tx-spec') { capture(); S.tform.competency = ''; rerender(); }
  if (t.id === 'sf-spec') { capture(); S.sf.track = ''; rerender(); }
  if (t.id === 'cv-file' && t.files[0]) {
    capture();
    const fd = new FormData();
    fd.append('file', t.files[0]);
    try {
      S.cv = await api('POST', '/api/candidate/cv', fd);
      const p = S.cv.parsed;
      if (p.spec) { S.pf.spec = p.spec; S.pf.track = p.track || ((META && META.tracks[p.spec]) || [])[0] || null; }
      if (p.skills.length) S.pf.skills = p.skills;
      if (p.years_exp != null) S.pf.years = p.years_exp;
      if (p.roles.length) S.pf.roles = p.roles;
      if (p.soft_skills.length) S.pf.soft = p.soft_skills;
      if (!S.pf.name && p.contacts.name) S.pf.name = p.contacts.name;  // своё не перетираем
      if (!S.pf.tg && p.contacts.tg) S.pf.tg = p.contacts.tg;
      if (ME) ME.experience = p.experience;  // профиль уже есть — сервер сохранил текст резюме, PDF возьмёт новые места работы
      toast('Резюме разобрано: проверьте поля'); rerender();
    } catch (err) { fail(err); }
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'ap-note') { const el = document.getElementById('ap-left'); if (el) el.textContent = (300 - e.target.value.length) + ' символов'; }
  if (!S.inviteForm || !document.getElementById('inv-form')) return;
  const id = e.target.id;
  if (id === 'f-from' || id === 'f-to') {
    const v = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0;
    S.inviteForm[id === 'f-from' ? 'from' : 'to'] = v;
    S.inviteForm.server = null;
    // перерисовываем только сообщения и кнопку, чтобы не терять фокус
    const tmp = document.createElement('div');
    tmp.innerHTML = inviteFormView();
    document.getElementById('f-msgs').innerHTML = tmp.querySelector('#f-msgs').innerHTML;
    document.querySelector('#inv-form [type=submit]').disabled = tmp.querySelector('#inv-form [type=submit]').disabled;
  }
  if (id === 'f-role') S.inviteForm.role = e.target.value;
  if (id === 'f-desc') S.inviteForm.desc = e.target.value;
  if (id === 'f-task') S.inviteForm.task = e.target.checked;
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'inv-form') return;
  e.preventDefault();
  const f = S.inviteForm, n = S.needObj, btn = e.target.querySelector('[type=submit]');
  btn.disabled = true;
  try {
    const r = await api('POST', '/api/employer/invites', {
      candidate_id: f.cid, need_id: n ? n.id : null, role: f.role, salary_from: f.from, salary_to: f.to,
      lottery_id: S.lot && S.lot.drawn && S.lot.drawn.drawn.some(d => d.public_id === f.cid) ? S.lot.created.id : null,
      format: f.format + (f.format !== 'Удалённо' && n && n.city ? ', ' + n.city : ''), description: f.desc,
      task: f.task ? 'Разбор инцидента с дублями платежей: ~45 минут, заменяет первый созвон' : null,
    });
    S.inviteForm = null;
    toast(r.warnings.length ? 'Приглашение отправлено. ' + r.warnings[0] : 'Приглашение отправлено. Кандидат получит письмо и сообщение в Telegram');
    go('/e/pipeline');
  } catch (err) {
    if (err.status === 422 && err.detail && err.detail.errors) { f.server = err.detail; rerender(); }
    else if (err.status === 409 || err.status === 429) { f.server = { errors: [err.message], warnings: [] }; rerender(); }  // ёмкость, дубль, квота — блокирующие ошибки
    else fail(err);
    btn.disabled = false;
  }
});

addEventListener('keydown', e => { if (e.key === 'Escape') closeMap(); });
fspReturn().catch(fail).finally(() => show());
</script>
</body>
</html>
