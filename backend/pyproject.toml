[project]
name = "fsp-career-backend"
version = "0.1.0"
description = "ФСП Карьера — бэкенд платформы обратного найма"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "alembic>=1.20.0",
    "fpdf2>=2.8",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: засев синтетики, несколько секунд (пропустить: -m 'not slow')"]

[tool.coverage.run]
source = ["app", "seed"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
