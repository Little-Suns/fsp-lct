# Миграции схемы БД. Адрес базы — из DATABASE_URL (app.config), здесь не задаётся.
# Новая ревизия: uv run alembic revision --autogenerate --rev-id NNNN_slug -m "что меняется"
[alembic]
script_location = %(here)s/migrations
# имя файла = id ревизии (0001_baseline.py)
file_template = %%(rev)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
